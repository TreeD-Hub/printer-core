# ==========================================
# ЛОКАЛЬНЫЕ OVERRIDE — KLIPPER RUNTIME
# ==========================================
# Назначение:
# - Показывает примеры локальных настроек для конкретного host.
# - Документирует runtime override, которые не входят в штатный профиль.
# Контур:
# - runtime-only: `local_overrides.cfg` не хранится в Git и не перезаписывается деплоем.
# - local: включать только проверенные значения конкретного принтера.

# Блок 1: Правило локальных override.
# Не дублировать уже объявленные секции `[printer]`, `[extruder]`,
# `[gcode_macro ...]`: Klipper воспринимает это как конфликт секций.
# Для runtime-переменных использовать `SET_GCODE_VARIABLE`.

# Блок 2: Единая геометрия принтера.
# Область печати равна полному ходу `[stepper_x]` / `[stepper_y]`, XY-смещение нулевое.
# `_TREED_PRINT_OFFSET_ENABLE` обновляет зеркало `_TREED_GEOMETRY_CFG` из пределов осей.
# Отдельные overrides размеров и print-offset больше не задаются.

# Блок 3: Raw-парковка PAUSE/M600.
# [delayed_gcode _TREED_LOCAL_PARK_OVERRIDE]
# initial_duration: 0.1
# gcode:
#   SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_PARK_CFG VARIABLE=park_x_raw VALUE=122.5
#   # None выбирает Y min перемещения; число задаёт raw Y явно.
#   SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_PARK_CFG VARIABLE=park_y_raw VALUE=None
