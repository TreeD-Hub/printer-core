# Локальные оверрайды для этой конкретной Pi.
# Файл local_overrides.cfg НЕ под Git, деплоем НЕ трогается.
#
# Примеры:
#
# [printer]
# max_velocity: 220
# max_accel: 4500
#
# [extruder]
# pressure_advance: 0.05
#
# Двухзонная модель RN12 (пример override).
# [gcode_macro _TREED_PRINT_AREA_CFG]
# variable_print_offset_y: 65.0
# variable_print_size_y: 180.0
#
# Raw-парковка PAUSE/M600 (пример override).
# [gcode_macro _TREED_PAUSE_PARK_CFG]
# variable_park_x_raw: 5.0
# variable_park_y_raw: 5.0
# variable_park_y_raw_fallback: 30.0
