# ==========================================
# ЛОКАЛЬНЫЕ OVERRIDE — KLIPPER RUNTIME
# ==========================================
# Назначение:
# - Показывает примеры локальных настроек для конкретного host.
# - Документирует runtime override, которые не входят в штатный профиль.
# Контур:
# - runtime-only: `local_overrides.cfg` не хранится в Git и не перезаписывается деплоем.
# - local: включать только проверенные значения конкретного принтера.

# Блок 1: Правило локальных override.
# Не дублировать уже объявленные секции `[printer]`, `[extruder]`,
# `[gcode_macro ...]`: Klipper воспринимает это как конфликт секций.
# Для runtime-переменных использовать `SET_GCODE_VARIABLE`.

# Блок 2: Единая геометрия принтера.
# [delayed_gcode _TREED_LOCAL_GEOMETRY_OVERRIDE]
# initial_duration: 0.1
# gcode:
#   SET_GCODE_VARIABLE MACRO=_TREED_GEOMETRY_CFG VARIABLE=print_offset_y VALUE=65.0
#   SET_GCODE_VARIABLE MACRO=_TREED_GEOMETRY_CFG VARIABLE=print_size_x VALUE=245.0
#   SET_GCODE_VARIABLE MACRO=_TREED_GEOMETRY_CFG VARIABLE=print_size_y VALUE=180.0
#   SET_GCODE_VARIABLE MACRO=_TREED_GEOMETRY_CFG VARIABLE=bed_origin_x VALUE=0.0
#   SET_GCODE_VARIABLE MACRO=_TREED_GEOMETRY_CFG VARIABLE=bed_origin_y VALUE=65.0
#   SET_GCODE_VARIABLE MACRO=_TREED_GEOMETRY_CFG VARIABLE=bed_size_x VALUE=245.0
#   SET_GCODE_VARIABLE MACRO=_TREED_GEOMETRY_CFG VARIABLE=bed_size_y VALUE=180.0

# Блок 3: Raw-парковка PAUSE/M600.
# [delayed_gcode _TREED_LOCAL_PARK_OVERRIDE]
# initial_duration: 0.1
# gcode:
#   SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_PARK_CFG VARIABLE=park_x_raw VALUE=122.5
#   SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_PARK_CFG VARIABLE=park_y_raw VALUE=0.0
#   SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_PARK_CFG VARIABLE=park_y_raw_fallback VALUE=30.0

# Блок 4: Legacy include Eddy force_move.
# Больше не нужен: `[force_move]` объявлен в штатном Eddy-профиле.
# Файл `eddy_force_move_calibration.cfg` оставлен no-op только для совместимости.
