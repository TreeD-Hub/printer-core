# Runtime-generated by treed_filament_sensor.py.
# Edit through /server/treed/filament-sensor/settings only.
[gcode_macro _FILAMENT_SENSOR_SENSITIVITY_STATE]
description: "Filament sensor: configured encoder sensitivity"
variable_sensitivity: "medium"
gcode:

[filament_motion_sensor filament_motion]
switch_pin: PG12
detection_length: 15.0
extruder: extruder
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.5

runout_gcode:
  _TREED_FILAMENT_RUNOUT_PAUSE SOURCE=filament_motion MSG="Filament encoder runout: no filament motion"

insert_gcode:
  RESPOND PREFIX="filament" MSG="Filament encoder signal restored"
