# ==========================================
# ADXL345 ЧЕРЕЗ RASPBERRY PI (SPI) + RESONANCE TESTER
# ==========================================
# Назначение:
# - Подключает host MCU на Pi для работы датчика ADXL345 по SPI.
# - Содержит базовый блок [resonance_tester] для измерения резонансов.
#
# Важно:
# - Перед включением include на Pi должны быть включены SPI и `klipper_mcu`.
# - Конфиг рассчитан на подключение ADXL345 к SPI0 CE0 (`/dev/spidev0.0`).
# - Для CE1 обычно достаточно заменить `spi_bus: spidev0.0` на `spi_bus: spidev0.1`.
# - Если на конкретной сборке `cs_pin: rpi:None` не работает, используйте явный CS
#   (`rpi:gpio8` для CE0 или `rpi:gpio7` для CE1).
# - Текущий рабочий маппинг осей: `axes_map: z, x, y`.
#   После поворота датчика axes_map нужно перепроверять перед замерами резонансов.

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0
# Рабочий axes_map для текущего физического монтажа датчика.
axes_map: z, x, y
# rate: 3200
# spi_speed: 5000000

[resonance_tester]
accel_chip: adxl345
probe_points:
  122.5,122.5,20
min_freq: 5
max_freq: 133
accel_per_hz: 75
hz_per_sec: 1
