# ==========================================
# INPUT SHAPER
# ==========================================
# Назначение:
# - Резонансная компенсация на осях X/Y.
#
# Важно:
# - Значения частот должны приходить из калибровки (ADXL).
# - `shaper_freq_* = 0` оставляет компенсацию фактически отключенной.

[input_shaper]
shaper_type_x: mzv
shaper_type_y: mzv
shaper_freq_x: 0
shaper_freq_y: 0
damping_ratio_x: 0.10
damping_ratio_y: 0.10
