# ==========================================
# КОНФИГ ПОДКЛЮЧЕНИЯ MCU — MKS ROBIN NANO 1.2
# ==========================================
# Назначение:
# - Определяет канал связи Klipper host -> плата MCU.
# - `serial` управляется шагом loader/steps/klipper-profiles.sh.
# - Режим выбирается через TREED_MCU_TRANSPORT:
#   - usb  -> /dev/serial/by-id/*
#   - uart -> TREED_MCU_UART_DEV (по умолчанию /dev/serial0)

[mcu]
serial: /dev/serial/by-id/REPLACE_ME
# Для serial-транспорта фиксируем baud явно (вместо неявного дефолта).
baud: 250000
restart_method: command

# CAN не используется в текущем профиле (USB/UART). При переходе на CAN:
# canbus_uuid: <uuid>
# canbus_interface: can0
