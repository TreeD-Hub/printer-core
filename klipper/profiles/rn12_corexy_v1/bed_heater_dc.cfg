# ==========================================
# КОНФИГ НАГРЕВА СТОЛА (DC) — RN12 CoreXY V1
# ==========================================
# Назначение:
# - Описывает нагреватель стола, датчик температуры и лимиты.
# - Задает верификацию разогрева через [verify_heater heater_bed].

# Основной блок нагревателя стола.
[heater_bed]
heater_pin: PA0
sensor_type: NTC100K_B3950
sensor_pin: PC0
pullup_resistor: 4700
smooth_time: 1.0
# Переход на PID-регулирование стола.
# Эти коэффициенты стартовые: после прогрева на принтере
# обязательно выполнить PID_CALIBRATE и обновить значения.
control: pid
# Базовые PID-коэффициенты зафиксированы в профильном файле.
# Для конкретного экземпляра принтера `SAVE_CONFIG` может сохранить runtime-override.
pid_kp: 62.937
pid_ki: 1.165
pid_kd: 849.647
min_temp: 5
max_temp: 120
max_power: 1.00
pwm_cycle_time: 0.100
# max_delta: 2.0  # используется только при control: watermark

# Контроль корректности набора температуры стола.
[verify_heater heater_bed]
max_error: 120
check_gain_time: 300
hysteresis: 5
heating_gain: 2
