# ==========================================
# КОНФИГ ВЕНТИЛЯТОРОВ — RN12 CoreXY V1
# ==========================================
# Назначение:
# - Управляет обдувом модели ([fan]).
# - Ниже сохранен пример heater_fan для хотэнда (сейчас выключен).

# Пример сервисного вентилятора хотэнда (не активен в текущем профиле).
#[heater_fan hotend_fan]
#pin: PB0
#heater: extruder
#heater_temp: 60.0
#max_power: 1.0
#kick_start_time: 0.5
#shutdown_speed: 1.0

# Рабочий вентилятор обдува модели.
[fan]
pin: PB1
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.5
off_below: 0.15
