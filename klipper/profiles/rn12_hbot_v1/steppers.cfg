# ==========================================
# КОНФИГ ОСЕЙ X/Y/Z — RN12 HBOT V1
# ==========================================
# Назначение:
# - Для каждой оси хранит полный набор параметров:
#   шаг/направление/enable, геометрию шага, концевик и пределы.
# - Разнесение одной оси по разным файлам не используется.
# - Внутри каждой оси параметры сгруппированы по логическим блокам.

# Ось X: мотор + концевик + границы.
[stepper_x]
# Пины мотора
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4

# Кинематика шага
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Концевик и границы
endstop_pin: ^PA15
position_endstop: 245
position_min: 0
position_max: 245

# Хоуминг
homing_positive_dir: true
homing_speed: 50
homing_retract_dist: 5
homing_retract_speed: 50
second_homing_speed: 25

# Ось Y: мотор + концевик + границы.
[stepper_y]
# Пины мотора
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1

# Кинематика шага
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Концевик и границы
endstop_pin: ^PA12
position_endstop: 245
position_min: 0
position_max: 245

# Хоуминг
homing_positive_dir: true
homing_speed: 50
homing_retract_dist: 5
homing_retract_speed: 50
second_homing_speed: 25

# Ось Z: мотор + концевик + границы.
[stepper_z]
# Пины мотора
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8

# Кинематика шага
rotation_distance: 2
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Концевик и границы
endstop_pin: ^PA11
position_endstop: 0
position_min: -1
position_max: 200

# Хоуминг
homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5
second_homing_speed: 5
