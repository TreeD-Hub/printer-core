# ==========================================
# КОНФИГ ОСЕЙ X/Y/Z — RN12 HBOT V1
# ==========================================
# Назначение:
# - Для каждой оси хранит полный набор параметров:
#   шаг/направление/enable, геометрию шага, концевик и пределы.
# - Разнесение одной оси по разным файлам не используется.

# Ось X: мотор + концевик + границы.
[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
rotation_distance: 40
microsteps: 16
endstop_pin: ^PA15
position_endstop: 245
position_min: 0
position_max: 245
homing_positive_dir: true
homing_speed: 50

# Ось Y: мотор + концевик + границы.
[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
rotation_distance: 40
microsteps: 16
endstop_pin: ^PA12
position_endstop: 180
position_min: 0
position_max: 180
homing_positive_dir: true
homing_speed: 50

# Ось Z: мотор + концевик + границы.
[stepper_z]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
rotation_distance: 2
microsteps: 16
endstop_pin: ^PA11
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 5
