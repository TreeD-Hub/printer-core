# ==========================================
# ОПЦИОНАЛЬНЫЙ КОНФИГ ДАТЧИКА ФИЛАМЕНТА
# ==========================================
# Назначение:
# - Шаблон для [filament_switch_sensor].
# - Сейчас отключен и не подключается в klipper/printer.cfg.
# - Для включения: раскомментировать include в `klipper/printer.cfg`
#   и проверить соответствие `switch_pin` фактической распиновке.

[filament_switch_sensor filament]
switch_pin: PB2
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
debounce_delay: 0.1
runout_gcode:
  PAUSE
insert_gcode:
  RESUME
