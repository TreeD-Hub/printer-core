# ==========================================
# ПАУЗА / ВОЗОБНОВЛЕНИЕ / ОТМЕНА
# ==========================================
# Принцип:
# - публичные макросы: PAUSE, RESUME, CANCEL_PRINT, CLEAR_PAUSE;
# - сложная логика вынесена в private-хелперы _TREED_PAUSE_* и _TREED_RESUME_*;
# - порядок side-effects сохранен для совместимости с текущим workflow.

# Состояние активной паузы между PAUSE и RESUME/CANCEL.
[gcode_macro _TREED_PAUSE_STATE]
variable_hotend_target: 0
variable_bed_target: 0
variable_idle_timeout_prev: 600
variable_is_active: 0
gcode:

# Расчетные координаты парка и подъема для текущей PAUSE-сессии.
[gcode_macro _TREED_PAUSE_EXEC_STATE]
variable_park_x: 0
variable_park_y: 0
variable_lift_z: 0
gcode:

# Фаза PAUSE-1: сбор состояния, координат и флагов камеры.
[gcode_macro _TREED_PAUSE_PREP_STATE]
description: "SYSTEM: подготовка состояния PAUSE"
gcode:
  _TREED_REQUIRE_HEATER_BED
  {% set toolhead = printer.toolhead %}
  {% set gmove = printer.gcode_move %}
  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set z_min = toolhead.axis_minimum.z|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set z_max = toolhead.axis_maximum.z|float %}
  {% set park_cfg = printer["gcode_macro _TREED_PAUSE_PARK_CFG"] %}
  {% set park_x = x_min + park_cfg.park_x_offset_from_min|float %}
  {% set park_y = y_min + park_cfg.park_y_offset_from_min|float %}
  {% if park_x < x_min %}{% set park_x = x_min %}{% endif %}
  {% if park_y < y_min %}{% set park_y = y_min %}{% endif %}
  {% if park_x > x_max - 2.0 %}{% set park_x = x_max - 2.0 %}{% endif %}
  {% if park_y > y_max - 2.0 %}{% set park_y = y_max - 2.0 %}{% endif %}
  {% set lift_z = gmove.position.z + 10.0 %}
  {% if lift_z > z_max - 1.0 %}{% set lift_z = z_max - 1.0 %}{% endif %}
  {% if lift_z < z_min + 2.0 %}{% set lift_z = z_min + 2.0 %}{% endif %}
  {% set hotend_target = printer.extruder.target|default(0)|float %}
  {% set bed_target = printer.heater_bed.target|default(0)|float %}
  {% set idle_timeout_prev = printer.configfile.settings.idle_timeout.timeout|default(600)|float %}

  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=hotend_target VALUE={hotend_target}
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=bed_target VALUE={bed_target}
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=idle_timeout_prev VALUE={idle_timeout_prev}
  SET_GCODE_VARIABLE MACRO=_TREED_CAM_STATE VARIABLE=was_enabled_before_pause VALUE={printer["gcode_macro _TREED_CAM_STATE"].enabled|int}
  SET_GCODE_VARIABLE MACRO=_TREED_CAM_STATE VARIABLE=enabled VALUE=0
  UPDATE_DELAYED_GCODE ID=_TREED_CAM_TICK DURATION=0
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_EXEC_STATE VARIABLE=park_x VALUE={park_x}
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_EXEC_STATE VARIABLE=park_y VALUE={park_y}
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_EXEC_STATE VARIABLE=lift_z VALUE={lift_z}

# Фаза PAUSE-2: фактическая парковка и переключение в режим паузы.
[gcode_macro _TREED_PAUSE_EXEC]
description: "SYSTEM: выполнение PAUSE"
gcode:
  {% set exec_state = printer["gcode_macro _TREED_PAUSE_EXEC_STATE"] %}
  PAUSE_BASE
  M83
  G92 E0
  G1 E-5 F1800
  # В рабочем контуре PAUSE/M600 вызываются во время печати после G28.
  G90
  G1 Z{exec_state.lift_z|float} F300
  G1 X{exec_state.park_x|float} Y{exec_state.park_y|float} F6000
  M104 S140
  SET_IDLE_TIMEOUT TIMEOUT=43200
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=is_active VALUE=1

# Расчетная геометрия wipe для RESUME.
[gcode_macro _TREED_RESUME_WIPE_STATE]
variable_x_start: 0
variable_y_start: 0
variable_x_right: 0
gcode:

# Фаза RESUME-1: подготовка траектории wipe.
[gcode_macro _TREED_RESUME_PREP_WIPE]
description: "SYSTEM: подготовка геометрии wipe для RESUME"
gcode:
  {% set gmove = printer.gcode_move %}
  {% set toolhead = printer.toolhead %}
  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set x_start = gmove.position.x|float %}
  {% set y_start = gmove.position.y|float %}
  {% if x_start < x_min + 1.0 %}{% set x_start = x_min + 1.0 %}{% endif %}
  {% if x_start > x_max - 1.0 %}{% set x_start = x_max - 1.0 %}{% endif %}
  {% if y_start < y_min + 1.0 %}{% set y_start = y_min + 1.0 %}{% endif %}
  {% if y_start > y_max - 1.0 %}{% set y_start = y_max - 1.0 %}{% endif %}
  {% set x_right = x_start + 20.0 %}
  {% if x_right > x_max - 1.0 %}{% set x_right = x_max - 1.0 %}{% endif %}
  {% if x_right < x_start + 2.0 %}{% set x_right = x_start + 2.0 %}{% endif %}

  SET_GCODE_VARIABLE MACRO=_TREED_RESUME_WIPE_STATE VARIABLE=x_start VALUE={x_start}
  SET_GCODE_VARIABLE MACRO=_TREED_RESUME_WIPE_STATE VARIABLE=y_start VALUE={y_start}
  SET_GCODE_VARIABLE MACRO=_TREED_RESUME_WIPE_STATE VARIABLE=x_right VALUE={x_right}

# Фаза RESUME-2: прогрев, purge и линейный wipe.
[gcode_macro _TREED_RESUME_HEAT_PURGE_WIPE]
description: "SYSTEM: прогрев, purge и wipe для RESUME"
gcode:
  _TREED_REQUIRE_HEATER_BED
  {% set pause_state = printer["gcode_macro _TREED_PAUSE_STATE"] %}
  {% set hotend_target = pause_state.hotend_target|float %}
  {% set bed_target = pause_state.bed_target|float %}
  {% set wipe = printer["gcode_macro _TREED_RESUME_WIPE_STATE"] %}

  {% if bed_target > 0 %}
    M190 S{bed_target}
  {% endif %}
  {% if hotend_target > 0 %}
    M109 S{hotend_target}
  {% endif %}
  M83
  G92 E0
  G1 E50 F600
  G10
  G90
  G1 X{wipe.x_start|float} Y{wipe.y_start|float} F9000
  G1 X{wipe.x_right|float} Y{wipe.y_start|float} F9000
  G1 X{wipe.x_start|float} Y{wipe.y_start|float} F9000

# Фаза RESUME-3: восстановление idle timeout.
[gcode_macro _TREED_RESUME_FINALIZE]
description: "SYSTEM: финализация RESUME до RESUME_BASE"
gcode:
  {% set idle_timeout_prev = printer["gcode_macro _TREED_PAUSE_STATE"].idle_timeout_prev|float %}
  {% if idle_timeout_prev >= 1 %}
    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout_prev|int}
  {% endif %}

# Фаза RESUME-4: пост-хуки (камера + очистка pause-state).
[gcode_macro _TREED_RESUME_POST_HOOKS]
description: "SYSTEM: пост-хуки RESUME"
gcode:
  {% if printer["gcode_macro _TREED_CAM_STATE"].was_enabled_before_pause|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_TREED_CAM_STATE VARIABLE=enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=_TREED_CAM_TICK DURATION=1
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_TREED_CAM_STATE VARIABLE=was_enabled_before_pause VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=hotend_target VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=bed_target VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=idle_timeout_prev VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=is_active VALUE=0

# Обертка CLEAR_PAUSE:
# - очищает внутреннее состояние _TREED_PAUSE_STATE;
# - возвращает idle_timeout;
# - сбрасывает state активной паузы.
[gcode_macro CLEAR_PAUSE]
description: "SYSTEM: TreeD clear pause"
rename_existing: CLEAR_PAUSE_BASE
gcode:
  {% set pause_state = printer["gcode_macro _TREED_PAUSE_STATE"] %}
  {% set was_active = pause_state.is_active|int %}
  {% if was_active == 1 and pause_state.idle_timeout_prev|float >= 1 %}
    SET_IDLE_TIMEOUT TIMEOUT={pause_state.idle_timeout_prev|int}
  {% endif %}
  CLEAR_PAUSE_BASE
  {% if was_active == 1 %}
    SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=hotend_target VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=bed_target VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=idle_timeout_prev VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=is_active VALUE=0
  {% endif %}

# Обертка штатной отмены печати с гарантированной остановкой камеры.
[gcode_macro CANCEL_PRINT]
description: "TreeD: отмена печати (без XY, с подъемом Z, отключение нагревов/обдува, камера, базовый CANCEL)"
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% set has_bed = printer.heater_bed is defined %}
  {% set toolhead = printer.toolhead %}
  {% set gmove = printer.gcode_move %}
  {% set z_min = toolhead.axis_minimum.z|float %}
  {% set z_max = toolhead.axis_maximum.z|float %}
  {% set z_range = z_max - z_min %}
  {% set cancel_lift = z_range * 0.05 %}
  {% if cancel_lift < 3.0 %}{% set cancel_lift = 3.0 %}{% endif %}
  {% if cancel_lift > 20.0 %}{% set cancel_lift = 20.0 %}{% endif %}
  {% set target_z = gmove.position.z + cancel_lift %}
  {% if target_z > z_max - 1.0 %}{% set target_z = z_max - 1.0 %}{% endif %}
  {% if target_z < z_min + 1.0 %}{% set target_z = z_min + 1.0 %}{% endif %}
  {% if "z" in toolhead.homed_axes %}
    G90
    G1 Z{target_z} F300
  {% endif %}

  {% set pause_state = printer["gcode_macro _TREED_PAUSE_STATE"] %}
  {% if pause_state.is_active|int == 1 and pause_state.idle_timeout_prev|float >= 1 %}
    SET_IDLE_TIMEOUT TIMEOUT={pause_state.idle_timeout_prev|int}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=hotend_target VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=bed_target VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=idle_timeout_prev VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PAUSE_STATE VARIABLE=is_active VALUE=0
  M106 S0
  M104 S0
  {% if has_bed %}
    M140 S0
  {% endif %}
  _TREED_CAM_STOP
  CANCEL_PRINT_BASE

# Пауза печати: парковка, E-5, сопло 140C, удержание моторов и пауза камеры.
[gcode_macro PAUSE]
description: "TreeD: пауза печати (park + E-5 + hotend=140 + hold motors)"
rename_existing: PAUSE_BASE
gcode:
  {% set pause_state = printer["gcode_macro _TREED_PAUSE_STATE"] %}
  {% if pause_state.is_active|int == 1 %}
    RESPOND PREFIX="treed" MSG="PAUSE уже активна"
  {% else %}
    _TREED_PAUSE_PREP_STATE
    _TREED_PAUSE_EXEC
  {% endif %}

# Возобновление печати: восстановление температур, purge, G10 и линейный wipe.
[gcode_macro RESUME]
description: "TreeD: RESUME с прогревом, purge и линейным wipe"
rename_existing: RESUME_BASE
gcode:
  {% set pause_state = printer["gcode_macro _TREED_PAUSE_STATE"] %}
  {% set pause_active = pause_state.is_active|int %}
  _TREED_RESUME_PREP_WIPE
  {% if pause_active == 1 %}
    _TREED_RESUME_HEAT_PURGE_WIPE
    _TREED_RESUME_FINALIZE
  {% endif %}
  RESUME_BASE
  _TREED_RESUME_POST_HOOKS
