# ==========================================
# ЗВУКОВЫЕ УВЕДОМЛЕНИЯ (BEEPER) — RN12 HBOT V1
# ==========================================
# Назначение:
# - Инициализирует бипер на плате MKS Robin Nano (PC5).
# - Добавляет поддержку классического M300 (S=частота, P=длительность).
# - Проигрывает стартовую мелодию один раз за загрузку ОС.

[output_pin treed_beeper]
pin: PC5
pwm: True
hardware_pwm: False
scale: 1.0
value: 0
shutdown_value: 0
cycle_time: 0.001

[gcode_macro TREED_BEEPER]
description: "SYSTEM: параметры бипера (enabled/volume)"
# Единый флаг управления звуком:
# - 1 = звук включен (M300/BEEP + стартовая мелодия)
# - 0 = звук полностью отключен
variable_enabled: 1
variable_volume: 0.30
gcode:

[gcode_macro M300]
description: "Классический бипер: M300 S<Hz> P<ms> V<0..1>"
gcode:
  {% set cfg = printer["gcode_macro TREED_BEEPER"] %}
  {% set freq = params.S|default(1760)|float %}
  {% set duration = params.P|default(120)|int %}
  {% set volume = params.V|default(cfg.volume)|float %}

  {% if cfg.enabled|int == 1 %}
    {% if freq < 80 %}{% set freq = 80.0 %}{% endif %}
    {% if freq > 5000 %}{% set freq = 5000.0 %}{% endif %}
    {% if duration < 10 %}{% set duration = 10 %}{% endif %}
    {% if duration > 4000 %}{% set duration = 4000 %}{% endif %}
    {% if volume < 0.05 %}{% set volume = 0.05 %}{% endif %}
    {% if volume > 1.0 %}{% set volume = 1.0 %}{% endif %}

    SET_PIN PIN=treed_beeper VALUE={volume} CYCLE_TIME={1.0 / freq}
    G4 P{duration}
    SET_PIN PIN=treed_beeper VALUE=0
  {% endif %}

[gcode_macro BEEP]
description: "Короткий бип (алиас на M300)"
gcode:
  M300 S{params.S|default(1760)} P{params.P|default(120)} V{params.V|default(printer["gcode_macro TREED_BEEPER"].volume)}

[gcode_macro TREED_CHIME_BOOT]
description: "SYSTEM: стартовая мелодия (~3 сек)"
gcode:
  {% set v = printer["gcode_macro TREED_BEEPER"].volume|float %}
  M300 S523 P180 V{v}
  G4 P40
  M300 S659 P180 V{v}
  G4 P40
  M300 S784 P220 V{v}
  G4 P40
  M300 S1047 P260 V{v}
  G4 P40
  M300 S988 P180 V{v}
  G4 P40
  M300 S784 P220 V{v}
  G4 P40
  M300 S659 P180 V{v}
  G4 P40
  M300 S880 P220 V{v}
  G4 P40
  M300 S784 P260 V{v}
  G4 P40
  M300 S1175 P220 V{v}
  G4 P40
  M300 S1047 P420 V{v}

# SYSTEM: delayed-хук, автоматически дергается при старте Klipper.
[delayed_gcode TREED_BOOT_CHIME]
initial_duration: 1.0
gcode:
  {% set cfg = printer["gcode_macro TREED_BEEPER"] %}
  {% if cfg.enabled|int == 1 %}
    {action_call_remote_method("machine.shell_command", cmd="treed_beeper_boot_once")}
  {% endif %}
