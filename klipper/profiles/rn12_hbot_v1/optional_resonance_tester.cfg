# ==========================================
# ОПЦИОНАЛЬНО: RESONANCE TESTER
# ==========================================
# Назначение:
# - Параметры измерения резонансов (ADXL).
#
# Важно:
# - Включать вместе с `optional_adxl345_rpi.cfg` (или другим конфигом датчика).
# - `probe_points` задает точку измерения в координатах принтера; по умолчанию
#   указан безопасный стартовый вариант около центра стола.

[resonance_tester]
accel_chip: adxl345
probe_points:
  122.5,122.5,20
min_freq: 5
max_freq: 133
accel_per_hz: 75
hz_per_sec: 1
