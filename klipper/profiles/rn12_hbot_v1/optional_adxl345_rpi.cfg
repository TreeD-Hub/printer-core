# ==========================================
# ОПЦИОНАЛЬНО: ADXL345 ЧЕРЕЗ RASPBERRY PI (SPI)
# ==========================================
# Назначение:
# - Подключает host MCU на Pi для работы датчика ADXL345 по SPI.
# - Используется вместе с `optional_resonance_tester.cfg` для измерения резонансов.
#
# Важно:
# - Перед включением этого include на Pi должны быть включены SPI и `klipper_mcu`.
# - Конфиг рассчитан на подключение ADXL345 к SPI0 CE0 (`/dev/spidev0.0`).
# - Для CE1 обычно достаточно заменить `spi_bus: spidev0.0` на `spi_bus: spidev0.1`.
# - Если на конкретной сборке `cs_pin: rpi:None` не работает, используйте явный CS
#   (`rpi:gpio8` для CE0 или `rpi:gpio7` для CE1).

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0
axes_map: z, x, y
# rate: 3200
# spi_speed: 5000000
