# ==========================================
# КОНФИГ ЭКСТРУДЕРА И ХОТЭНДА — RN12 HBOT V1
# ==========================================
# Назначение:
# - Описывает кинематику подачи филамента (шаги/дистанция/ограничения).
# - Описывает нагрев хотэнда, PID и защитные лимиты.
# - Содержит определение термистора NTC100K_B3950.

# Механика подачи экструдера.
[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 7.84    # Калибровка по замеру: команда 25мм, факт 56мм

# Геометрия сопла и филамента.
nozzle_diameter: 0.400
filament_diameter: 1.750

# Нагреватель и термистор хотэнда
heater_pin: PB0
sensor_type: NTC100K_B3950
sensor_pin: PC1
pullup_resistor: 4700
smooth_time: 1.0
min_temp: 0
max_temp: 280
max_power: 1.0

# Защита от "холодной" экструдии
min_extrude_temp: 170

control: pid
pid_Kp: 17.48
pid_Ki: 1.32
pid_Kd: 57.81
pwm_cycle_time: 0.100
# max_delta: 2.0  # используется только при control: watermark

# Ограничения по проталкиванию
instantaneous_corner_velocity: 1.0
max_extrude_only_distance: 120
max_extrude_only_velocity: 120
max_extrude_only_accel: 1500
max_extrude_cross_section: 5
pressure_advance: 0.044
pressure_advance_smooth_time: 0.040

# Определение термистора, используемого блоками нагрева.
[thermistor NTC100K_B3950]
temperature1: 25
resistance1: 100000
beta: 3950

# Альтернатива для более точной модели (Steinhart-Hart, 3 точки):
# - Для использования уберите `beta` и задайте пары ниже по даташиту/замерам.
# temperature2: <C>
# resistance2: <Ohm>
# temperature3: <C>
# resistance3: <Ohm>
