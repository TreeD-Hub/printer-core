# ==========================================
# БАЗОВЫЕ МАКРОСЫ ПЕЧАТИ TreeD (RN12 HBOT V1)
# ==========================================
# Контракт:
# - Слайсер должен вызывать:
#   START_PRINT EXTRUDER_TEMP=<temp> BED_TEMP=<temp>
# - Макрос использует M83 (относительная подача E) и не сбрасывает множители скорости/потока.
# - Сессия камеры управляется внутренними макросами _TREED_CAM_*.

[gcode_macro _TREED_PRINT_DEFAULTS]
description: "TreeD: дефолты макросов печати и камеры"
variable_prime_e: 16.0
variable_prime_z: 0.40
variable_prime_feed: 400.0
variable_retract_before_prime: 0.8
variable_retract_feed: 1800.0
variable_safe_z: 10.0
variable_prime_y_offset: 5.0
variable_prime_x_start_offset: 20.0
variable_prime_x_end_offset: 20.0
variable_prime_min_len: 12.0
variable_prime_mid_ratio: 0.60
variable_prime_wipe_offset: 5.0
variable_prime_post_lift: 0.2
variable_snapshot_interval: 120
gcode:

# Смещение печатной области относительно полной механики.
# Слайсер оставляем без смещений: вся привязка делается здесь.
[gcode_macro _TREED_PRINT_AREA_CFG]
description: "TreeD: оффсет печатной области в координатах принтера"
variable_print_offset_x: 0.0
variable_print_offset_y: 65.0
variable_print_size_x: 245.0
variable_print_size_y: 180.0
gcode:

# Восстановление рабочего оффсета печатной зоны с проверкой границ.
[gcode_macro _TREED_RESTORE_PRINT_OFFSET]
description: "TreeD: применить и проверить смещение печатной зоны"
gcode:
  {% set toolhead = printer.toolhead %}
  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set span_x = x_max - x_min %}
  {% set span_y = y_max - y_min %}
  {% set cfg = printer["gcode_macro _TREED_PRINT_AREA_CFG"] %}
  {% set print_offset_x = cfg.print_offset_x|float %}
  {% set print_offset_y = cfg.print_offset_y|float %}
  {% set print_size_x = cfg.print_size_x|float %}
  {% set print_size_y = cfg.print_size_y|float %}
  {% if print_offset_x < 0.0 %}{% set print_offset_x = 0.0 %}{% endif %}
  {% if print_offset_y < 0.0 %}{% set print_offset_y = 0.0 %}{% endif %}
  {% if print_size_x < 1.0 %}{% set print_size_x = span_x %}{% endif %}
  {% if print_size_y < 1.0 %}{% set print_size_y = span_y %}{% endif %}
  {% if print_offset_x > span_x - 1.0 %}{% set print_offset_x = span_x - 1.0 %}{% endif %}
  {% if print_offset_y > span_y - 1.0 %}{% set print_offset_y = span_y - 1.0 %}{% endif %}
  {% if print_offset_x + print_size_x > span_x + 0.001 %}
    {action_raise_error("_TREED_PRINT_AREA_CFG: X-area выходит за механику (offset_x + size_x > span_x)")}
  {% endif %}
  {% if print_offset_y + print_size_y > span_y + 0.001 %}
    {action_raise_error("_TREED_PRINT_AREA_CFG: Y-area выходит за механику (offset_y + size_y > span_y)")}
  {% endif %}
  SET_GCODE_OFFSET X={print_offset_x} Y={print_offset_y} MOVE=0

# Точка парковки для PAUSE/M600 в системе полной механики.
[gcode_macro _TREED_PAUSE_PARK_CFG]
description: "TreeD: парковка PAUSE/M600 от минимума области перемещения"
variable_park_x_offset_from_min: 0.0
variable_park_y_offset_from_min: 0.0
gcode:

[gcode_macro _TREED_REQUIRE_HEATER_BED]
description: "SYSTEM: fail-fast проверка heater_bed для RN12"
gcode:
  {% if printer.heater_bed is not defined %}
    {action_raise_error("RN12 profile error: heater_bed section is missing")}
  {% endif %}

# Временный совместимый алиас для старого командного имени.
# План удаления: после ближайшего релизного цикла.
[gcode_macro TREED_RESTORE_PRINT_OFFSET]
description: "SYSTEM/DEPRECATED: use _TREED_RESTORE_PRINT_OFFSET"
gcode:
  RESPOND PREFIX="treed" MSG="DEPRECATED: TREED_RESTORE_PRINT_OFFSET -> _TREED_RESTORE_PRINT_OFFSET"
  _TREED_RESTORE_PRINT_OFFSET
