# ==========================================
# ОПЦИОНАЛЬНО: IDLE TIMEOUT
# ==========================================
# Назначение:
# - Явно задает поведение бездействия принтера.
# - По умолчанию Klipper использует timeout=600 и отключение нагревателей.
#
# Как включить:
# - Раскомментировать include в `klipper/printer.cfg`.

[idle_timeout]
timeout: 900
gcode:
  TURN_OFF_HEATERS
  M84
