# ==========================================
# БЛОКИ UI/WEB ИНТЕГРАЦИИ — RN12 HBOT V1
# ==========================================
# Назначение:
# - Включает стандартные интерфейсные секции для Mainsail/Fluidd.
# - Не содержит кинематики или логики печати.

# Виртуальная SD-карта (папка G-code файлов).
[virtual_sdcard]
path: ~/printer_data/gcodes

# Макросы паузы/возобновления.
[pause_resume]

# Текущий статус печати для UI.
[display_status]

# Команда RESPOND для вывода сообщений в консоль UI.
[respond]
