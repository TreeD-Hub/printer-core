# ==========================================
# КОНФИГ ПОДКЛЮЧЕНИЯ MCU — MKS ROBIN NANO 1.2
# ==========================================
# Назначение:
# - Определяет способ связи Klipper host -> плата MCU.
# - serial обновляется автоматически шагом loader/steps/klipper-profiles.sh.
# - restart_method задает безопасный перезапуск MCU по команде.

[mcu]
serial: /dev/serial/by-id/REPLACE_ME
restart_method: command
