# ==========================================
# БАЗОВЫЕ МАКРОСЫ ПЕЧАТИ TreeD (RN12 HBOT V1)
# ==========================================
# Контракт:
# - Слайсер должен вызывать:
#   START_PRINT EXTRUDER_TEMP=<temp> BED_TEMP=<temp>
# - Макрос использует M83 (относительная подача E) и не сбрасывает множители скорости/потока.
# - Сессия камеры управляется макросами TREED_CAM_*.

[gcode_macro TREED_PRINT_DEFAULTS]
description: "TreeD: дефолты макросов печати и камеры"
variable_prime_e: 16.0
variable_prime_z: 0.40
variable_prime_feed: 400.0
variable_retract_before_prime: 0.8
variable_retract_feed: 1800.0
variable_safe_z: 10.0
variable_prime_y_offset: 5.0
variable_prime_x_start_offset: 20.0
variable_prime_x_end_offset: 20.0
variable_prime_min_len: 12.0
variable_prime_mid_ratio: 0.60
variable_prime_wipe_offset: 5.0
variable_prime_post_lift: 0.2
variable_snapshot_interval: 120
gcode:

# Смещение печатной области относительно полной механики.
# Слайсер оставляем без смещений: вся привязка делается здесь.
[gcode_macro TREED_PRINT_AREA_CFG]
description: "TreeD: оффсет печатной области в координатах принтера"
variable_print_offset_x: 0.0
variable_print_offset_y: 65.0
variable_print_size_x: 245.0
variable_print_size_y: 180.0
gcode:

# Восстановление рабочего оффсета печатной зоны с проверкой границ.
[gcode_macro TREED_RESTORE_PRINT_OFFSET]
description: "TreeD: применить и проверить смещение печатной зоны"
gcode:
  {% set toolhead = printer.toolhead %}
  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set span_x = x_max - x_min %}
  {% set span_y = y_max - y_min %}
  {% set cfg = printer["gcode_macro TREED_PRINT_AREA_CFG"] %}
  {% set print_offset_x = cfg.print_offset_x|float %}
  {% set print_offset_y = cfg.print_offset_y|float %}
  {% set print_size_x = cfg.print_size_x|float %}
  {% set print_size_y = cfg.print_size_y|float %}
  {% if print_offset_x < 0.0 %}{% set print_offset_x = 0.0 %}{% endif %}
  {% if print_offset_y < 0.0 %}{% set print_offset_y = 0.0 %}{% endif %}
  {% if print_size_x < 1.0 %}{% set print_size_x = span_x %}{% endif %}
  {% if print_size_y < 1.0 %}{% set print_size_y = span_y %}{% endif %}
  {% if print_offset_x > span_x - 1.0 %}{% set print_offset_x = span_x - 1.0 %}{% endif %}
  {% if print_offset_y > span_y - 1.0 %}{% set print_offset_y = span_y - 1.0 %}{% endif %}
  {% if print_offset_x + print_size_x > span_x + 0.001 %}
    {action_raise_error("TREED_PRINT_AREA_CFG: X-area выходит за механику (offset_x + size_x > span_x)")}
  {% endif %}
  {% if print_offset_y + print_size_y > span_y + 0.001 %}
    {action_raise_error("TREED_PRINT_AREA_CFG: Y-area выходит за механику (offset_y + size_y > span_y)")}
  {% endif %}
  SET_GCODE_OFFSET X={print_offset_x} Y={print_offset_y} MOVE=0

# Точка парковки для PAUSE/M600 в системе полной механики.
[gcode_macro TREED_PAUSE_PARK_CFG]
description: "TreeD: парковка PAUSE/M600 от минимума области перемещения"
variable_park_x_offset_from_min: 0.0
variable_park_y_offset_from_min: 0.0
gcode:

# Точка входа слайсера: полный сценарий подготовки к печати.
[gcode_macro START_PRINT]
description: "TreeD: старт печати (валидация, нагрев, хоуминг, прайм, камера)"
gcode:
  # ---- 1) Чтение и нормализация параметров из слайсера ----
  {% set defaults = printer["gcode_macro TREED_PRINT_DEFAULTS"] %}
  {% set BED_TEMP = params.BED_TEMP|default(0)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(0)|float %}
  {% set PRIME_E = params.PRIME_E|default(defaults.prime_e)|float %}
  {% set PRIME_Z = params.PRIME_Z|default(defaults.prime_z)|float %}
  {% set PRIME_FEED = params.PRIME_FEED|default(defaults.prime_feed)|float %}
  {% set RETRACT_E = defaults.retract_before_prime|float %}
  {% set RETRACT_FEED = defaults.retract_feed|float %}
  {% set SAFE_Z_DEFAULT = defaults.safe_z|float %}
  {% set PRIME_Y_OFFSET = defaults.prime_y_offset|float %}
  {% set PRIME_X_START_OFFSET = defaults.prime_x_start_offset|float %}
  {% set PRIME_X_END_OFFSET = defaults.prime_x_end_offset|float %}
  {% set PRIME_MIN_LEN = defaults.prime_min_len|float %}
  {% set PRIME_MID_RATIO = defaults.prime_mid_ratio|float %}
  {% set PRIME_WIPE_OFFSET = defaults.prime_wipe_offset|float %}
  {% set PRIME_POST_LIFT = defaults.prime_post_lift|float %}

  {% if BED_TEMP < 0 %}{% set BED_TEMP = 0.0 %}{% endif %}
  {% if EXTRUDER_TEMP < 0 %}{% set EXTRUDER_TEMP = 0.0 %}{% endif %}
  {% if PRIME_E < 2 %}{% set PRIME_E = 2.0 %}{% endif %}
  {% if PRIME_E > 30 %}{% set PRIME_E = 30.0 %}{% endif %}
  {% if PRIME_Z < 0.20 %}{% set PRIME_Z = 0.20 %}{% endif %}
  {% if PRIME_Z > 1.20 %}{% set PRIME_Z = 1.20 %}{% endif %}
  {% if PRIME_FEED < 120 %}{% set PRIME_FEED = 120.0 %}{% endif %}
  {% if PRIME_FEED > 1800 %}{% set PRIME_FEED = 1800.0 %}{% endif %}
  {% if RETRACT_E < 0 %}{% set RETRACT_E = 0.0 %}{% endif %}
  {% if RETRACT_E > 3 %}{% set RETRACT_E = 3.0 %}{% endif %}
  {% if RETRACT_FEED < 300 %}{% set RETRACT_FEED = 300.0 %}{% endif %}
  {% if RETRACT_FEED > 6000 %}{% set RETRACT_FEED = 6000.0 %}{% endif %}
  {% if SAFE_Z_DEFAULT < 1 %}{% set SAFE_Z_DEFAULT = 1.0 %}{% endif %}
  {% if SAFE_Z_DEFAULT > 50 %}{% set SAFE_Z_DEFAULT = 50.0 %}{% endif %}
  {% if PRIME_Y_OFFSET < 1 %}{% set PRIME_Y_OFFSET = 1.0 %}{% endif %}
  {% if PRIME_Y_OFFSET > 40 %}{% set PRIME_Y_OFFSET = 40.0 %}{% endif %}
  {% if PRIME_X_START_OFFSET < 1 %}{% set PRIME_X_START_OFFSET = 1.0 %}{% endif %}
  {% if PRIME_X_START_OFFSET > 60 %}{% set PRIME_X_START_OFFSET = 60.0 %}{% endif %}
  {% if PRIME_X_END_OFFSET < 1 %}{% set PRIME_X_END_OFFSET = 1.0 %}{% endif %}
  {% if PRIME_X_END_OFFSET > 60 %}{% set PRIME_X_END_OFFSET = 60.0 %}{% endif %}
  {% if PRIME_MIN_LEN < 8 %}{% set PRIME_MIN_LEN = 8.0 %}{% endif %}
  {% if PRIME_MIN_LEN > 120 %}{% set PRIME_MIN_LEN = 120.0 %}{% endif %}
  {% if PRIME_MID_RATIO < 0.1 %}{% set PRIME_MID_RATIO = 0.1 %}{% endif %}
  {% if PRIME_MID_RATIO > 0.95 %}{% set PRIME_MID_RATIO = 0.95 %}{% endif %}
  {% if PRIME_WIPE_OFFSET < 0 %}{% set PRIME_WIPE_OFFSET = 0.0 %}{% endif %}
  {% if PRIME_WIPE_OFFSET > 20 %}{% set PRIME_WIPE_OFFSET = 20.0 %}{% endif %}
  {% if PRIME_POST_LIFT < 0.0 %}{% set PRIME_POST_LIFT = 0.0 %}{% endif %}
  {% if PRIME_POST_LIFT > 2.0 %}{% set PRIME_POST_LIFT = 2.0 %}{% endif %}

  {% set has_bed = printer.heater_bed is defined %}
  {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}

  {% if EXTRUDER_TEMP <= 0 %}
    {action_raise_error("START_PRINT: требуется EXTRUDER_TEMP > 0")}
  {% endif %}
  {% if EXTRUDER_TEMP < min_extrude %}
    {action_raise_error("START_PRINT: EXTRUDER_TEMP ниже min_extrude_temp (" ~ min_extrude ~ ")")}
  {% endif %}

  # ---- 2) Геометрия для безопасных перемещений и прайм-линии ----
  {% set toolhead = printer.toolhead %}
  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set z_min = toolhead.axis_minimum.z|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set z_max = toolhead.axis_maximum.z|float %}

  {% set safe_z = SAFE_Z_DEFAULT %}
  {% if safe_z > z_max - 1.0 %}{% set safe_z = z_max - 1.0 %}{% endif %}
  {% if safe_z < z_min + 0.5 %}{% set safe_z = z_min + 0.5 %}{% endif %}
  {% set preheat_hold_z = z_min %}
  {% if preheat_hold_z < 0.0 %}{% set preheat_hold_z = 0.0 %}{% endif %}
  {% if preheat_hold_z > safe_z %}{% set preheat_hold_z = safe_z %}{% endif %}

  {% set prime_y = y_min + PRIME_Y_OFFSET %}
  {% if prime_y > y_max - PRIME_Y_OFFSET %}
    {% set prime_y = (y_min + y_max) / 2.0 %}
  {% endif %}

  {% set prime_x_start = x_min + PRIME_X_START_OFFSET %}
  {% if prime_x_start > x_max - (PRIME_X_START_OFFSET + 10.0) %}
    {% set prime_x_start = x_min + (x_max - x_min) * 0.2 %}
  {% endif %}

  {% set prime_x_end = x_max - PRIME_X_END_OFFSET %}
  {% if prime_x_end <= prime_x_start + PRIME_MIN_LEN %}
    {% set prime_x_end = prime_x_start + PRIME_MIN_LEN %}
  {% endif %}

  {% set prime_len = prime_x_end - prime_x_start %}
  {% if prime_len < PRIME_MIN_LEN %}{% set prime_len = PRIME_MIN_LEN %}{% endif %}

  {% set prime_x_mid = prime_x_start + prime_len * PRIME_MID_RATIO %}
  {% if prime_x_mid > prime_x_end %}
    {% set prime_x_mid = (prime_x_start + prime_x_end) / 2.0 %}
  {% endif %}

  {% set wipe_x = prime_x_end - PRIME_WIPE_OFFSET %}
  {% if wipe_x < prime_x_start %}{% set wipe_x = prime_x_end %}{% endif %}

  # ---- 3) Базовый режим G-кода (множители скорости/потока не трогаем) ----
  G21
  G90
  M83
  G92 E0
  # Хоуминг выполняем до нагрева стола.
  G28
  # Применяем смещение печатной зоны (без смещения в слайсере).
  TREED_RESTORE_PRINT_OFFSET

  # ---- 4) Преднагрев ----
  # Сначала греем стол до цели.
  {% if has_bed and BED_TEMP > 0 %}
    M140 S{BED_TEMP}
  {% elif has_bed and BED_TEMP <= 0 %}
    RESPOND PREFIX="treed" MSG="BED_TEMP<=0, нагрев стола пропущен"
  {% endif %}

  # После выхода стола на цель делаем preheat сопла.
  {% set PREHEAT_NOZZLE = 140.0 %}
  {% if EXTRUDER_TEMP < PREHEAT_NOZZLE %}
    {% set PREHEAT_NOZZLE = EXTRUDER_TEMP %}
  {% endif %}
  {% if has_bed and BED_TEMP > 0 %}
    M190 S{BED_TEMP}
  {% endif %}

  {% if PREHEAT_NOZZLE > 0 %}
    M109 S{PREHEAT_NOZZLE}
  {% endif %}

  # ---- 5) Позиционирование и доведение сопла до рабочей температуры ----
  # Сценарий:
  # 1) выходим в безопасный Z;
  # 2) приезжаем в старт прайм-линии;
  # 3) опускаемся на Z0 (или z_min) и ждем рабочую температуру сопла;
  # 4) затем поднимаемся на PRIME_Z и печатаем линию.
  G1 Z{safe_z} F300

  G1 X{prime_x_start} Y{prime_y} Z{safe_z} F6000
  G1 Z{preheat_hold_z} F300
  M109 S{EXTRUDER_TEMP}

  # ---- 6) Прайм-последовательность ----
  G92 E0
  {% if RETRACT_E > 0 %}
    G1 E-{RETRACT_E} F{RETRACT_FEED}
  {% endif %}

  G1 Z{PRIME_Z} F300
  G92 E0
  G1 X{prime_x_mid} Y{prime_y} E{PRIME_E} F{PRIME_FEED}
  G1 Z{PRIME_Z + PRIME_POST_LIFT} F300
  G1 X{wipe_x} Y{prime_y} F3000
  G92 E0
  G1 Z2 F300

  # ---- 7) Runtime-хуки ----
  TREED_CAM_START
  RESPOND PREFIX="treed" MSG="START_PRINT завершен: bed={BED_TEMP} hotend={EXTRUDER_TEMP}"

# Завершение печати: парковка, отключение нагревов и остановка камеры.
[gcode_macro END_PRINT]
description: "TreeD: завершение печати (подъем, парковка, охлаждение, стоп камеры)"
gcode:
  {% set toolhead = printer.toolhead %}
  {% set gcode_state = printer.gcode_move %}
  {% set has_bed = printer.heater_bed is defined %}

  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set z_min = toolhead.axis_minimum.z|float %}
  {% set z_max = toolhead.axis_maximum.z|float %}

  {% set park_x = x_min + 10.0 %}
  {% set park_y = y_max - 10.0 %}
  {% set lift_z = gcode_state.position.z + 10.0 %}
  {% if lift_z > z_max - 1.0 %}{% set lift_z = z_max - 1.0 %}{% endif %}
  {% if lift_z < z_min + 2.0 %}{% set lift_z = z_min + 2.0 %}{% endif %}

  # Возвращаемся в механическую систему координат для парка.
  SET_GCODE_OFFSET X=0 Y=0 MOVE=0
  G90
  G92 E0
  G1 E-2 F1800
  G1 Z{lift_z} F300
  G1 X{park_x} Y{park_y} F6000

  M106 S0
  M104 S0
  {% if has_bed %}
    M140 S0
  {% endif %}
  TREED_CAM_STOP
  RESPOND PREFIX="treed" MSG="END_PRINT завершен"

# Состояние новой паузы:
# - целевые температуры до паузы;
# - исходный idle_timeout для восстановления после RESUME/CANCEL.
[gcode_macro TREED_PAUSE_STATE]
variable_hotend_target: 0
variable_bed_target: 0
variable_idle_timeout_prev: 600
variable_is_active: 0
gcode:

# Обертка CLEAR_PAUSE:
# - очищает внутреннее состояние TREED_PAUSE_STATE;
# - возвращает idle_timeout;
# - восстанавливает рабочий print-offset после выхода из паузы.
[gcode_macro CLEAR_PAUSE]
description: "TreeD: clear pause + restore print offset"
rename_existing: CLEAR_PAUSE_BASE
gcode:
  {% set pause_state = printer["gcode_macro TREED_PAUSE_STATE"] %}
  {% set was_active = pause_state.is_active|int %}
  {% if was_active == 1 and pause_state.idle_timeout_prev|float >= 1 %}
    SET_IDLE_TIMEOUT TIMEOUT={pause_state.idle_timeout_prev|int}
  {% endif %}
  CLEAR_PAUSE_BASE
  {% if was_active == 1 %}
    SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=hotend_target VALUE=0
    SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=bed_target VALUE=0
    SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=idle_timeout_prev VALUE=0
    SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=is_active VALUE=0
    TREED_RESTORE_PRINT_OFFSET
  {% endif %}

# Обертка штатной отмены печати с гарантированной остановкой камеры.
[gcode_macro CANCEL_PRINT]
description: "TreeD: отмена печати (без XY, с подъемом Z, отключение нагревов/обдува, камера, базовый CANCEL)"
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% set has_bed = printer.heater_bed is defined %}
  {% set toolhead = printer.toolhead %}
  {% set gmove = printer.gcode_move %}
  {% set z_min = toolhead.axis_minimum.z|float %}
  {% set z_max = toolhead.axis_maximum.z|float %}
  {% set z_range = z_max - z_min %}
  {% set cancel_lift = z_range * 0.05 %}
  {% if cancel_lift < 3.0 %}{% set cancel_lift = 3.0 %}{% endif %}
  {% if cancel_lift > 20.0 %}{% set cancel_lift = 20.0 %}{% endif %}
  {% set target_z = gmove.position.z + cancel_lift %}
  {% if target_z > z_max - 1.0 %}{% set target_z = z_max - 1.0 %}{% endif %}
  {% if target_z < z_min + 1.0 %}{% set target_z = z_min + 1.0 %}{% endif %}
  {% if "z" in toolhead.homed_axes %}
    G90
    G1 Z{target_z} F300
  {% endif %}

  # После отмены оставляем систему в механических координатах.
  SET_GCODE_OFFSET X=0 Y=0 MOVE=0

  {% set pause_state = printer["gcode_macro TREED_PAUSE_STATE"] %}
  {% if pause_state.is_active|int == 1 and pause_state.idle_timeout_prev|float >= 1 %}
    SET_IDLE_TIMEOUT TIMEOUT={pause_state.idle_timeout_prev|int}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=hotend_target VALUE=0
  SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=bed_target VALUE=0
  SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=idle_timeout_prev VALUE=0
  SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=is_active VALUE=0
  M106 S0
  M104 S0
  {% if has_bed %}
    M140 S0
  {% endif %}
  TREED_CAM_STOP
  CANCEL_PRINT_BASE

# Пауза печати: парковка, E-5, сопло 140C, удержание моторов и пауза камеры.
[gcode_macro PAUSE]
description: "TreeD: пауза печати (park + E-5 + hotend=140 + hold motors)"
rename_existing: PAUSE_BASE
gcode:
  {% set pause_state = printer["gcode_macro TREED_PAUSE_STATE"] %}
  {% if pause_state.is_active|int == 1 %}
    RESPOND PREFIX="treed" MSG="PAUSE уже активна"
  {% else %}
    {% set toolhead = printer.toolhead %}
    {% set gmove = printer.gcode_move %}
    {% set has_bed = printer.heater_bed is defined %}
    {% set x_min = toolhead.axis_minimum.x|float %}
    {% set y_min = toolhead.axis_minimum.y|float %}
    {% set z_min = toolhead.axis_minimum.z|float %}
    {% set x_max = toolhead.axis_maximum.x|float %}
    {% set y_max = toolhead.axis_maximum.y|float %}
    {% set z_max = toolhead.axis_maximum.z|float %}
    {% set park_cfg = printer["gcode_macro TREED_PAUSE_PARK_CFG"] %}
    {% set park_x = x_min + park_cfg.park_x_offset_from_min|float %}
    {% set park_y = y_min + park_cfg.park_y_offset_from_min|float %}
    {% if park_x < x_min %}{% set park_x = x_min %}{% endif %}
    {% if park_y < y_min %}{% set park_y = y_min %}{% endif %}
    {% if park_x > x_max - 2.0 %}{% set park_x = x_max - 2.0 %}{% endif %}
    {% if park_y > y_max - 2.0 %}{% set park_y = y_max - 2.0 %}{% endif %}
    {% set lift_z = gmove.position.z + 10.0 %}
    {% if lift_z > z_max - 1.0 %}{% set lift_z = z_max - 1.0 %}{% endif %}
    {% if lift_z < z_min + 2.0 %}{% set lift_z = z_min + 2.0 %}{% endif %}
    {% set hotend_target = printer.extruder.target|default(0)|float %}
    {% set bed_target = 0.0 %}
    {% if has_bed %}{% set bed_target = printer.heater_bed.target|default(0)|float %}{% endif %}
    {% set idle_timeout_prev = printer.configfile.settings.idle_timeout.timeout|default(600)|float %}

    SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=hotend_target VALUE={hotend_target}
    SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=bed_target VALUE={bed_target}
    SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=idle_timeout_prev VALUE={idle_timeout_prev}
    SET_GCODE_VARIABLE MACRO=TREED_CAM_STATE VARIABLE=was_enabled_before_pause VALUE={printer["gcode_macro TREED_CAM_STATE"].enabled|int}
    SET_GCODE_VARIABLE MACRO=TREED_CAM_STATE VARIABLE=enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=TREED_CAM_TICK DURATION=0

    PAUSE_BASE

    M83
    G92 E0
    G1 E-5 F1800
    # Для парка отключаем print-offset и уходим в минимум полной механики.
    SET_GCODE_OFFSET X=0 Y=0 MOVE=0
    {% if "xyz" in toolhead.homed_axes %}
      G90
      G1 Z{lift_z} F300
      G1 X{park_x} Y{park_y} F6000
    {% else %}
      RESPOND PREFIX="treed" MSG="PAUSE: оси не захоумлены, парковка пропущена"
    {% endif %}
    M104 S140
    SET_IDLE_TIMEOUT TIMEOUT=43200
    SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=is_active VALUE=1
  {% endif %}

# Возобновление печати: восстановление температур, purge, G10 и круговой wipe.
[gcode_macro RESUME]
description: "TreeD: RESUME с прогревом, purge и круговым wipe"
rename_existing: RESUME_BASE
gcode:
  {% set pause_state = printer["gcode_macro TREED_PAUSE_STATE"] %}
  {% set has_bed = printer.heater_bed is defined %}
  {% set gmove = printer.gcode_move %}
  {% set toolhead = printer.toolhead %}
  {% set pause_active = pause_state.is_active|int %}
  {% set hotend_target = pause_state.hotend_target|float %}
  {% set bed_target = pause_state.bed_target|float %}
  {% set idle_timeout_prev = pause_state.idle_timeout_prev|float %}
  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set x_start = gmove.position.x|float %}
  {% set y_start = gmove.position.y|float %}
  {% if x_start < x_min + 1.0 %}{% set x_start = x_min + 1.0 %}{% endif %}
  {% if x_start > x_max - 1.0 %}{% set x_start = x_max - 1.0 %}{% endif %}
  {% if y_start < y_min + 1.0 %}{% set y_start = y_min + 1.0 %}{% endif %}
  {% if y_start > y_max - 1.0 %}{% set y_start = y_max - 1.0 %}{% endif %}
  {% set x_right = x_start + 20.0 %}
  {% if x_right > x_max - 1.0 %}{% set x_right = x_max - 1.0 %}{% endif %}
  {% if x_right < x_start + 2.0 %}{% set x_right = x_start + 2.0 %}{% endif %}
  {% set i_half = (x_right - x_start) / 2.0 %}

  {% if pause_active == 1 %}
    {% if has_bed and bed_target > 0 %}
      M190 S{bed_target}
    {% endif %}
    {% if hotend_target > 0 %}
      M109 S{hotend_target}
    {% endif %}

    M83
    G92 E0
    G1 E50 F600
    G10

    G90
    G2 X{x_right} Y{y_start} I{i_half} J0 F9000
    G2 X{x_start} Y{y_start} I{-i_half} J0 F9000
    G3 X{x_right} Y{y_start} I{i_half} J0 F9000
    G3 X{x_start} Y{y_start} I{-i_half} J0 F9000
    G90

    {% if idle_timeout_prev >= 1 %}
      SET_IDLE_TIMEOUT TIMEOUT={idle_timeout_prev|int}
    {% endif %}
    # Возвращаем рабочее смещение печатной области перед возвратом в точку паузы.
    TREED_RESTORE_PRINT_OFFSET
  {% endif %}

  RESUME_BASE

  {% if printer["gcode_macro TREED_CAM_STATE"].was_enabled_before_pause|int == 1 %}
    SET_GCODE_VARIABLE MACRO=TREED_CAM_STATE VARIABLE=enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=TREED_CAM_TICK DURATION=1
  {% endif %}
  SET_GCODE_VARIABLE MACRO=TREED_CAM_STATE VARIABLE=was_enabled_before_pause VALUE=0
  SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=hotend_target VALUE=0
  SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=bed_target VALUE=0
  SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=idle_timeout_prev VALUE=0
  SET_GCODE_VARIABLE MACRO=TREED_PAUSE_STATE VARIABLE=is_active VALUE=0

# Загрузка филамента для кнопки KS Load.
# Контракт: фиксировано 100 мм @ 8 мм/с, параметры из UI игнорируются.
# Движение разбивается на порции по max_extrude_only_distance.
[gcode_macro LOAD_FILAMENT]
description: "TreeD: загрузка филамента (100мм @ 8мм/с)"
gcode:
  {% set length = 100.0 %}
  {% set speed = 8.0 %}
  {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
  {% set max_chunk = printer.configfile.settings.extruder.max_extrude_only_distance|default(50)|float %}
  {% if max_chunk < 1.0 %}
    {% set max_chunk = 50.0 %}
  {% endif %}
  {% set parts = (length / max_chunk)|round(0, "ceil")|int %}
  {% if parts < 1 %}{% set parts = 1 %}{% endif %}
  {% set chunk = (length / parts)|float %}
  {% if not printer.extruder.can_extrude %}
    {action_raise_error("LOAD_FILAMENT: нагрейте сопло выше " ~ min_extrude ~ "C")}
  {% endif %}
  SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
  M83
  G92 E0
  {% for _ in range(parts) %}
    G1 E{chunk} F{speed * 60.0}
  {% endfor %}
  RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

# Выгрузка филамента для кнопки KS Unload.
# Контракт: фиксировано 100 мм @ 8 мм/с, параметры из UI игнорируются.
# Движение разбивается на порции по max_extrude_only_distance.
[gcode_macro UNLOAD_FILAMENT]
description: "TreeD: выгрузка филамента (100мм @ 8мм/с)"
gcode:
  {% set length = 100.0 %}
  {% set speed = 8.0 %}
  {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
  {% set max_chunk = printer.configfile.settings.extruder.max_extrude_only_distance|default(50)|float %}
  {% if max_chunk < 1.0 %}
    {% set max_chunk = 50.0 %}
  {% endif %}
  {% set parts = (length / max_chunk)|round(0, "ceil")|int %}
  {% if parts < 1 %}{% set parts = 1 %}{% endif %}
  {% set chunk = (length / parts)|float %}
  {% if not printer.extruder.can_extrude %}
    {action_raise_error("UNLOAD_FILAMENT: нагрейте сопло выше " ~ min_extrude ~ "C")}
  {% endif %}
  SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
  M83
  G92 E0
  {% for _ in range(parts) %}
    G1 E-{chunk} F{speed * 60.0}
  {% endfor %}
  RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE

# Безопасное применение SAVE_CONFIG из UI (KS и веб-морда).
# Разрешено только вне печати и вне паузы.
[gcode_macro TREED_SAVE_CONFIG]
description: "TreeD: безопасный SAVE_CONFIG (только ready/standby/idle)"
gcode:
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}
  {% set idle_state = "" %}
  {% if printer.idle_timeout is defined %}
    {% set idle_state = printer.idle_timeout.state|default("")|lower %}
  {% endif %}

  {% if print_state not in ["standby", "ready", "idle"] %}
    {action_raise_error("TREED_SAVE_CONFIG: запрещено в состоянии '" ~ print_state ~ "'")}
  {% endif %}
  {% if is_paused == 1 or idle_state == "printing" %}
    {action_raise_error("TREED_SAVE_CONFIG: запрещено во время печати или паузы")}
  {% endif %}

  RESPOND PREFIX="treed" MSG="TREED_SAVE_CONFIG: applying SAVE_CONFIG"
  SAVE_CONFIG

# Состояние камеры:
# enabled = активный цикл снимков, was_enabled_before_pause = флаг для PAUSE/RESUME.
[gcode_macro TREED_CAM_STATE]
variable_enabled: 0
variable_was_enabled_before_pause: 0
gcode:

[delayed_gcode TREED_CAM_TICK]
initial_duration: 0
gcode:
  {% if printer["gcode_macro TREED_CAM_STATE"].enabled|int == 1 %}
    {% set interval = printer["gcode_macro TREED_PRINT_DEFAULTS"].snapshot_interval|int %}
    {% if interval < 10 %}{% set interval = 10 %}{% endif %}
    {action_call_remote_method("machine.shell_command", cmd="treed_cam_snapshot")}
    UPDATE_DELAYED_GCODE ID=TREED_CAM_TICK DURATION={interval}
  {% endif %}

# Старт runtime-сессии камеры для текущей печати.
[gcode_macro TREED_CAM_START]
description: "TreeD: камера (открыть сессию и запустить периодические снимки)"
gcode:
  {% if printer["gcode_macro TREED_CAM_STATE"].enabled|int == 0 %}
    SET_GCODE_VARIABLE MACRO=TREED_CAM_STATE VARIABLE=enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=TREED_CAM_STATE VARIABLE=was_enabled_before_pause VALUE=0
    {action_call_remote_method("machine.shell_command", cmd="treed_cam_session_start", parameters=printer.print_stats.filename)}
    UPDATE_DELAYED_GCODE ID=TREED_CAM_TICK DURATION=1
  {% endif %}

# Остановка runtime-сессии камеры и цикла снимков.
[gcode_macro TREED_CAM_STOP]
description: "TreeD: камера (остановить периодические снимки и закрыть сессию)"
gcode:
  SET_GCODE_VARIABLE MACRO=TREED_CAM_STATE VARIABLE=enabled VALUE=0
  SET_GCODE_VARIABLE MACRO=TREED_CAM_STATE VARIABLE=was_enabled_before_pause VALUE=0
  {action_call_remote_method("machine.shell_command", cmd="treed_cam_session_stop")}
  UPDATE_DELAYED_GCODE ID=TREED_CAM_TICK DURATION=0
