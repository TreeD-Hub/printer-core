# ==========================================
# СОВМЕСТИМОСТЬ G-CODE СО СЛАЙСЕРОМ — RN12 HBOT V1
# ==========================================
# Назначение:
# - Добавляет поддержку дуг G2/G3.
# - Включает базовую совместимость для G10/G11 и M486.
# - Задает безопасное поведение M600 (пауза + выгрузка).

[gcode_arcs]
resolution: 0.1

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

[exclude_object]

[gcode_macro M600]
description: "Совместимость со слайсером: M600 -> PAUSE + UNLOAD"
gcode:
  {% set unload_temp = params.UNLOAD_TEMP|default(180)|float %}
  {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
  {% if unload_temp < min_extrude %}
    {% set unload_temp = min_extrude %}
  {% endif %}

  RESPOND PREFIX="treed" MSG="M600: pause + unload"
  PAUSE
  {% if printer.extruder.can_extrude %}
    UNLOAD_FILAMENT
  {% else %}
    RESPOND PREFIX="treed" MSG="M600: heating to {unload_temp|int}C before unload"
    M109 S{unload_temp}
    UNLOAD_FILAMENT
  {% endif %}
  M104 S140
