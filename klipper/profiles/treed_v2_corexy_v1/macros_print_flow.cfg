# ==========================================
# ОРКЕСТРАЦИЯ ПЕЧАТИ (START / END)
# ==========================================
# Назначение:
# - START_PRINT остается публичной точкой входа;
# - тяжелая логика разложена на private-фазы _TREED_START_*;
# - prime/wipe выполняются через скрытые KAMP park/purge helper-ы.
# Контур:
# - required: START_PRINT/END_PRINT являются основным контрактом слайсера.
# - fail-fast: параметры, mesh-профиль и KAMP проверяются до прогрева и движения.

# Блок 1: Временное состояние START_PRINT между фазами.
[gcode_macro _TREED_START_STATE]
variable_bed_temp: 0.0
variable_extruder_temp: 0.0
variable_mesh: "load"
variable_mesh_profile: "default"
variable_mesh_method: "scan"
variable_adaptive_margin: 5.0
variable_hotend_ready_margin: 3.0
variable_shaper: "none"
variable_shaper_accel: "auto"
gcode:
    G4 P0

[gcode_macro _TREED_START_PREP_STATE]
description: "SYSTEM: подготовка нормализованного состояния START_PRINT"
gcode:
  _TREED_REQUIRE_HEATER_BED

  {% set BED_TEMP = params.BED_TEMP|default(0)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(0)|float %}
  {% set MESH = params.MESH|default("load")|lower %}
  {% set MESH_PROFILE = params.MESH_PROFILE|default("default") %}
  {% set DEFAULT_MESH_METHOD = "scan" if MESH == "adaptive" else "automatic" %}
  {% set MESH_METHOD = params.MESH_METHOD|default(DEFAULT_MESH_METHOD)|lower %}
  {% set ADAPTIVE_MARGIN = params.ADAPTIVE_MARGIN|default(5)|float %}
  {% set HOTEND_READY_MARGIN = params.HOTEND_READY_MARGIN|default(3)|float %}
  {% set SHAPER = params.SHAPER|default("none")|lower %}
  {% set SHAPER_ACCEL = params.SHAPER_ACCEL|default("auto")|lower %}

  {% if BED_TEMP < 0 %}{% set BED_TEMP = 0.0 %}{% endif %}
  {% if EXTRUDER_TEMP < 0 %}{% set EXTRUDER_TEMP = 0.0 %}{% endif %}
  {% if ADAPTIVE_MARGIN < 0 %}{% set ADAPTIVE_MARGIN = 0.0 %}{% endif %}
  {% if HOTEND_READY_MARGIN < 0 %}{% set HOTEND_READY_MARGIN = 0.0 %}{% endif %}

  {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}

  {% if BED_TEMP <= 0 %}
    {action_raise_error("START_PRINT: требуется BED_TEMP > 0")}
  {% endif %}

  {% if EXTRUDER_TEMP <= 0 %}
    {action_raise_error("START_PRINT: требуется EXTRUDER_TEMP > 0")}
  {% endif %}
  {% if EXTRUDER_TEMP < min_extrude %}
    {action_raise_error("START_PRINT: EXTRUDER_TEMP ниже min_extrude_temp (" ~ min_extrude ~ ")")}
  {% endif %}

  {% if MESH not in ["load", "adaptive", "calibrate", "none"] %}
    {action_raise_error("START_PRINT: неверный MESH='" ~ MESH ~ "'. Нужно: load/adaptive/calibrate/none")}
  {% endif %}

  {% if MESH_METHOD not in ["rapid_scan", "scan", "automatic", "manual"] %}
    {action_raise_error("START_PRINT: неверный MESH_METHOD='" ~ MESH_METHOD ~ "'. Нужно: rapid_scan/scan/automatic/manual")}
  {% endif %}

  {% if SHAPER not in ["none", "light", "full"] %}
    {action_raise_error("START_PRINT: неверный SHAPER='" ~ SHAPER ~ "'. Нужно: none/light/full")}
  {% endif %}

  {% if MESH == "load" and (printer.bed_mesh is not defined or MESH_PROFILE not in printer.bed_mesh.profiles) %}
    {action_raise_error("START_PRINT: bed mesh profile '" ~ MESH_PROFILE ~ "' не найден")}
  {% endif %}

  {% if SHAPER != "none" and SHAPER_ACCEL != "auto" %}
    {% set accel = SHAPER_ACCEL|float(none) %}
    {% if accel is none or accel != accel or accel <= 0 %}
      {action_raise_error("START_PRINT: SHAPER_ACCEL должен быть auto или положительным числом")}
    {% endif %}
  {% endif %}
  {% set input_shaper = printer.configfile.settings.input_shaper|default({}) %}
  {% if SHAPER == "light" and
        (input_shaper.shaper_freq_x|default(0)|float <= 0 or
         input_shaper.shaper_freq_y|default(0)|float <= 0) %}
    {action_raise_error("START_PRINT: SHAPER=light требует сохраненные shaper_freq_x/y")}
  {% endif %}

  {% if MESH in ["adaptive", "calibrate"] and (params.MESH_MIN is defined or params.MESH_MAX is defined) %}
    {% set scan = printer["gcode_macro _TREED_EDDY_MESH_CFG"] %}
    {% set mesh_min = params.MESH_MIN|default(scan.scan_min_x ~ "," ~ scan.scan_min_y)|string|replace(" ", "") %}
    {% set mesh_max = params.MESH_MAX|default(scan.scan_max_x ~ "," ~ scan.scan_max_y)|string|replace(" ", "") %}
    {% set min_parts = mesh_min.split(",") %}
    {% set max_parts = mesh_max.split(",") %}
    {% if min_parts|length != 2 or max_parts|length != 2 %}
      {action_raise_error("START_PRINT: MESH_MIN и MESH_MAX должны содержать две координаты X,Y")}
    {% endif %}
    {% set min_x = min_parts[0]|float(none) %}
    {% set min_y = min_parts[1]|float(none) %}
    {% set max_x = max_parts[0]|float(none) %}
    {% set max_y = max_parts[1]|float(none) %}
    {% if min_x is none or min_y is none or max_x is none or max_y is none or
          min_x != min_x or min_y != min_y or max_x != max_x or max_y != max_y or
          min_x >= max_x or min_y >= max_y or
          min_x < scan.scan_min_x|float or min_y < scan.scan_min_y|float or
          max_x > scan.scan_max_x|float or max_y > scan.scan_max_y|float %}
      {action_raise_error("START_PRINT: область mesh некорректна или выходит за безопасную Eddy scan area")}
    {% endif %}
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=bed_temp VALUE={BED_TEMP}
  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=extruder_temp VALUE={EXTRUDER_TEMP}
  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=mesh VALUE="'{MESH}'"
  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=mesh_profile VALUE="'{MESH_PROFILE}'"
  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=mesh_method VALUE="'{MESH_METHOD}'"
  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=adaptive_margin VALUE={ADAPTIVE_MARGIN}
  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=hotend_ready_margin VALUE={HOTEND_READY_MARGIN}
  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=shaper VALUE="'{SHAPER}'"
  SET_GCODE_VARIABLE MACRO=_TREED_START_STATE VARIABLE=shaper_accel VALUE="'{SHAPER_ACCEL}'"

# Блок 2: Базовый режим G-code и ранний старт нагрева без homing.
[gcode_macro _TREED_START_MACHINE_PREP]
description: "SYSTEM: подготовка машинного состояния START_PRINT"
gcode:
  {% set st = printer["gcode_macro _TREED_START_STATE"] %}
  {% set BED_TEMP = st.bed_temp|float %}
  {% set EXTRUDER_TEMP = st.extruder_temp|float %}
  {% set HOTEND_NOW = printer.extruder.temperature|float %}
  {% set PREHEAT_NOZZLE = 140.0 %}
  {% if EXTRUDER_TEMP < PREHEAT_NOZZLE %}
    {% set PREHEAT_NOZZLE = EXTRUDER_TEMP %}
  {% endif %}
  {% if BED_TEMP > 0 %}
    M140 S{BED_TEMP}
    {% if HOTEND_NOW < PREHEAT_NOZZLE - 1.0 %}
      M104 S{PREHEAT_NOZZLE}
    {% endif %}
  {% endif %}
  G21
  G90
  M83
  G92 E0

# Блок 3: Нагрев стола и preheat сопла.
[gcode_macro _TREED_START_PREHEAT]
description: "SYSTEM: преднагрев стола и сопла"
gcode:
  {% set st = printer["gcode_macro _TREED_START_STATE"] %}
  {% set BED_TEMP = st.bed_temp|float %}
  {% set EXTRUDER_TEMP = st.extruder_temp|float %}
  {% set HOTEND_NOW = printer.extruder.temperature|float %}
  {% if BED_TEMP > 0 %}
    M140 S{BED_TEMP}
  {% else %}
    RESPOND PREFIX="treed" MSG="BED_TEMP<=0, нагрев стола пропущен"
  {% endif %}

  {% set PREHEAT_NOZZLE = 140.0 %}
  {% if EXTRUDER_TEMP < PREHEAT_NOZZLE %}
    {% set PREHEAT_NOZZLE = EXTRUDER_TEMP %}
  {% endif %}
  {% if HOTEND_NOW < PREHEAT_NOZZLE - 1.0 %}
    M104 S{PREHEAT_NOZZLE}
  {% endif %}
  {% if BED_TEMP > 0 %}
    M190 S{BED_TEMP}
  {% endif %}
  _TREED_START_WAIT_PREHEAT_NOZZLE TARGET={PREHEAT_NOZZLE}

# Блок 4: Ожидание preheat сопла с ускорением охлаждения через обдув детали.
[gcode_macro _TREED_START_WAIT_PREHEAT_NOZZLE]
description: "SYSTEM: ожидание preheat сопла (ускоряет охлаждение вентилятором при температуре выше цели)"
gcode:
  {% set TARGET = params.TARGET|float %}
  {% set hotend_now = printer.extruder.temperature|float %}
  {% set fan_before = printer.fan.speed|float if printer.fan is defined else 0.0 %}
  {% set fan_restore_pwm = (fan_before * 255.0)|int %}

  # Включаем обдув только если реально ждем охлаждение (а не нагрев до цели).
  {% if hotend_now > TARGET + 1.0 %}
    RESPOND PREFIX="treed" MSG="START_PRINT: cooling hotend to preheat target {TARGET}C, fan=100%"
    M106 S255
    M109 S{TARGET}
    M106 S{fan_restore_pwm}
  {% else %}
    M109 S{TARGET}
  {% endif %}

# Блок 5: Fail-fast проверка KAMP, bed mesh и smart park у зоны печати.
[gcode_macro _TREED_START_KAMP_PREP]
description: "SYSTEM: fail-fast проверка KAMP, BED_MESH и park helper"
gcode:
  _TREED_KAMP_REQUIRE_READY

  {% set mesh_bounds = (" MESH_MIN=" ~ params.MESH_MIN if params.MESH_MIN is defined else "") ~ (" MESH_MAX=" ~ params.MESH_MAX if params.MESH_MAX is defined else "") %}
  {% set st = printer["gcode_macro _TREED_START_STATE"] %}
  {% set MESH = st.mesh|default("load")|lower %}
  {% set MESH_PROFILE = st.mesh_profile|default("default") %}
  {% set MESH_METHOD = st.mesh_method|default("scan")|lower %}
  {% set ADAPTIVE_MARGIN = st.adaptive_margin|default(5)|float %}

  {% if MESH == "load" %}
    RESPOND TYPE=command MSG="START_PRINT: loading bed mesh profile '{MESH_PROFILE}'"
    BED_MESH_PROFILE LOAD={MESH_PROFILE}

  {% elif MESH == "adaptive" %}
    RESPOND TYPE=command MSG="START_PRINT: adaptive bed mesh, method={MESH_METHOD}"
    TREED_BED_MESH_CALIBRATE_EDDY PROFILE=treed_adaptive METHOD={MESH_METHOD} ADAPTIVE=1 ADAPTIVE_MARGIN={ADAPTIVE_MARGIN}{mesh_bounds}

  {% elif MESH == "calibrate" %}
    RESPOND TYPE=command MSG="START_PRINT: Eddy service mesh calibration, method={MESH_METHOD}"
    TREED_BED_MESH_CALIBRATE_EDDY PROFILE={MESH_PROFILE} METHOD={MESH_METHOD} ADAPTIVE=0{mesh_bounds}

  {% elif MESH == "none" %}
    RESPOND TYPE=command MSG="START_PRINT: bed mesh disabled"

  {% else %}
    {action_raise_error("START_PRINT: неверный MESH='" ~ MESH ~ "'. Нужно: load/adaptive/calibrate/none")}
  {% endif %}

  # Единственный переход в координаты слайсера после всех сервисных движений.
  _TREED_PRINT_OFFSET_ENABLE
  _TREED_KAMP_SMART_PARK

# Блок 6: Опциональная light/full калибровка input shaper перед печатью.
[gcode_macro _TREED_START_INPUT_SHAPER]
description: "SYSTEM: optional START_PRINT input shaper calibration"
gcode:
  {% if printer["gcode_macro _TREED_OPERATION_STATE"].phase|string|lower != "preparing" %}
    {action_raise_error("START_PRINT: input shaper доступен только на этапе подготовки")}
  {% endif %}
  {% set st = printer["gcode_macro _TREED_START_STATE"] %}
  {% set SHAPER = st.shaper|default("none")|lower %}
  {% set SHAPER_ACCEL = st.shaper_accel|default("auto")|lower %}

  {% if SHAPER == "none" %}
    RESPOND PREFIX="treed" MSG="START_PRINT: input shaper calibration skipped"
  {% else %}
    RESPOND PREFIX="treed" MSG="START_PRINT: input shaper {SHAPER}, accel={SHAPER_ACCEL}"
    SET_GCODE_VARIABLE MACRO=_TREED_OPERATION_STATE VARIABLE=phase VALUE="'start_calibrating'"
    TREED_SHAPER_CALIBRATE MODE={SHAPER} ACCEL={SHAPER_ACCEL} SAVE=0 HOME=0
    SET_GCODE_VARIABLE MACRO=_TREED_OPERATION_STATE VARIABLE=phase VALUE="'preparing'"
  {% endif %}

# Блок 7: Финальный нагрев сопла до рабочей зоны температуры печати.
[gcode_macro _TREED_START_FINAL_HEAT]
description: "SYSTEM: финальный нагрев сопла перед KAMP purge с нижним допуском"
gcode:
  {% set st = printer["gcode_macro _TREED_START_STATE"] %}
  {% set TARGET = st.extruder_temp|float %}
  {% set READY_MARGIN = st.hotend_ready_margin|float %}
  {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
  {% set wait_min = TARGET - READY_MARGIN %}
  {% if wait_min < min_extrude %}
    {% set wait_min = min_extrude %}
  {% endif %}
  M104 S{TARGET}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wait_min}

# Блок 8: Адаптивный purge через KAMP.
[gcode_macro _TREED_START_KAMP_PURGE]
description: "SYSTEM: адаптивный KAMP purge возле модели"
gcode:
  _TREED_KAMP_LINE_PURGE

# Блок 9: Пост-хуки START_PRINT.
[gcode_macro _TREED_START_POST_HOOKS]
description: "SYSTEM: пост-хуки START_PRINT"
gcode:
  {% set st = printer["gcode_macro _TREED_START_STATE"] %}
  _TREED_CAM_START
  SET_GCODE_VARIABLE MACRO=_TREED_OPERATION_STATE VARIABLE=phase VALUE="'printing'"
  RESPOND PREFIX="treed" MSG="START_PRINT завершен: bed={st.bed_temp|float} hotend={st.extruder_temp|float}"

# Блок 10: Публичная точка входа старта печати.
[gcode_macro START_PRINT]
description: "TreeD: старт печати (валидация, нагрев, mesh, KAMP purge, камера)"
gcode:
  {% set mesh_bounds = (" MESH_MIN=" ~ params.MESH_MIN if params.MESH_MIN is defined else "") ~ (" MESH_MAX=" ~ params.MESH_MAX if params.MESH_MAX is defined else "") %}
  {% set MESH = params.MESH|default("load")|lower %}
  {% set DEFAULT_MESH_METHOD = "scan" if MESH == "adaptive" else "automatic" %}
  {% set MESH_METHOD = params.MESH_METHOD|default(DEFAULT_MESH_METHOD)|lower %}
  {% set SHAPER = params.SHAPER|default("none")|lower %}
  {% set SHAPER_ACCEL = params.SHAPER_ACCEL|default("auto")|lower %}

  _TREED_OPERATION_REQUIRE OP=start
  _TREED_START_PREP_STATE BED_TEMP={params.BED_TEMP|default(0)} EXTRUDER_TEMP={params.EXTRUDER_TEMP|default(0)} MESH={MESH} MESH_PROFILE={params.MESH_PROFILE|default("default")} MESH_METHOD={MESH_METHOD} ADAPTIVE_MARGIN={params.ADAPTIVE_MARGIN|default(5)} HOTEND_READY_MARGIN={params.HOTEND_READY_MARGIN|default(3)} SHAPER={SHAPER} SHAPER_ACCEL={SHAPER_ACCEL}{mesh_bounds}
  _TREED_KAMP_REQUIRE_READY
  SET_GCODE_VARIABLE MACRO=_TREED_OPERATION_STATE VARIABLE=phase VALUE="'preparing'"

  _TREED_START_MACHINE_PREP
  _TREED_START_PREHEAT
  _TREED_HOME_ALL
  _TREED_START_INPUT_SHAPER
  _TREED_START_KAMP_PREP{mesh_bounds}
  _TREED_START_FINAL_HEAT
  _TREED_START_KAMP_PURGE
  _TREED_START_POST_HOOKS

# Блок 11: Завершение печати, парковка и остановка камеры.
[gcode_macro END_PRINT]
description: "TreeD: завершение печати (подъем, парковка, охлаждение, стоп камеры)"
gcode:
  TURN_OFF_HEATERS
  M106 S0
  _TREED_CAM_STOP
  SET_GCODE_VARIABLE MACRO=_TREED_OPERATION_STATE VARIABLE=phase VALUE="'idle'"
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE=0.0

  {% if "z" in printer.toolhead.homed_axes %}
    _TREED_EDDY_CAPTURE_LIVE_Z_OFFSET SAVE={params.SAVE_Z_OFFSET|default(1)|int}
  {% endif %}
  # Временный offset очищаем после захвата, до необязательной парковки.
  _TREED_UI_RESET_Z_OFFSET

  {% set toolhead = printer.toolhead %}

  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}

  {% set xy_backoff = printer["gcode_macro G28"].xy_backoff_mm|float %}
  {% if xy_backoff < 0.0 %}{% set xy_backoff = 0.0 %}{% endif %}
  {% set park_x = x_min + xy_backoff %}
  {% set park_y = y_max - xy_backoff %}
  {% if park_x < x_min %}{% set park_x = x_min %}{% endif %}
  {% if park_y < y_min %}{% set park_y = y_min %}{% endif %}
  {% if park_x > x_max %}{% set park_x = x_max %}{% endif %}
  {% if park_y > y_max %}{% set park_y = y_max %}{% endif %}

  # Перед сервисной парковкой возвращаемся в raw coords.
  _TREED_PRINT_OFFSET_DISABLE
  G90
  G92 E0
  {% if printer.extruder.can_extrude %}
    G1 E-2 F1800
  {% else %}
    RESPOND PREFIX="treed" MSG="END_PRINT: retract skipped, hotend below min_extrude_temp"
  {% endif %}
  {% set pos = toolhead.position %}
  {% if "x" in toolhead.homed_axes and "y" in toolhead.homed_axes and "z" in toolhead.homed_axes and
        x_min <= pos.x|float <= x_max and y_min <= pos.y|float <= y_max and
        toolhead.axis_minimum.z|float <= pos.z|float <= toolhead.axis_maximum.z|float %}
    _TREED_Z_HOP_BEFORE_XY
    G1 X{park_x} Y{park_y} F6000
  {% else %}
    RESPOND PREFIX="treed" MSG="END_PRINT: координаты неизвестны или вне пределов; парковка пропущена"
  {% endif %}

  RESPOND PREFIX="treed" MSG="END_PRINT завершен"

  {% if "z" in toolhead.homed_axes %}
    M400
    _TREED_EDDY_APPLY_CAPTURED_Z_OFFSET
  {% endif %}
