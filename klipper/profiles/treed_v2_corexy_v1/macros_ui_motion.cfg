# ==========================================
# ПУБЛИЧНОЕ ПЕРЕМЕЩЕНИЕ ДЛЯ TreeD Shell
# ==========================================
# Назначение:
# - Выполняет относительное перемещение оси и сервисную парковку из touch UI.
# - Проверяет runtime-состояние, homing и границы профиля до смены G-code mode.
# Контур:
# - public/safety: команды live-перемещения осей из TreeD Shell.
# - fail-fast: некорректный запрос не меняет G-code state.

# Блок 1: Безопасное относительное перемещение выбранной оси.
[gcode_macro TREED_UI_MOVE_AXIS]
description: "TreeD UI: безопасное относительное перемещение оси"
gcode:
  {% if params.AXIS is not defined %}
    {action_raise_error("TREED_UI_MOVE_AXIS: требуется AXIS")}
  {% endif %}
  {% if params.DISTANCE is not defined %}
    {action_raise_error("TREED_UI_MOVE_AXIS: требуется DISTANCE")}
  {% endif %}

  {% set AXIS = params.AXIS|string|upper %}
  {% set DISTANCE = params.DISTANCE|float %}
  {% set MAX_DISTANCE = 50.0 %}
  {% set HOMED = printer.toolhead.homed_axes|default("")|lower %}

  _TREED_OPERATION_REQUIRE OP=ui_move

  {% if AXIS not in ["X", "Y", "Z"] %}
    {action_raise_error("TREED_UI_MOVE_AXIS: AXIS должен быть X, Y или Z")}
  {% elif DISTANCE != DISTANCE or DISTANCE == 0 or DISTANCE < -MAX_DISTANCE or DISTANCE > MAX_DISTANCE %}
    {action_raise_error("TREED_UI_MOVE_AXIS: DISTANCE должен быть в диапазоне -50..50 и не равен 0")}
  {% elif AXIS|lower not in HOMED %}
    {action_raise_error("TREED_UI_MOVE_AXIS: выбранная ось не homed")}
  {% else %}
    {% if AXIS == "X" %}
      {% set CURRENT = printer.toolhead.position.x|float %}
      {% set POSITION_MIN = printer.configfile.settings.stepper_x.position_min|float %}
      {% set POSITION_MAX = printer.configfile.settings.stepper_x.position_max|float %}
      {% set DEFAULT_FEEDRATE = 3000.0 %}
      {% set MAX_FEEDRATE = 6000.0 %}
    {% elif AXIS == "Y" %}
      {% set CURRENT = printer.toolhead.position.y|float %}
      {% set POSITION_MIN = printer.configfile.settings.stepper_y.position_min|float %}
      {% set POSITION_MAX = printer.configfile.settings.stepper_y.position_max|float %}
      {% set DEFAULT_FEEDRATE = 3000.0 %}
      {% set MAX_FEEDRATE = 6000.0 %}
    {% else %}
      {% set CURRENT = printer.toolhead.position.z|float %}
      {% set POSITION_MIN = printer.configfile.settings.stepper_z.position_min|float %}
      {% set POSITION_MAX = printer.configfile.settings.stepper_z.position_max|float %}
      {% set DEFAULT_FEEDRATE = 600.0 %}
      {% set MAX_FEEDRATE = 1200.0 %}
    {% endif %}

    {% set TARGET = CURRENT + DISTANCE %}
    {% set FEEDRATE = params.FEEDRATE|default(DEFAULT_FEEDRATE)|float %}

    {% if TARGET < POSITION_MIN or TARGET > POSITION_MAX %}
      {action_raise_error("TREED_UI_MOVE_AXIS: целевая координата вне границ оси")}
    {% elif FEEDRATE != FEEDRATE or FEEDRATE < 60 or FEEDRATE > MAX_FEEDRATE %}
      {action_raise_error("TREED_UI_MOVE_AXIS: FEEDRATE вне допустимого диапазона")}
    {% else %}
      SAVE_GCODE_STATE NAME=TREED_UI_MOVE_AXIS_STATE
      G91
      {% if AXIS == "X" %}
        G1 X{DISTANCE} F{FEEDRATE}
      {% elif AXIS == "Y" %}
        G1 Y{DISTANCE} F{FEEDRATE}
      {% else %}
        G1 Z{DISTANCE} F{FEEDRATE}
      {% endif %}
      RESTORE_GCODE_STATE NAME=TREED_UI_MOVE_AXIS_STATE MOVE=0
    {% endif %}
  {% endif %}

# Блок 2: Нижняя опора создаёт зазор для XY без рабочей Z-привязки через Eddy.
[gcode_macro TREED_UI_SERVICE_MODE]
description: "TreeD UI: стол внизу, печатающая голова в центре"
gcode:
  {% if params|length != 0 %}
    {action_raise_error("TREED_UI_SERVICE_MODE: параметры не поддерживаются")}
  {% endif %}
  {% set th = printer.toolhead %}
  {% set center_x = (th.axis_minimum.x|float + th.axis_maximum.x|float) / 2.0 %}
  {% set center_y = (th.axis_minimum.y|float + th.axis_maximum.y|float) / 2.0 %}
  {% if not th.axis_minimum.x|float < th.axis_maximum.x|float or
        not th.axis_minimum.y|float < th.axis_maximum.y|float or
        center_x - center_x != 0 or center_y - center_y != 0 %}
    {action_raise_error("TREED_UI_SERVICE_MODE: неверные пределы X/Y")}
  {% endif %}
  _TREED_OPERATION_REQUIRE OP=service_mode
  TREED_Z_PARK_BOTTOM_MANUAL
  G28 X Y
  SAVE_GCODE_STATE NAME=TREED_UI_SERVICE_MODE_STATE
  G90
  G1 X{center_x} Y{center_y} F6000
  M400
  RESTORE_GCODE_STATE NAME=TREED_UI_SERVICE_MODE_STATE MOVE=0
