# ==========================================
# ОПЦИОНАЛЬНЫЙ КОНФИГ ДАТЧИКА ФИЛАМЕНТА С ЭНКОДЕРОМ
# TreeD V2 / Octopus Pro stock mapping
# ==========================================
# Назначение:
# - Конфиг для датчика движения филамента: BTT Smart Filament Sensor
#   или аналогичный датчик с энкодером/колёсиком.
# - Датчик отслеживает не просто наличие пластика, а движение филамента
#   во время работы extruder.
#
# Octopus Pro stock mapping:
# - FIL-DET0 / material_0: PG12
# - FIL-DET1 / material_1: PG13
#
# Важно:
# - PB2 не используем как stock-пин для Octopus Pro.
# - Для первого входа используем ^PG12.
# - Если подключишь во второй FIL-вход — заменить на ^PG13.
# - Если логика инверсная/датчик ведёт себя наоборот — попробовать !^PG12.
# Контур:
# - optional: файл подключается вручную из `printer.cfg` после проверки датчика.

# Блок 1: Датчик движения филамента.
[filament_motion_sensor filament]
switch_pin: ^PG12
detection_length: 7.0
extruder: extruder

pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5

runout_gcode:
  PAUSE

insert_gcode:
  RESPOND PREFIX="filament" MSG="Filament motion sensor state changed"
