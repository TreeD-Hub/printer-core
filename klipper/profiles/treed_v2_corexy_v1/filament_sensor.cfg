# ==========================================
# КОНФИГ ДАТЧИКА ФИЛАМЕНТА BTT SFS V2.0
# TreeD V2 / Octopus Pro stock mapping
# ==========================================
# Назначение:
# - Конфиг для BTT Smart Filament Sensor SFS V2.0.
# - Switch-канал отслеживает наличие филамента.
# - Encoder-канал отслеживает движение филамента во время работы extruder.
#
# Текущий deployed mapping:
# - filament_switch: PG13.
# - filament_motion: PG12.
#
# Важно:
# - PB2 не используем как stock-пин для Octopus Pro.
# - В deployed config оба входа заданы без inline pin modifiers: PG13 и PG12.
# - Encoder-канал и его detection_length живут в runtime-generated config.
# - Сервисные LOAD/UNLOAD временно отключают датчики, чтобы ручная протяжка
#   не ставила принтер в PAUSE до homing.
# Контур:
# - required: файл включен из `printer.cfg`; датчик занимает FIL-DET0 и FIL-DET1.

# Блок 1: Публичное состояние и переключение режима датчиков.
[gcode_macro FILAMENT_SENSOR_STATUS]
description: "Filament sensor: current runtime status"
variable_mode: "motion"
gcode:
  {% set selected_mode = printer["gcode_macro FILAMENT_SENSOR_STATUS"].mode|default("motion")|string|lower %}
  {% set switch_enabled = printer["filament_switch_sensor filament_switch"].enabled|default(0)|int if 'filament_switch_sensor filament_switch' in printer else 0 %}
  {% set motion_enabled = printer["filament_motion_sensor filament_motion"].enabled|default(0)|int if 'filament_motion_sensor filament_motion' in printer else 0 %}
  RESPOND PREFIX="filament" MSG="mode={selected_mode}, switch_enabled={switch_enabled}, motion_enabled={motion_enabled}"

[gcode_macro _FILAMENT_SENSOR_APPLY_MODE]
description: "SYSTEM: apply selected filament sensor mode"
gcode:
  {% set mode = params.MODE|default("motion")|string|lower %}
  {% set motion_enabled = 1 if mode == "motion" else 0 %}
  {% if 'filament_switch_sensor filament_switch' in printer %}
    SET_FILAMENT_SENSOR SENSOR=filament_switch ENABLE=1
  {% endif %}
  {% if 'filament_motion_sensor filament_motion' in printer %}
    SET_FILAMENT_SENSOR SENSOR=filament_motion ENABLE={motion_enabled}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=FILAMENT_SENSOR_STATUS VARIABLE=mode VALUE='"{mode}"'

[gcode_macro FILAMENT_SENSOR_SET_MODE]
description: "Filament sensor: set presence or motion mode"
gcode:
  {% set mode = params.MODE|default("")|string|lower %}
  {% set print_state = printer.print_stats.state|default("standby")|string|lower %}
  {% if mode not in ["presence", "motion"] %}
    {action_raise_error("FILAMENT_SENSOR_SET_MODE: MODE must be PRESENCE or MOTION")}
  {% elif print_state in ["printing", "paused"] %}
    {action_raise_error("FILAMENT_SENSOR_SET_MODE: unavailable during active print")}
  {% elif 'filament_switch_sensor filament_switch' not in printer %}
    {action_raise_error("FILAMENT_SENSOR_SET_MODE: filament_switch is unavailable")}
  {% elif mode == "motion" and 'filament_motion_sensor filament_motion' not in printer %}
    {action_raise_error("FILAMENT_SENSOR_SET_MODE: filament_motion is unavailable")}
  {% else %}
    _FILAMENT_SENSOR_APPLY_MODE MODE={mode}
    SAVE_VARIABLE VARIABLE=filament_sensor_mode VALUE='"{mode}"'
  {% endif %}

[delayed_gcode _FILAMENT_SENSOR_RESTORE_MODE]
initial_duration: 1.0
gcode:
  {% set saved_mode = printer.save_variables.variables.filament_sensor_mode|default("motion")|string|lower %}
  {% set mode = saved_mode if saved_mode in ["presence", "motion"] else "motion" %}
  _FILAMENT_SENSOR_APPLY_MODE MODE={mode}

# Блок 2: Ограниченное восстановление подачи при наличии филамента без движения.
[gcode_macro _TREED_CLOG_RECOVERY_STATE]
description: "SYSTEM: состояние автоматической прочистки сопла"
variable_active: 0
variable_attempt: 0
variable_original_current: 0.0
variable_original_hotend_target: 0.0
variable_temperature_multiplier: 1.20
variable_temperature_max: 275.0
variable_current_multiplier: 1.20
variable_current_max: 0.80
variable_extrude_length: 25.0
variable_extrude_speed: 5.0
variable_max_attempts: 5
variable_check_delay: 1.0
variable_timeout: 90.0
gcode:

[gcode_macro _TREED_CLOG_RECOVERY_START]
description: "SYSTEM: запуск автоматической прочистки сопла"
gcode:
  {% set recovery = printer["gcode_macro _TREED_CLOG_RECOVERY_STATE"] %}
  {% set pause_state = printer["gcode_macro _TREED_PAUSE_STATE"] %}
  {% set original_target = pause_state.hotend_target|float %}
  {% set original_current = printer["tmc2209 extruder"].run_current|float %}
  {% set max_temp = printer.configfile.settings.extruder.max_temp|float - 5.0 %}
  {% if recovery.temperature_max|float < max_temp %}
    {% set max_temp = recovery.temperature_max|float %}
  {% endif %}
  {% set recovery_target = original_target * recovery.temperature_multiplier|float %}
  {% if recovery_target > max_temp %}{% set recovery_target = max_temp %}{% endif %}
  {% set recovery_current = original_current * recovery.current_multiplier|float %}
  {% if recovery_current > recovery.current_max|float %}
    {% set recovery_current = recovery.current_max|float %}
  {% endif %}
  {% if recovery_current < original_current %}{% set recovery_current = original_current %}{% endif %}

  {% if recovery.active|int == 1 %}
    RESPOND PREFIX="filament" MSG="Nozzle recovery is already active"
  {% elif printer.pause_resume.is_paused|int != 1 or pause_state.is_active|int != 1 %}
    {action_raise_error("Nozzle recovery requires an active TreeD pause")}
  {% elif original_target < printer.configfile.settings.extruder.min_extrude_temp|float %}
    M104 S140
    RESPOND PREFIX="filament" MSG="Nozzle recovery skipped: saved hotend target is too low"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=attempt VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=original_current VALUE={original_current}
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=original_hotend_target VALUE={original_target}
    M109 S{recovery_target}
    SET_TMC_CURRENT STEPPER=extruder CURRENT={recovery_current}
    UPDATE_DELAYED_GCODE ID=_TREED_CLOG_RECOVERY_TIMEOUT DURATION={recovery.timeout|float}
    _TREED_CLOG_RECOVERY_ATTEMPT
  {% endif %}

[gcode_macro _TREED_CLOG_RECOVERY_ATTEMPT]
description: "SYSTEM: одна попытка автоматической прочистки сопла"
gcode:
  {% set recovery = printer["gcode_macro _TREED_CLOG_RECOVERY_STATE"] %}
  {% set attempt = recovery.attempt|int + 1 %}
  {% if recovery.active|int == 1 and printer.pause_resume.is_paused|int == 1 and attempt <= recovery.max_attempts|int %}
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=attempt VALUE={attempt}
    RESPOND PREFIX="filament" MSG="Nozzle recovery attempt {attempt}/{recovery.max_attempts|int}"
    M83
    G92 E0
    G1 E{recovery.extrude_length|float} F{recovery.extrude_speed|float * 60.0}
    M400
    UPDATE_DELAYED_GCODE ID=_TREED_CLOG_RECOVERY_CHECK DURATION={recovery.check_delay|float}
  {% endif %}

[delayed_gcode _TREED_CLOG_RECOVERY_CHECK]
gcode:
  {% set recovery = printer["gcode_macro _TREED_CLOG_RECOVERY_STATE"] %}
  {% set switch = printer["filament_switch_sensor filament_switch"] %}
  {% set motion = printer["filament_motion_sensor filament_motion"] %}
  {% if recovery.active|int == 1 %}
    {% if printer.pause_resume.is_paused|int != 1 %}
      _TREED_CLOG_RECOVERY_ABORT COOLDOWN=0
    {% elif switch.filament_detected|int != 1 %}
      _TREED_CLOG_RECOVERY_FINISH SUCCESS=0 REASON=no_filament
    {% elif motion.filament_detected|int == 1 %}
      _TREED_CLOG_RECOVERY_FINISH SUCCESS=1 REASON=motion_restored
    {% elif recovery.attempt|int >= recovery.max_attempts|int %}
      _TREED_CLOG_RECOVERY_FINISH SUCCESS=0 REASON=no_motion
    {% else %}
      UPDATE_DELAYED_GCODE ID=_TREED_CLOG_RECOVERY_TIMEOUT DURATION={recovery.timeout|float}
      _TREED_CLOG_RECOVERY_ATTEMPT
    {% endif %}
  {% endif %}

[gcode_macro _TREED_CLOG_RECOVERY_FINISH]
description: "SYSTEM: завершение автоматической прочистки сопла"
gcode:
  {% set recovery = printer["gcode_macro _TREED_CLOG_RECOVERY_STATE"] %}
  {% set success = params.SUCCESS|default(0)|int %}
  {% set reason = params.REASON|default("unknown")|string %}
  {% if recovery.active|int == 1 %}
    SET_TMC_CURRENT STEPPER=extruder CURRENT={recovery.original_current|float}
    UPDATE_DELAYED_GCODE ID=_TREED_CLOG_RECOVERY_CHECK DURATION=0
    UPDATE_DELAYED_GCODE ID=_TREED_CLOG_RECOVERY_TIMEOUT DURATION=0
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=attempt VALUE=0
    {% if success == 1 %}
      M104 S{recovery.original_hotend_target|float}
      RESPOND PREFIX="filament" MSG="Nozzle recovery succeeded; resuming print"
      RESUME
    {% else %}
      M104 S140
      RESPOND PREFIX="filament" MSG="Nozzle recovery failed ({reason}); printer remains paused at 140C"
    {% endif %}
  {% endif %}

[gcode_macro _TREED_CLOG_RECOVERY_ABORT]
description: "SYSTEM: остановка автоматической прочистки с восстановлением тока"
gcode:
  {% set recovery = printer["gcode_macro _TREED_CLOG_RECOVERY_STATE"] %}
  {% set cooldown = params.COOLDOWN|default(1)|int %}
  {% if recovery.active|int == 1 %}
    SET_TMC_CURRENT STEPPER=extruder CURRENT={recovery.original_current|float}
    UPDATE_DELAYED_GCODE ID=_TREED_CLOG_RECOVERY_CHECK DURATION=0
    UPDATE_DELAYED_GCODE ID=_TREED_CLOG_RECOVERY_TIMEOUT DURATION=0
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_CLOG_RECOVERY_STATE VARIABLE=attempt VALUE=0
    {% if cooldown == 1 %}
      M104 S140
    {% endif %}
    RESPOND PREFIX="filament" MSG="Nozzle recovery aborted"
  {% endif %}

[delayed_gcode _TREED_CLOG_RECOVERY_TIMEOUT]
gcode:
  {% if printer["gcode_macro _TREED_CLOG_RECOVERY_STATE"].active|int == 1 %}
    RESPOND TYPE=error MSG="Nozzle recovery timeout"
    _TREED_CLOG_RECOVERY_ABORT COOLDOWN=1
  {% endif %}

# Блок 3: Единый guard для runout-событий от датчиков.
[gcode_macro _TREED_FILAMENT_RUNOUT_PAUSE]
description: "SYSTEM: guard PAUSE от датчиков филамента"
gcode:
  {% set source = params.SOURCE|default("filament")|string %}
  {% set message = params.MSG|default("Filament runout")|string %}
  {% set state = printer.print_stats.state|default("standby")|string %}
  {% set paused = printer.pause_resume.is_paused|default(0)|int %}
  {% set homed = printer.toolhead.homed_axes|default("")|string %}
  {% set can_pause = state == "printing" and paused == 0 and "x" in homed and "y" in homed and "z" in homed %}
  {% set mode = printer["gcode_macro FILAMENT_SENSOR_STATUS"].mode|default("motion")|string|lower %}
  {% set switch = printer["filament_switch_sensor filament_switch"] %}
  {% set motion_available = 'filament_motion_sensor filament_motion' in printer %}
  {% set motion_enabled = printer["filament_motion_sensor filament_motion"].enabled|default(0)|int if motion_available else 0 %}
  {% set motion_detected = printer["filament_motion_sensor filament_motion"].filament_detected|default(0)|int if motion_available else 0 %}
  {% set is_clog = source == "filament_motion" and mode == "motion" and switch.enabled|int == 1 and switch.filament_detected|int == 1 and motion_enabled == 1 and motion_detected == 0 %}
  {% if can_pause %}
    RESPOND PREFIX="filament" MSG="{message}"
    {% if is_clog %}
      _TREED_PAUSE_PREP_STATE
      _TREED_PAUSE_EXEC KEEP_HOTEND=1
      _TREED_CLOG_RECOVERY_START
    {% else %}
      PAUSE
    {% endif %}
  {% else %}
    RESPOND PREFIX="filament" MSG="{source}: runout ignored outside active homed print (state={state}, paused={paused}, homed={homed})"
  {% endif %}

# Блок 4: Switch-канал наличия филамента.
[filament_switch_sensor filament_switch]
switch_pin: PG13
pause_on_runout: False
event_delay: 3.0

runout_gcode:
  _TREED_FILAMENT_RUNOUT_PAUSE SOURCE=filament_switch MSG="Filament switch runout: no filament"

insert_gcode:
  RESPOND PREFIX="filament" MSG="Filament switch inserted"
