# ==========================================
# КОНФИГ ДАТЧИКА ФИЛАМЕНТА BTT SFS V2.0
# TreeD V2 / Octopus Pro stock mapping
# ==========================================
# Назначение:
# - Конфиг для BTT Smart Filament Sensor SFS V2.0.
# - Switch-канал отслеживает наличие филамента.
# - Encoder-канал отслеживает движение филамента во время работы extruder.
#
# Octopus Pro stock mapping:
# - FIL-DET0 / material_0: PG12, switch sensor.
# - FIL-DET1 / material_1: PG13, encoder/motion sensor.
#
# Важно:
# - PB2 не используем как stock-пин для Octopus Pro.
# - Оба входа работают с pull-up: ^PG12 и ^PG13.
# - detection_length 3.0 мм — стартовая настройка из calibration guide SFS V2.0.
# - Если будут ложные срабатывания encoder-канала, увеличить detection_length
#   шагом по 1 мм.
# Контур:
# - required: файл включен из `printer.cfg`; датчик занимает FIL-DET0 и FIL-DET1.

# Блок 1: Switch-канал наличия филамента.
[filament_switch_sensor filament_switch]
switch_pin: PG13
pause_on_runout: False
event_delay: 3.0

runout_gcode:
  PAUSE
  RESPOND PREFIX="filament" MSG="Filament switch runout: no filament"

insert_gcode:
  RESPOND PREFIX="filament" MSG="Filament switch inserted"

# Блок 2: Encoder-канал движения филамента.
[filament_motion_sensor filament_motion]
switch_pin: PG12
detection_length: 15.0
extruder: extruder
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.5

runout_gcode:
  PAUSE
  RESPOND PREFIX="filament" MSG="Filament encoder runout: no filament motion"

insert_gcode:
  RESPOND PREFIX="filament" MSG="Filament encoder signal restored"
