# ==========================================
# КОНФИГ ДАТЧИКА ФИЛАМЕНТА BTT SFS V2.0
# TreeD V2 / Octopus Pro stock mapping
# ==========================================
# Назначение:
# - Конфиг для BTT Smart Filament Sensor SFS V2.0.
# - Switch-канал отслеживает наличие филамента.
# - Encoder-канал отслеживает движение филамента во время работы extruder.
#
# Текущий deployed mapping:
# - filament_switch: PG13.
# - filament_motion: PG12.
#
# Важно:
# - PB2 не используем как stock-пин для Octopus Pro.
# - В deployed config оба входа заданы без inline pin modifiers: PG13 и PG12.
# - Encoder-канал и его detection_length живут в runtime-generated config.
# - Сервисные LOAD/UNLOAD временно отключают датчики, чтобы ручная протяжка
#   не ставила принтер в PAUSE до homing.
# Контур:
# - required: файл включен из `printer.cfg`; датчик занимает FIL-DET0 и FIL-DET1.

# Блок 1: Публичное состояние и переключение режима датчиков.
[gcode_macro FILAMENT_SENSOR_STATUS]
description: "Filament sensor: current runtime status"
variable_mode: "presence"
gcode:
  {% set selected_mode = printer["gcode_macro FILAMENT_SENSOR_STATUS"].mode|default("presence")|string|lower %}
  {% set switch_enabled = printer["filament_switch_sensor filament_switch"].enabled|default(0)|int if 'filament_switch_sensor filament_switch' in printer else 0 %}
  {% set motion_enabled = printer["filament_motion_sensor filament_motion"].enabled|default(0)|int if 'filament_motion_sensor filament_motion' in printer else 0 %}
  RESPOND PREFIX="filament" MSG="mode={selected_mode}, switch_enabled={switch_enabled}, motion_enabled={motion_enabled}"

[gcode_macro _FILAMENT_SENSOR_APPLY_MODE]
description: "SYSTEM: apply selected filament sensor mode"
gcode:
  {% set mode = params.MODE|default("presence")|string|lower %}
  {% set motion_enabled = 1 if mode == "motion" else 0 %}
  {% if 'filament_switch_sensor filament_switch' in printer %}
    SET_FILAMENT_SENSOR SENSOR=filament_switch ENABLE=1
  {% endif %}
  {% if 'filament_motion_sensor filament_motion' in printer %}
    SET_FILAMENT_SENSOR SENSOR=filament_motion ENABLE={motion_enabled}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=FILAMENT_SENSOR_STATUS VARIABLE=mode VALUE='"{mode}"'

[gcode_macro FILAMENT_SENSOR_SET_MODE]
description: "Filament sensor: set presence or motion mode"
gcode:
  {% set mode = params.MODE|default("")|string|lower %}
  {% set print_state = printer.print_stats.state|default("standby")|string|lower %}
  {% if mode not in ["presence", "motion"] %}
    {action_raise_error("FILAMENT_SENSOR_SET_MODE: MODE must be PRESENCE or MOTION")}
  {% elif print_state in ["printing", "paused"] %}
    {action_raise_error("FILAMENT_SENSOR_SET_MODE: unavailable during active print")}
  {% elif 'filament_switch_sensor filament_switch' not in printer %}
    {action_raise_error("FILAMENT_SENSOR_SET_MODE: filament_switch is unavailable")}
  {% elif mode == "motion" and 'filament_motion_sensor filament_motion' not in printer %}
    {action_raise_error("FILAMENT_SENSOR_SET_MODE: filament_motion is unavailable")}
  {% else %}
    _FILAMENT_SENSOR_APPLY_MODE MODE={mode}
    SAVE_VARIABLE VARIABLE=filament_sensor_mode VALUE='"{mode}"'
  {% endif %}

[delayed_gcode _FILAMENT_SENSOR_RESTORE_MODE]
initial_duration: 1.0
gcode:
  {% set saved_mode = printer.save_variables.variables.filament_sensor_mode|default("presence")|string|lower %}
  {% set mode = saved_mode if saved_mode in ["presence", "motion"] else "presence" %}
  _FILAMENT_SENSOR_APPLY_MODE MODE={mode}

# Блок 2: Единый guard для runout-событий от датчиков.
[gcode_macro _TREED_FILAMENT_RUNOUT_PAUSE]
description: "SYSTEM: guard PAUSE от датчиков филамента"
gcode:
  {% set source = params.SOURCE|default("filament")|string %}
  {% set message = params.MSG|default("Filament runout")|string %}
  {% set state = printer.print_stats.state|default("standby")|string %}
  {% set paused = printer.pause_resume.is_paused|default(0)|int %}
  {% set homed = printer.toolhead.homed_axes|default("")|string %}
  {% set can_pause = state == "printing" and paused == 0 and "x" in homed and "y" in homed and "z" in homed %}
  {% if can_pause %}
    RESPOND PREFIX="filament" MSG="{message}"
    PAUSE
  {% else %}
    RESPOND PREFIX="filament" MSG="{source}: runout ignored outside active homed print (state={state}, paused={paused}, homed={homed})"
  {% endif %}

# Блок 3: Switch-канал наличия филамента.
[filament_switch_sensor filament_switch]
switch_pin: PG13
pause_on_runout: False
event_delay: 3.0

runout_gcode:
  _TREED_FILAMENT_RUNOUT_PAUSE SOURCE=filament_switch MSG="Filament switch runout: no filament"

insert_gcode:
  RESPOND PREFIX="filament" MSG="Filament switch inserted"
