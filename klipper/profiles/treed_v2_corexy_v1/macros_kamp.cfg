# ==========================================
# KAMP-СОВМЕСТИМЫЙ СТАРТ — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Дает SMART_PARK и LINE_PURGE рядом с объектами печати.
# - Клипует все purge/park координаты через `_TREED_GEOMETRY_CFG`, а не через hardcoded 0/max.
# Контур:
# - required: используется START_PRINT после включения print-offset.
# - print coords: все движения этого файла выполняются в координатах слайсера.

# Блок 1: Настройки KAMP-совместимого поведения.
[gcode_macro _KAMP_Settings]
description: "TreeD: настройки SMART_PARK и LINE_PURGE"
variable_verbose_enable: True
variable_purge_height: 0.8
variable_tip_distance: 0
variable_purge_margin: 10
variable_purge_amount: 30
variable_purge_break_distance: 10
variable_flow_rate: 12
variable_smart_park_height: 0.0
gcode:
  RESPOND PREFIX="treed" MSG="_KAMP_Settings хранит параметры и не выполняет действий"

# Блок 2: Fail-fast проверка готовности object-контекста.
[gcode_macro _TREED_KAMP_REQUIRE_READY]
description: "SYSTEM: fail-fast проверка готовности KAMP перед START_PRINT"
gcode:
  {% if printer["gcode_macro _KAMP_Settings"] is not defined %}
    {action_raise_error("START_PRINT: _KAMP_Settings отсутствует")}
  {% endif %}
  {% if printer["gcode_macro SMART_PARK"] is not defined %}
    {action_raise_error("START_PRINT: macro SMART_PARK отсутствует")}
  {% endif %}
  {% if printer["gcode_macro LINE_PURGE"] is not defined %}
    {action_raise_error("START_PRINT: macro LINE_PURGE отсутствует")}
  {% endif %}
  {% if printer.exclude_object is not defined %}
    {action_raise_error("START_PRINT: [exclude_object] не найден; KAMP purge недоступен")}
  {% endif %}
  {% if printer["gcode_macro _TREED_PRINT_AREA_CFG"].print_offset_enabled|int != 1 %}
    {action_raise_error("START_PRINT: print-offset должен быть включен до KAMP")}
  {% endif %}

  {% set objects = printer.exclude_object.objects|default([]) %}
  {% if objects|length == 0 %}
    {action_raise_error("START_PRINT: нет object-метаданных; включите object labels в slicer и enable_object_processing в Moonraker")}
  {% endif %}

  {% set all_points = objects | map(attribute='polygon') | sum(start=[]) %}
  {% if all_points|length == 0 %}
    {action_raise_error("START_PRINT: object-метаданные не содержат polygon-точек для KAMP")}
  {% endif %}

  {% set max_xs = printer.configfile.settings.extruder.max_extrude_cross_section|default(0)|float %}
  {% if max_xs < 5.0 %}
    {action_raise_error("START_PRINT: extruder.max_extrude_cross_section должен быть >= 5 для LINE_PURGE")}
  {% endif %}

# Блок 3: Парковка рядом с минимальной точкой объекта в print coords.
[gcode_macro SMART_PARK]
description: "TreeD: парковка головы у стола рядом с объектом перед финальным нагревом"
gcode:
  {% set homed = printer.toolhead.homed_axes|lower %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    RESPOND PREFIX="treed" MSG="SMART_PARK: оси не homed ({homed}), выполняю G28"
    G28
  {% endif %}

  {% set settings = printer["gcode_macro _KAMP_Settings"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set z_height = settings.smart_park_height|float %}
  {% set purge_margin = settings.purge_margin|float %}
  {% set verbose_enable = settings.verbose_enable|int %}
  {% set print_min_x = geo.print_min_x|float %}
  {% set print_min_y = geo.print_min_y|float %}
  {% set print_max_x = print_min_x + geo.print_size_x|float %}
  {% set print_max_y = print_min_y + geo.print_size_y|float %}
  {% set center_x = print_min_x + (geo.print_size_x|float / 2.0) %}
  {% set center_y = print_min_y + (geo.print_size_y|float / 2.0) %}
  {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
  {% set park_x = (all_points | map(attribute=0) | min | default(center_x)) - purge_margin %}
  {% set park_y = (all_points | map(attribute=1) | min | default(center_y)) - purge_margin %}
  {% set travel_speed = printer.toolhead.max_velocity|float * 60.0 %}

  {% if park_x < print_min_x %}{% set park_x = print_min_x %}{% endif %}
  {% if park_y < print_min_y %}{% set park_y = print_min_y %}{% endif %}
  {% if park_x > print_max_x %}{% set park_x = print_max_x %}{% endif %}
  {% if park_y > print_max_y %}{% set park_y = print_max_y %}{% endif %}

  {% if verbose_enable == 1 %}
    RESPOND PREFIX="treed" MSG="SMART_PARK: X={park_x} Y={park_y} Z={z_height}"
  {% endif %}

  SAVE_GCODE_STATE NAME=TREED_SMART_PARK_STATE
  G90
  G0 X{park_x} Y{park_y} F{travel_speed}
  G0 Z{z_height} F{travel_speed}
  # Важный контракт: SMART_PARK должен оставить голову в park-точке,
  # а не выполнять возврат в предыдущее XYZ после парковки.
  RESTORE_GCODE_STATE NAME=TREED_SMART_PARK_STATE MOVE=0

# Блок 4: Адаптивный purge с клипингом по печатной области.
[gcode_macro LINE_PURGE]
description: "TreeD: purge-линия рядом с объектом в пределах print-area"
gcode:
  {% set homed = printer.toolhead.homed_axes|lower %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    RESPOND PREFIX="treed" MSG="LINE_PURGE: оси не homed ({homed}), выполняю G28"
    G28
  {% endif %}

  {% set settings = printer["gcode_macro _KAMP_Settings"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set verbose_enable = settings.verbose_enable|int %}
  {% set purge_height = settings.purge_height|float %}
  {% set tip_distance = settings.tip_distance|float %}
  {% set purge_margin = settings.purge_margin|float %}
  {% set purge_amount = settings.purge_amount|float %}
  {% set break_distance = settings.purge_break_distance|float %}
  {% if break_distance < 0.0 %}{% set break_distance = 0.0 %}{% endif %}
  {% set flow_rate = settings.flow_rate|float %}
  {% set print_min_x = geo.print_min_x|float %}
  {% set print_min_y = geo.print_min_y|float %}
  {% set print_max_x = print_min_x + geo.print_size_x|float %}
  {% set print_max_y = print_min_y + geo.print_size_y|float %}
  {% set travel_speed = printer.toolhead.max_velocity|float * 60.0 %}
  {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section|float %}
  {% set purge_move_speed = (flow_rate / 5.0) * 60.0 %}
  {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
  {% set obj_x_min = all_points | map(attribute=0) | min %}
  {% set obj_x_max = all_points | map(attribute=0) | max %}
  {% set obj_y_min = all_points | map(attribute=1) | min %}
  {% set obj_y_max = all_points | map(attribute=1) | max %}
  {% set max_start_x = print_max_x - purge_amount - break_distance %}
  {% set max_start_y = print_max_y - purge_amount - break_distance %}
  {% set purge_x_center = ((obj_x_max + obj_x_min) / 2.0) - (purge_amount / 2.0) %}
  {% set purge_y_center = ((obj_y_max + obj_y_min) / 2.0) - (purge_amount / 2.0) %}
  {% set purge_x_origin = obj_x_min - purge_margin %}
  {% set purge_y_origin = obj_y_min - purge_margin %}
  {% set use_horizontal = 1 if purge_y_origin >= print_min_y and max_start_x >= print_min_x else 0 %}

  {% if cross_section < 5.0 %}
    {action_raise_error("LINE_PURGE: extruder.max_extrude_cross_section должен быть >= 5")}
  {% endif %}
  {% if purge_amount <= 0.0 %}
    {action_raise_error("LINE_PURGE: purge_amount должен быть > 0")}
  {% endif %}
  {% if max_start_x < print_min_x and max_start_y < print_min_y %}
    {action_raise_error("LINE_PURGE: purge_amount не помещается в печатную область")}
  {% endif %}

  {% if printer.firmware_retraction is defined %}
    {% set retract_cmd = "G10" %}
  {% else %}
    {% set retract_cmd = "G1 E-.5 F2100" %}
  {% endif %}

  SAVE_GCODE_STATE NAME=TREED_LINE_PURGE_STATE
  G92 E0
  G0 F{travel_speed}
  G90
  M83
  G0 Z{purge_height}

  {% if use_horizontal == 1 %}
    {% if purge_x_center < print_min_x %}{% set purge_x_center = print_min_x %}{% endif %}
    {% if purge_x_center > max_start_x %}{% set purge_x_center = max_start_x %}{% endif %}
    {% if purge_y_origin > print_max_y %}{% set purge_y_origin = print_max_y %}{% endif %}

    {% if verbose_enable == 1 %}
      RESPOND PREFIX="treed" MSG="LINE_PURGE: horizontal X={purge_x_center}..{purge_x_center + purge_amount}, Y={purge_y_origin}"
    {% endif %}

    G0 X{purge_x_center} Y{purge_y_origin}
    G1 E{tip_distance} F{purge_move_speed}
    G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}
    {retract_cmd}
    G0 X{purge_x_center + purge_amount + break_distance} F{travel_speed}
  {% else %}
    {% if max_start_y < print_min_y %}
      {action_raise_error("LINE_PURGE: нет места для вертикальной purge-линии")}
    {% endif %}
    {% if purge_y_center < print_min_y %}{% set purge_y_center = print_min_y %}{% endif %}
    {% if purge_y_center > max_start_y %}{% set purge_y_center = max_start_y %}{% endif %}
    {% if purge_x_origin < print_min_x %}{% set purge_x_origin = print_min_x %}{% endif %}
    {% if purge_x_origin > print_max_x %}{% set purge_x_origin = print_max_x %}{% endif %}

    {% if verbose_enable == 1 %}
      RESPOND PREFIX="treed" MSG="LINE_PURGE: vertical X={purge_x_origin}, Y={purge_y_center}..{purge_y_center + purge_amount}"
    {% endif %}

    G0 X{purge_x_origin} Y{purge_y_center}
    G1 E{tip_distance} F{purge_move_speed}
    G1 Y{purge_y_center + purge_amount} E{purge_amount} F{purge_move_speed}
    {retract_cmd}
    G0 Y{purge_y_center + purge_amount + break_distance} F{travel_speed}
  {% endif %}

  G92 E0
  G0 Z{purge_height * 2.0} F{travel_speed}
  # Важный контракт: после purge не выполняем автоматический возврат
  # в сохраненное XYZ, иначе можно получить move в «старую» позицию.
  RESTORE_GCODE_STATE NAME=TREED_LINE_PURGE_STATE MOVE=0
