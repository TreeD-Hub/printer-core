# ==========================================
# БЛОКИ UI/WEB ИНТЕГРАЦИИ — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Включает стандартные интерфейсные секции для Mainsail/Fluidd.
# - Не содержит кинематики или логики печати.
# Контур:
# - required: обеспечивает UI, pause_resume и RESPOND.

# Блок 1: Виртуальная SD-карта.
[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: TURN_OFF_HEATERS

# Блок 2: Макросы паузы/возобновления.
[pause_resume]
recover_velocity: 150.0

# Блок 3: Текущий статус печати для UI.
[display_status]

# Блок 4: Команда RESPOND для консоли UI.
[respond]
default_type: echo
default_prefix: echo:
