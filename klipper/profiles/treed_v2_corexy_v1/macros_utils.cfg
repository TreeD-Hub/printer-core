# ==========================================
# УТИЛИТЫ ОПЕРАТОРА
# ==========================================
# Назначение:
# - Хранит ручные сервисные команды для UI и обслуживания.
# - Защищает опасные операции от запуска во время печати и паузы.
# Контур:
# - public/service: команды вызываются оператором вручную.
# - fail-fast: сервисные тесты не запускаются во время активной печати.

# Блок 1: Безопасный SAVE_CONFIG.
[gcode_macro TREED_SAVE_CONFIG]
description: "TreeD: безопасный SAVE_CONFIG (запрещено во время печати и паузы)"
gcode:
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state == "printing" %}
    {action_raise_error("TREED_SAVE_CONFIG: запрещено во время печати")}
  {% endif %}
  {% if is_paused == 1 %}
    {action_raise_error("TREED_SAVE_CONFIG: запрещено во время паузы")}
  {% endif %}

  RESPOND PREFIX="treed" MSG="TREED_SAVE_CONFIG: applying SAVE_CONFIG"
  SAVE_CONFIG

# Блок 2: Публичный XY stress test после homing.
[gcode_macro TREED_XY_MOTION_TEST]
description: "SERVICE: full homing, then XY stress test"
gcode:
  {% set SPEED = params.SPEED|default(200)|float %}
  {% set ACCEL = params.ACCEL|default(5000)|float %}
  {% set ITER = params.ITER|default(2)|int %}
  {% set MARGIN = params.MARGIN|default(15)|float %}
  {% set SAFE_Z = params.Z|default(20)|float %}
  {% set END_Z = params.END_Z|default(100)|float %}
  {% set Z_SPEED = params.Z_SPEED|default(10)|float %}
  {% set SCV = params.SCV|default(printer.toolhead.square_corner_velocity)|float %}
  {% set ZIGZAG_STEPS = params.ZIGZAG_STEPS|default(5)|int %}
  {% set CIRCLE_RADIUS = params.CIRCLE_RADIUS|default(0)|float %}
  {% set SMALL_STEP = params.SMALL_STEP|default(5)|float %}
  {% set SMALL_REPEATS = params.SMALL_REPEATS|default(8)|int %}

  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state == "printing" %}
    { action_raise_error("TREED_XY_MOTION_TEST: запрещено во время печати") }
  {% endif %}
  {% if is_paused == 1 %}
    { action_raise_error("TREED_XY_MOTION_TEST: запрещено во время паузы") }
  {% endif %}

  { action_respond_info("TREED_XY_MOTION_TEST: homing all axes") }

  G28

  TREED_MOTION_GUARD ACTION=XY_TEST SPEED={SPEED} ACCEL={ACCEL} ITER={ITER} MARGIN={MARGIN} Z={SAFE_Z} END_Z={END_Z} Z_SPEED={Z_SPEED} SCV={SCV} ZIGZAG_STEPS={ZIGZAG_STEPS} CIRCLE_RADIUS={CIRCLE_RADIUS} SMALL_STEP={SMALL_STEP} SMALL_REPEATS={SMALL_REPEATS}

# Блок 3: Исполнитель XY stress test.
[gcode_macro _TREED_XY_MOTION_TEST_RUN]
description: "SYSTEM: XY stress test runner after homing"
gcode:
  {% set SPEED = params.SPEED|default(200)|float %}
  {% set ACCEL = params.ACCEL|default(5000)|float %}
  {% set ITER = params.ITER|default(2)|int %}
  {% set MARGIN = params.MARGIN|default(15)|float %}
  {% set SAFE_Z = params.Z|default(20)|float %}
  {% set END_Z = params.END_Z|default(100)|float %}
  {% set Z_SPEED = params.Z_SPEED|default(10)|float %}
  {% set SCV = params.SCV|default(printer.toolhead.square_corner_velocity)|float %}
  {% set ZIGZAG_STEPS = params.ZIGZAG_STEPS|default(5)|int %}
  {% set CIRCLE_RADIUS = params.CIRCLE_RADIUS|default(0)|float %}
  {% set SMALL_STEP = params.SMALL_STEP|default(5)|float %}
  {% set SMALL_REPEATS = params.SMALL_REPEATS|default(8)|int %}

  {% set homed = printer.toolhead.homed_axes|lower %}

  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state == "printing" %}
    { action_raise_error("TREED_XY_MOTION_TEST: запрещено во время печати") }
  {% endif %}
  {% if is_paused == 1 %}
    { action_raise_error("TREED_XY_MOTION_TEST: запрещено во время паузы") }
  {% endif %}

  {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: после G28 должны быть homed X/Y/Z") }
  {% endif %}

  {% if SPEED <= 0 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: SPEED должен быть > 0") }
  {% endif %}

  {% if ACCEL <= 0 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: ACCEL должен быть > 0") }
  {% endif %}

  {% if ITER < 1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: ITER должен быть >= 1") }
  {% endif %}

  {% if ZIGZAG_STEPS < 1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: ZIGZAG_STEPS должен быть >= 1") }
  {% endif %}

  {% if SMALL_STEP <= 0 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: SMALL_STEP должен быть > 0") }
  {% endif %}
  
  {% if SMALL_REPEATS < 1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: SMALL_REPEATS должен быть >= 1") }
  {% endif %}

  {% set x_min = printer.configfile.settings.stepper_x.position_min|default(0)|float %}
  {% set x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set y_min = printer.configfile.settings.stepper_y.position_min|default(0)|float %}
  {% set y_max = printer.configfile.settings.stepper_y.position_max|float %}
  {% set z_min = printer.configfile.settings.stepper_z.position_min|default(0)|float %}
  {% set z_max = printer.configfile.settings.stepper_z.position_max|float %}

  {% set x0 = x_min + MARGIN %}
  {% set x1 = x_max - MARGIN %}
  {% set y0 = y_min + MARGIN %}
  {% set y1 = y_max - MARGIN %}
  {% set cx = (x0 + x1) / 2.0 %}
  {% set cy = (y0 + y1) / 2.0 %}

  {% set area_w = x1 - x0 %}
  {% set area_h = y1 - y0 %}
  {% set auto_circle_radius = ([area_w, area_h]|min) * 0.35 %}
  {% set circle_r = CIRCLE_RADIUS if CIRCLE_RADIUS > 0 else auto_circle_radius %}
  {% set circle_r_0707 = circle_r * 0.70710678 %}
  {% set circle_r_0383 = circle_r * 0.38268343 %}
  {% set circle_r_0924 = circle_r * 0.92387953 %}

  {% if x0 >= x1 or y0 >= y1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: MARGIN слишком большой для рабочей области") }
  {% endif %}

  {% if cx - circle_r < x0 or cx + circle_r > x1 or cy - circle_r < y0 or cy + circle_r > y1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: CIRCLE_RADIUS слишком большой для тестовой области") }
  {% endif %}

  {% if cx - SMALL_STEP < x0 or cx + SMALL_STEP > x1 or cy - SMALL_STEP < y0 or cy + SMALL_STEP > y1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: SMALL_STEP слишком большой для тестовой области") }
  {% endif %}

  {% if SAFE_Z < z_min or SAFE_Z > z_max %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: Z вне допустимого диапазона") }
  {% endif %}

  {% if END_Z < z_min or END_Z > z_max %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: END_Z вне допустимого диапазона") }
  {% endif %}

  {% if END_Z < SAFE_Z %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: END_Z должен быть >= Z, чтобы стол после теста уходил вниз") }
  {% endif %}

  # Камера занимает передний правый угол 30x30 мм; оставляем ещё 1 мм зазора.
  {% set camera_x = x_max - 31.0 %}
  {% set camera_y = y_min + 31.0 %}
  {% set path = namespace(x=printer.toolhead.position.x|float, y=printer.toolhead.position.y|float) %}
  {% if path.x > camera_x and path.y < camera_y %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: начальная позиция внутри зоны камеры") }
  {% endif %}
  {% macro move(x, y) %}
    {% if x > camera_x and y < camera_y %}
      {% set x = camera_x %}
    {% endif %}
    {% if [path.x, x]|max > camera_x and [path.y, y]|min < camera_y and x != path.x %}
      {% set crossing_y = path.y + (y - path.y) * (camera_x - path.x) / (x - path.x) %}
      {% if crossing_y < camera_y %}
        G1 X{camera_x} Y{camera_y} F{SPEED * 60.0}
      {% endif %}
    {% endif %}
    G1 X{x} Y{y} F{SPEED * 60.0}
    {% set path.x = x %}
    {% set path.y = y %}
  {% endmacro %}

  SAVE_GCODE_STATE NAME=TREED_XY_MOTION_TEST_STATE

  G90

  { action_respond_info("_TREED_XY_MOTION_TEST_RUN: SPEED=%.1f ACCEL=%.0f SCV=%.2f ITER=%d END_Z=%.1f CIRCLE_R=%.1f SMALL_STEP=%.1f SMALL_REPEATS=%d" % (SPEED, ACCEL, SCV, ITER, END_Z, circle_r, SMALL_STEP, SMALL_REPEATS)) }

  # Безопасная высота перед XY-тестом.
  {% set current_z = printer.toolhead.position.z|float %}
  {% if current_z < SAFE_Z %}
    G1 Z{SAFE_Z} F{Z_SPEED * 60.0}
  {% endif %}

  M400

  {move(cx, cy)}
  {move(x0, y0)}

  {% for i in range(ITER) %}

    # Периметр.
    {move(x1, y0)}
    {move(x1, y1)}
    {move(x0, y1)}
    {move(x0, y0)}

    # Диагонали.
    {move(x1, y1)}
    {move(x0, y1)}
    {move(x1, y0)}
    {move(x0, y0)}

    # Крест.
    {move(cx, cy)}
    {move(x0, cy)}
    {move(x1, cy)}
    {move(cx, cy)}
    {move(cx, y0)}
    {move(cx, y1)}
    {move(cx, cy)}

    # Зигзаг.
    {% for n in range(ZIGZAG_STEPS + 1) %}
      {% set yy = y0 + ((y1 - y0) * n / ZIGZAG_STEPS) %}
      {% if n % 2 == 0 %}
        {move(x1, yy)}
      {% else %}
        {move(x0, yy)}
      {% endif %}
    {% endfor %}

    {move(x0, y0)}

    # 5) Круг / почти круг через G1-сегменты.
    # Не используем G2/G3, чтобы не зависеть от [gcode_arcs].
    {move(cx + circle_r, cy)}
    {move(cx + circle_r_0924, cy + circle_r_0383)}
    {move(cx + circle_r_0707, cy + circle_r_0707)}
    {move(cx + circle_r_0383, cy + circle_r_0924)}
    {move(cx, cy + circle_r)}
    {move(cx - circle_r_0383, cy + circle_r_0924)}
    {move(cx - circle_r_0707, cy + circle_r_0707)}
    {move(cx - circle_r_0924, cy + circle_r_0383)}
    {move(cx - circle_r, cy)}
    {move(cx - circle_r_0924, cy - circle_r_0383)}
    {move(cx - circle_r_0707, cy - circle_r_0707)}
    {move(cx - circle_r_0383, cy - circle_r_0924)}
    {move(cx, cy - circle_r)}
    {move(cx + circle_r_0383, cy - circle_r_0924)}
    {move(cx + circle_r_0707, cy - circle_r_0707)}
    {move(cx + circle_r_0924, cy - circle_r_0383)}
    {move(cx + circle_r, cy)}

    # 6) Мелкие перемещения вокруг центра.
    # Проверяет люфты, ремни, резкие развороты, мелкий ringing.
    {move(cx, cy)}
    {% for s in range(SMALL_REPEATS) %}
      {move(cx - SMALL_STEP, cy)}
      {move(cx + SMALL_STEP, cy)}
      {move(cx, cy - SMALL_STEP)}
      {move(cx, cy + SMALL_STEP)}
      {move(cx - SMALL_STEP, cy - SMALL_STEP)}
      {move(cx + SMALL_STEP, cy + SMALL_STEP)}
      {move(cx - SMALL_STEP, cy + SMALL_STEP)}
      {move(cx + SMALL_STEP, cy - SMALL_STEP)}
      {move(cx, cy)}
    {% endfor %}

    # 7) Ромбовая восьмерка / петля.
    # Хорошо нагружает CoreXY диагональными сменами направления.
    {move(cx, cy)}
    {move(cx + circle_r, cy)}
    {move(cx, cy + circle_r)}
    {move(cx - circle_r, cy)}
    {move(cx, cy - circle_r)}
    {move(cx + circle_r, cy)}
    {move(cx, cy)}

  {% endfor %}

  M400

  # После теста опускаем стол: для кинематики это движение Z к END_Z.
  G1 Z{END_Z} F{Z_SPEED * 60.0}

  M400

  RESTORE_GCODE_STATE NAME=TREED_XY_MOTION_TEST_STATE MOVE=0

  { action_respond_info("_TREED_XY_MOTION_TEST_RUN: done, bed moved to Z=%.1f" % END_Z) }

# Блок 4: Восстановление лимитов движения из `[printer]`.
[gcode_macro TREED_MOTION_LIMITS_DEFAULT]
description: "SERVICE: restore motion limits from [printer] config"
gcode:
  {% set cfg = printer.configfile.settings.printer %}
  {% set velocity = cfg.max_velocity|float %}
  {% set accel = cfg.max_accel|float %}
  {% set scv = cfg.square_corner_velocity|default(5.0)|float %}

  SET_VELOCITY_LIMIT VELOCITY={velocity} ACCEL={accel} SQUARE_CORNER_VELOCITY={scv}

  RESPOND PREFIX="treed" MSG="TREED_MOTION_LIMITS_DEFAULT: restored VELOCITY={velocity} ACCEL={accel} SCV={scv}"
