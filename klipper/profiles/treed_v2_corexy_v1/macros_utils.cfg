# ==========================================
# УТИЛИТЫ ОПЕРАТОРА
# ==========================================
# В этом модуле находятся ручные сервисные команды для UI.
# TREED_SAVE_CONFIG разрешен только вне активной печати и паузы.

[gcode_macro TREED_SAVE_CONFIG]
description: "TreeD: безопасный SAVE_CONFIG (запрещено во время печати и паузы)"
gcode:
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state == "printing" %}
    {action_raise_error("TREED_SAVE_CONFIG: запрещено во время печати")}
  {% endif %}
  {% if is_paused == 1 %}
    {action_raise_error("TREED_SAVE_CONFIG: запрещено во время паузы")}
  {% endif %}

  RESPOND PREFIX="treed" MSG="TREED_SAVE_CONFIG: applying SAVE_CONFIG"
  SAVE_CONFIG

[gcode_macro TREED_XY_MOTION_TEST]
description: "SERVICE: full homing, then XY stress test"
gcode:
  {% set SPEED = params.SPEED|default(200)|float %}
  {% set ACCEL = params.ACCEL|default(5000)|float %}
  {% set ITER = params.ITER|default(2)|int %}
  {% set MARGIN = params.MARGIN|default(15)|float %}
  {% set SAFE_Z = params.Z|default(20)|float %}
  {% set END_Z = params.END_Z|default(100)|float %}
  {% set Z_SPEED = params.Z_SPEED|default(10)|float %}
  {% set SCV = params.SCV|default(printer.toolhead.square_corner_velocity)|float %}
  {% set ZIGZAG_STEPS = params.ZIGZAG_STEPS|default(5)|int %}

  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state == "printing" %}
    { action_raise_error("TREED_XY_MOTION_TEST: запрещено во время печати") }
  {% endif %}
  {% if is_paused == 1 %}
    { action_raise_error("TREED_XY_MOTION_TEST: запрещено во время паузы") }
  {% endif %}

  { action_respond_info("TREED_XY_MOTION_TEST: homing all axes") }

  G28

  _TREED_XY_MOTION_TEST_RUN SPEED={SPEED} ACCEL={ACCEL} ITER={ITER} MARGIN={MARGIN} Z={SAFE_Z} END_Z={END_Z} Z_SPEED={Z_SPEED} SCV={SCV} ZIGZAG_STEPS={ZIGZAG_STEPS}

[gcode_macro _TREED_XY_MOTION_TEST_RUN]
description: "SYSTEM: XY stress test runner after homing"
gcode:
  {% set SPEED = params.SPEED|default(200)|float %}
  {% set ACCEL = params.ACCEL|default(5000)|float %}
  {% set ITER = params.ITER|default(2)|int %}
  {% set MARGIN = params.MARGIN|default(15)|float %}
  {% set SAFE_Z = params.Z|default(20)|float %}
  {% set END_Z = params.END_Z|default(100)|float %}
  {% set Z_SPEED = params.Z_SPEED|default(10)|float %}
  {% set SCV = params.SCV|default(printer.toolhead.square_corner_velocity)|float %}
  {% set ZIGZAG_STEPS = params.ZIGZAG_STEPS|default(5)|int %}

  {% set homed = printer.toolhead.homed_axes|lower %}

  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state == "printing" %}
    { action_raise_error("TREED_XY_MOTION_TEST: запрещено во время печати") }
  {% endif %}
  {% if is_paused == 1 %}
    { action_raise_error("TREED_XY_MOTION_TEST: запрещено во время паузы") }
  {% endif %}

  {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: после G28 должны быть homed X/Y/Z") }
  {% endif %}

  {% if SPEED <= 0 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: SPEED должен быть > 0") }
  {% endif %}

  {% if ACCEL <= 0 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: ACCEL должен быть > 0") }
  {% endif %}

  {% if ITER < 1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: ITER должен быть >= 1") }
  {% endif %}

  {% if ZIGZAG_STEPS < 1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: ZIGZAG_STEPS должен быть >= 1") }
  {% endif %}

  {% set x_min = printer.configfile.settings.stepper_x.position_min|default(0)|float %}
  {% set x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set y_min = printer.configfile.settings.stepper_y.position_min|default(0)|float %}
  {% set y_max = printer.configfile.settings.stepper_y.position_max|float %}
  {% set z_min = printer.configfile.settings.stepper_z.position_min|default(0)|float %}
  {% set z_max = printer.configfile.settings.stepper_z.position_max|float %}

  {% set x0 = x_min + MARGIN %}
  {% set x1 = x_max - MARGIN %}
  {% set y0 = y_min + MARGIN %}
  {% set y1 = y_max - MARGIN %}
  {% set cx = (x0 + x1) / 2.0 %}
  {% set cy = (y0 + y1) / 2.0 %}

  {% if x0 >= x1 or y0 >= y1 %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: MARGIN слишком большой для рабочей области") }
  {% endif %}

  {% if SAFE_Z < z_min or SAFE_Z > z_max %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: Z вне допустимого диапазона") }
  {% endif %}

  {% if END_Z < z_min or END_Z > z_max %}
    { action_raise_error("_TREED_XY_MOTION_TEST_RUN: END_Z вне допустимого диапазона") }
  {% endif %}

  {% set old_velocity = printer.toolhead.max_velocity|float %}
  {% set old_accel = printer.toolhead.max_accel|float %}
  {% set old_scv = printer.toolhead.square_corner_velocity|float %}

  SAVE_GCODE_STATE NAME=TREED_XY_MOTION_TEST_STATE

  G90

  { action_respond_info("_TREED_XY_MOTION_TEST_RUN: SPEED=%.1f ACCEL=%.0f SCV=%.2f ITER=%d END_Z=%.1f" % (SPEED, ACCEL, SCV, ITER, END_Z)) }

  # Безопасная высота перед XY-тестом.
  {% set current_z = printer.toolhead.position.z|float %}
  {% if current_z < SAFE_Z %}
    G1 Z{SAFE_Z} F{Z_SPEED * 60.0}
  {% endif %}

  M400

  SET_VELOCITY_LIMIT VELOCITY={SPEED} ACCEL={ACCEL} SQUARE_CORNER_VELOCITY={SCV}

  G1 X{cx} Y{cy} F{SPEED * 60.0}
  G1 X{x0} Y{y0} F{SPEED * 60.0}

  {% for i in range(ITER) %}

    # Периметр.
    G1 X{x1} Y{y0} F{SPEED * 60.0}
    G1 X{x1} Y{y1} F{SPEED * 60.0}
    G1 X{x0} Y{y1} F{SPEED * 60.0}
    G1 X{x0} Y{y0} F{SPEED * 60.0}

    # Диагонали.
    G1 X{x1} Y{y1} F{SPEED * 60.0}
    G1 X{x0} Y{y1} F{SPEED * 60.0}
    G1 X{x1} Y{y0} F{SPEED * 60.0}
    G1 X{x0} Y{y0} F{SPEED * 60.0}

    # Крест.
    G1 X{cx} Y{cy} F{SPEED * 60.0}
    G1 X{x0} Y{cy} F{SPEED * 60.0}
    G1 X{x1} Y{cy} F{SPEED * 60.0}
    G1 X{cx} Y{cy} F{SPEED * 60.0}
    G1 X{cx} Y{y0} F{SPEED * 60.0}
    G1 X{cx} Y{y1} F{SPEED * 60.0}
    G1 X{cx} Y{cy} F{SPEED * 60.0}

    # Зигзаг.
    {% for n in range(ZIGZAG_STEPS + 1) %}
      {% set yy = y0 + ((y1 - y0) * n / ZIGZAG_STEPS) %}
      {% if n % 2 == 0 %}
        G1 X{x1} Y{yy} F{SPEED * 60.0}
      {% else %}
        G1 X{x0} Y{yy} F{SPEED * 60.0}
      {% endif %}
    {% endfor %}

    G1 X{x0} Y{y0} F{SPEED * 60.0}

  {% endfor %}

  M400

  # Сначала возвращаем лимиты.
  SET_VELOCITY_LIMIT VELOCITY={old_velocity} ACCEL={old_accel} SQUARE_CORNER_VELOCITY={old_scv}

  # После теста опускаем стол: для кинематики это движение Z к END_Z.
  G1 Z{END_Z} F{Z_SPEED * 60.0}

  M400

  RESTORE_GCODE_STATE NAME=TREED_XY_MOTION_TEST_STATE MOVE=0

  { action_respond_info("_TREED_XY_MOTION_TEST_RUN: done, bed moved to Z=%.1f, velocity limits restored" % END_Z) }

[gcode_macro TREED_MOTION_LIMITS_DEFAULT]
description: "SERVICE: restore motion limits from [printer] config"
gcode:
  {% set cfg = printer.configfile.settings.printer %}
  {% set velocity = cfg.max_velocity|float %}
  {% set accel = cfg.max_accel|float %}
  {% set scv = cfg.square_corner_velocity|default(5.0)|float %}

  SET_VELOCITY_LIMIT VELOCITY={velocity} ACCEL={accel} SQUARE_CORNER_VELOCITY={scv}

  { action_respond_info("TREED_MOTION_LIMITS_DEFAULT: restored VELOCITY=%.1f ACCEL=%.0f SCV=%.2f" % (velocity, accel, scv)) }