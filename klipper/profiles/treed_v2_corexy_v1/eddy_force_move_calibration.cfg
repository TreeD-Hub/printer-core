# ==========================================
# КАЛИБРОВОЧНЫЙ FORCE_MOVE — EDDY
# ==========================================
# Назначение:
# - Включает диагностические команды FORCE_MOVE/SET_KINEMATIC_POSITION только для первичной калибровки Eddy.
# - Не подключается в штатной include-цепочке профиля.
# Контур:
# - calibration-only: подключать вручную через `local_overrides.cfg` и отключать после калибровки.

# Блок 1: Временное разрешение низкоуровневых диагностических перемещений.
[force_move]
enable_force_move: True
