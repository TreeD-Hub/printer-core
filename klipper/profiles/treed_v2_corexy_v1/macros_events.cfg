# События принтера для экранного UI и веб-клиентов через Moonraker.
# Последнее событие доступно после reconnect через printer.objects.subscribe.
# История принадлежит клиенту; sequence действует до перезапуска Klipper.
[gcode_macro _TREED_EVENT]
variable_sequence: 0
variable_code: ""
variable_detail: ""
gcode:
  {% set code = params.CODE|default("")|lower %}
  {% set detail = params.DETAIL|default("")|lower %}
  {% set sequence = printer["gcode_macro _TREED_EVENT"].sequence|int + 1 %}
  {% set allowed = "abcdefghijklmnopqrstuvwxyz0123456789_./" %}
  {% if not code or code|length > 64 or detail|length > 128 %}
    {action_raise_error("TREED_EVENT: некорректный размер события")}
  {% endif %}
  {% for char in code ~ detail %}
    {% if char not in allowed %}
      {action_raise_error("TREED_EVENT: недопустимый символ")}
    {% endif %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_TREED_EVENT VARIABLE=sequence VALUE={sequence}
  SET_GCODE_VARIABLE MACRO=_TREED_EVENT VARIABLE=code VALUE='"{code}"'
  SET_GCODE_VARIABLE MACRO=_TREED_EVENT VARIABLE=detail VALUE='"{detail}"'
  RESPOND PREFIX="treed_event" MSG="v1|{sequence}|{code}|{detail}"
