# Назначение: рабочий режим TMC5160 XYZ и публичная команда TreeD UI.
# Контур: required/runtime; защиту и откат выполняет host extra.

# Блок 1: Владелец группового режима XYZ, экструдер не включён.
[treed_driver_mode]

# Блок 2: Публичный контракт без доступа UI к сырым полям TMC.
[gcode_macro TREED_UI_SET_DRIVER_MODE]
description: "Режим XYZ: MODE=quiet|normal, только вне печати и сервиса"
gcode:
    TREED_DRIVER_MODE_SET {rawparams}
