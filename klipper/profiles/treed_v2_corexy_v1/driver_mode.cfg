# Назначение: рабочий режим TMC5160 XYZ и публичная команда TreeD UI.
# Контур: required/early; включать первым, до TMC и toolhead.

# Блок 1: Полный quiet-профиль №8 задаётся в treed_driver_mode.py.
# Только quiet: 128 микрошагов XYZ, интерполяция, 100 нс, HSTRT=5/TPFD=4,
# StealthChop, PWM по профилю и 180/25000; токи и исходный normal не меняются.
[treed_driver_mode]
# Номиналы сервисных операций, мм/с; ускорение стартового wipe — мм/с².
park_velocity: 100
resume_wipe_velocity: 150
start_wipe_velocity: 300
start_wipe_accel: 12500
travel_velocity: 200
z_travel_velocity: 25
cancel_z_velocity: 5

# Блок 2: Публичный контракт без доступа UI к сырым полям TMC.
[gcode_macro TREED_UI_SET_DRIVER_MODE]
description: "Профиль XYZ: MODE=quiet|normal; смена перезапускает Klipper, затем нужен homing"
gcode:
    TREED_DRIVER_MODE_SET {rawparams}
