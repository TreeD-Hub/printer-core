# ==========================================
# КОНФИГ НАГРЕВА СТОЛА — TreeD V2 / Octopus Pro
# ==========================================
# Octopus Pro stock mapping:
# - BED heater output: PA1
# - Bed thermistor input TB: PF3
#
# Важно:
# - PA0 — это HE0, не стол.
# - PF3 — штатный TB-вход термистора стола.
# - sensor_type зависит от установленного термистора.
#   Для обычного 100K B3950 используем Generic 3950.

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
pullup_resistor: 4700
smooth_time: 1.0

control: pid
pid_kp: 62.937
pid_ki: 1.165
pid_kd: 849.647

min_temp: 0
max_temp: 120
max_power: 1.00
pwm_cycle_time: 0.100

[verify_heater heater_bed]
max_error: 120
check_gain_time: 300
hysteresis: 5
heating_gain: 2