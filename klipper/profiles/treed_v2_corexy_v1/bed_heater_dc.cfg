# ==========================================
# КОНФИГ НАГРЕВА СТОЛА — TreeD V2 / Octopus Pro
# ==========================================
# Назначение:
# - Описывает нагреватель и термистор стола на Octopus Pro.
# Контур:
# - required: START_PRINT требует heater_bed в V2-профиле.
#
# Блок 1: Аппаратная схема и stock mapping.
# - BED IN / BED POWER: отдельный вход 24V питания стола
# - BED OUT: выход на нагревательный стол
# - TB / J44: вход термистора стола
#
# Octopus Pro stock mapping:
# - BED heater output: PA1
# - Bed thermistor input TB / J44: PF3
#
# Важно:
# - PA1 — штатный MOSFET выхода стола.
# - PF3 — штатный TB-вход термистора стола.
# - PA2 — HE0, хотенд 0.
# - PA3 — HE1, хотенд 1.
# - sensor_type зависит от установленного термистора.
#   Для обычного 100K B3950 используем Generic 3950.

# Блок 2: Нагреватель стола.
[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
pullup_resistor: 4700
smooth_time: 1.0

control: pid
pid_Kp: 62.937
pid_Ki: 1.165
pid_Kd: 849.647

min_temp: 0
max_temp: 120
max_power: 1.00
pwm_cycle_time: 0.100

[verify_heater heater_bed]
max_error: 120
check_gain_time: 300
hysteresis: 5
heating_gain: 2
