# ==========================================
# КОНФИГ ПРОБНИКА И Z-HOMING — EDDY DUO
# ==========================================
# Назначение:
# - Подключает BTT Eddy Duo как отдельный CAN MCU `eddy`.
# - Дает отдельный рабочий макрос поиска Z0 через Eddy после калибровки.
# - Обслуживает рабочий `G28 Z`, который маршрутизируется из `macros_homing.cfg`.
# - Определяет базовый контур probe/bed_mesh для обязательного Eddy-профиля.
# Контур:
# - required: Eddy является штатным Z-endstop и обязательной частью этого профиля.
# - runtime: force_move включен для коррекции Eddy Z-home через SET_KINEMATIC_POSITION.

# Блок 1: CAN-MCU датчика Eddy Duo.
[mcu eddy]
canbus_uuid: 95485b93332a
canbus_interface: can0

# Блок 2: Температуру MCU Eddy не публикуем в UI.
# Диагностический `[temperature_sensor]` намеренно не объявлен, чтобы не
# добавлять лишний Eddy-показатель в блок температур Mainsail/KlipperScreen.

# Блок 3: Runtime-доступ к SET_KINEMATIC_POSITION для Eddy.
# Нужен для официальной коррекции Eddy Z-home после G28 Z.
[force_move]
enable_force_move: True

# Блок 4: Контур зондирования Eddy.
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
# Эти смещения нужно откалибровать под фактический кронштейн датчика.
x_offset: 0.0
y_offset: -30.0

# Блок 5: Температура катушки Eddy для thermal drift compensation.
# Имя секции должно совпадать с `[probe_eddy_current btt_eddy]`.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
min_temp: 10
max_temp: 100
horizontal_move_z: 2

# Блок 6: Базовая секция bed_mesh.
# Эти значения нужны Klipper parser-у; штатный workflow всегда передает реальные
# MESH_MIN/MESH_MAX через `TREED_BED_MESH_CALIBRATE_EDDY`.
[bed_mesh]
horizontal_move_z: 2
speed: 120
mesh_min: 25,70
mesh_max: 220,205
probe_count: 7,7
algorithm: bicubic
# zero_reference_position не задаём статически.

# Блок 7: Wrapper штатной BED_MESH_CALIBRATE через Eddy-aware source-of-truth.
[gcode_macro BED_MESH_CALIBRATE]
description: "SYSTEM: Eddy-aware wrapper for BED_MESH_CALIBRATE"
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
  TREED_BED_MESH_CALIBRATE_EDDY {rawparams}

# Блок 8: Интерактивное выравнивание стола по 4 винтам через Eddy.
# ВАЖНО:
# - screwN задаётся в координатах сопла/головы.
# - В этих координатах Eddy/probe должен оказаться над точкой винта.
# - Точки являются независимой механической калибровкой винтов.
[screws_tilt_adjust]
screw1: 25.0, 100.0
screw1_name: P1 probe X25 Y70

screw2: 220.0, 100.0
screw2_name: P2 probe X220 Y70

screw3: 220.0, 235.0
screw3_name: P3 probe X220 Y205

screw4: 25.0, 235.0
screw4_name: P4 probe X25 Y205

horizontal_move_z: 2
speed: 120
screw_thread: CW-M4

# Блок 9: Настройки рабочего Eddy Z-home.
[gcode_macro _TREED_EDDY_Z0_CFG]
description: "TreeD: настройки рабочего Eddy Z-home"
variable_z_hop: 10.0
variable_home_samples: 3
variable_home_samples_result: "median"
variable_home_samples_tolerance: 0.050
variable_home_samples_tolerance_retries: 2
variable_home_sample_retract_dist: 0.5
variable_home_probe_clearance: 5.0
variable_home_lift_speed: 10.0
gcode:

# Блок 10: Рабочий Z-home через обязательный Eddy.
[gcode_macro _TREED_EDDY_HOME_Z]
description: "SYSTEM: штатный Z-home через Eddy с точной PROBE-коррекцией"
gcode:
  {% set cfg = printer["gcode_macro _TREED_EDDY_Z0_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set was_print_offset = printer["gcode_macro _TREED_PRINT_AREA_CFG"].print_offset_enabled|int %}
  {% set z_hop = cfg.z_hop|float %}

  # X/Y должны быть известны, потому что Eddy надо поставить в центр стола.
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}

  G90

  # Если Z уже известен — поднимаемся перед XY-переездом.
  {% if "z" in printer.toolhead.homed_axes %}
    {% if printer.toolhead.position.z|float < z_hop %}
      G1 Z{z_hop} F1500
    {% endif %}
  {% endif %}

  {% set th = printer.toolhead %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}

  {% set x_min = th.axis_minimum.x|float %}
  {% set y_min = th.axis_minimum.y|float %}
  {% set x_max = th.axis_maximum.x|float %}
  {% set y_max = th.axis_maximum.y|float %}

  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}

  # Центр фактической пластины в координатах Eddy/probe.
  {% set zero_probe_x = geo.bed_origin_x|float + (geo.bed_size_x|float * geo.bed_dir_x|float / 2.0) %}
  {% set zero_probe_y = geo.bed_origin_y|float + (geo.bed_size_y|float * geo.bed_dir_y|float / 2.0) %}
  
  # Но двигать надо сопло/ПГ, поэтому компенсируем offset датчика.
  {% set zero_tool_x = zero_probe_x - probe_x_offset %}
  {% set zero_tool_y = zero_probe_y - probe_y_offset %}

  # Защита: центр Eddy не должен требовать выхода сопла/ПГ за механику.
  {% if zero_tool_x < x_min or zero_tool_x > x_max %}
    {action_raise_error("TREED_EDDY_HOME_Z: центр Eddy по X требует выхода сопла за пределы механики")}
  {% endif %}
  {% if zero_tool_y < y_min or zero_tool_y > y_max %}
    {action_raise_error("TREED_EDDY_HOME_Z: центр Eddy по Y требует выхода сопла за пределы механики")}
  {% endif %}

  RESPOND PREFIX="treed" MSG="Eddy Z0: probe=({zero_probe_x},{zero_probe_y}) tool=({zero_tool_x},{zero_tool_y}) offset=({probe_x_offset},{probe_y_offset})"

  {% if was_print_offset == 1 %}
    _TREED_PRINT_OFFSET_DISABLE
  {% endif %}
  SET_GCODE_OFFSET Z=0 MOVE=0
  G1 X{zero_tool_x} Y{zero_tool_y} F12000

  G28.1 Z
  SET_Z_FROM_PROBE
  {% if was_print_offset == 1 %}
    _TREED_PRINT_OFFSET_ENABLE
  {% endif %}

[gcode_macro TREED_Z_PARK_ZERO_EDDY]
description: "TreeD: поиск рабочего Z0 через Eddy"
gcode:
  _TREED_EDDY_HOME_Z

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
description: "SYSTEM: пересчитать кинематическую Z-позицию по последнему Eddy PROBE"
gcode:
  {% set z = printer.toolhead.position.z %}
  SET_KINEMATIC_POSITION Z={z - printer.probe.last_probe_position.z}
  RESPOND PREFIX="treed" MSG="Eddy Z position corrected via PROBE dz={printer.probe.last_probe_position.z}"

[gcode_macro SET_Z_FROM_PROBE]
description: "SYSTEM: уточнить Eddy Z-home через точный PROBE"
gcode:
  {% set cfg = printer["gcode_macro _TREED_EDDY_Z0_CFG"] %}
  {% set clearance_z = cfg.home_probe_clearance|float %}
  {% if printer.toolhead.position.z|float < clearance_z %}
    # После coarse G28.1 Z Eddy может оставаться triggered; перед PROBE нужен отход.
    G90
    G1 Z{clearance_z} F1500
    M400
  {% endif %}
  PROBE SAMPLES={cfg.home_samples|int} SAMPLES_RESULT={cfg.home_samples_result|string} SAMPLES_TOLERANCE={cfg.home_samples_tolerance|float} SAMPLES_TOLERANCE_RETRIES={cfg.home_samples_tolerance_retries|int} SAMPLE_RETRACT_DIST={cfg.home_sample_retract_dist|float} LIFT_SPEED={cfg.home_lift_speed|float}
  _RELOAD_Z_OFFSET_FROM_PROBE
  G90
  G1 Z{cfg.z_hop|float} F1500

# Блок 11: Динамическая карта стола Eddy.
[gcode_macro _TREED_EDDY_MESH_CFG]
description: "TreeD: параметры динамической карты стола Eddy"
variable_toolhead_width_x: 45.0
variable_toolhead_margin_x: 2.5
variable_toolhead_margin_y_front: 10.0
variable_toolhead_margin_y_back: 10.0
variable_bed_margin: 5.0
variable_probe_count_x: 7
variable_probe_count_y: 7
variable_horizontal_move_z: 2.0
variable_speed: 120

# Качество измерения точки.
# Работает для METHOD=automatic.
variable_samples: 3
variable_samples_result: "median"
variable_samples_tolerance: 0.050
variable_samples_tolerance_retries: 2
variable_sample_retract_dist: 0.5
variable_lift_speed: 10.0
gcode:

# Блок 12: Bed mesh через Eddy.
[gcode_macro TREED_BED_MESH_CALIBRATE_EDDY]
description: "TreeD: bed mesh через Eddy с учётом offset датчика и ширины ПГ"
gcode:
  {% set cfg = printer["gcode_macro _TREED_EDDY_MESH_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set was_print_offset = printer["gcode_macro _TREED_PRINT_AREA_CFG"].print_offset_enabled|int %}
  {% set th = printer.toolhead %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}

  {% set x_min = th.axis_minimum.x|float %}
  {% set y_min = th.axis_minimum.y|float %}
  {% set x_max = th.axis_maximum.x|float %}
  {% set y_max = th.axis_maximum.y|float %}

  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}

  {% set half_head_x = cfg.toolhead_width_x|float / 2.0 %}
  {% set bed_margin = cfg.bed_margin|float %}

  # Границы пластины в координатах Eddy/probe.
  {% set bed_x_a = geo.bed_origin_x|float %}
  {% set bed_x_b = geo.bed_origin_x|float + geo.bed_size_x|float * geo.bed_dir_x|float %}
  {% set bed_y_a = geo.bed_origin_y|float %}
  {% set bed_y_b = geo.bed_origin_y|float + geo.bed_size_y|float * geo.bed_dir_y|float %}

  {% set bed_x_min = [bed_x_a, bed_x_b]|min %}
  {% set bed_x_max = [bed_x_a, bed_x_b]|max %}
  {% set bed_y_min = [bed_y_a, bed_y_b]|min %}
  {% set bed_y_max = [bed_y_a, bed_y_b]|max %}

  # 1) Фактическая область пластины в координатах Eddy/probe.
  {% set probe_x_min_bed = bed_x_min + bed_margin %}
  {% set probe_x_max_bed = bed_x_max - bed_margin %}
  {% set probe_y_min_bed = bed_y_min + bed_margin %}
  {% set probe_y_max_bed = bed_y_max - bed_margin %}

  # 2) Безопасная область движения сопла/ПГ с учетом габарита головы.
  {% set tool_x_min_head = x_min + half_head_x + cfg.toolhead_margin_x|float %}
  {% set tool_x_max_head = x_max - half_head_x - cfg.toolhead_margin_x|float %}
  {% set tool_y_min_head = y_min + cfg.toolhead_margin_y_front|float %}
  {% set tool_y_max_head = y_max - cfg.toolhead_margin_y_back|float %}

  # 3) Переводим безопасную область сопла/ПГ в координаты Eddy/probe.
  # probe = tool + offset.
  {% set probe_x_min_head = tool_x_min_head + probe_x_offset %}
  {% set probe_x_max_head = tool_x_max_head + probe_x_offset %}
  {% set probe_y_min_head = tool_y_min_head + probe_y_offset %}
  {% set probe_y_max_head = tool_y_max_head + probe_y_offset %}

  # 4) Итоговая mesh-область в координатах Eddy/probe:
  # Eddy остается над пластиной, а сопло/ПГ не выходит за безопасную механику.
  {% set mesh_min_x = [probe_x_min_bed, probe_x_min_head]|max %}
  {% set mesh_max_x = [probe_x_max_bed, probe_x_max_head]|min %}
  {% set mesh_min_y = [probe_y_min_bed, probe_y_min_head]|max %}
  {% set mesh_max_y = [probe_y_max_bed, probe_y_max_head]|min %}

  {% if mesh_min_x >= mesh_max_x %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: некорректная X-область mesh после учета пластины, ПГ и Eddy offset")}
  {% endif %}
  {% if mesh_min_y >= mesh_max_y %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: некорректная Y-область mesh после учета пластины, ПГ и Eddy offset")}
  {% endif %}

  {% set profile = params.PROFILE|default("eddy_test") %}
  {% set method = params.METHOD|default("automatic")|lower %}
  {% set adaptive = params.ADAPTIVE|default(0)|int %}
  {% set adaptive_margin = params.ADAPTIVE_MARGIN|default(0)|float %}
  {% set probe_count = params.PROBE_COUNT|default(cfg.probe_count_x|int ~ "," ~ cfg.probe_count_y|int) %}
  {% set horizontal_move_z = params.HORIZONTAL_MOVE_Z|default(cfg.horizontal_move_z|float) %}
  {% set homed = printer.toolhead.homed_axes|lower %}

  {% set samples = params.SAMPLES|default(cfg.samples|int) %}
  {% set samples_result = params.SAMPLES_RESULT|default(cfg.samples_result|string) %}
  {% set samples_tolerance = params.SAMPLES_TOLERANCE|default(cfg.samples_tolerance|float) %}
  {% set samples_tolerance_retries = params.SAMPLES_TOLERANCE_RETRIES|default(cfg.samples_tolerance_retries|int) %}
  {% set sample_retract_dist = params.SAMPLE_RETRACT_DIST|default(cfg.sample_retract_dist|float) %}
  {% set lift_speed = params.LIFT_SPEED|default(cfg.lift_speed|float) %}

  {% if adaptive_margin < 0.0 %}{% set adaptive_margin = 0.0 %}{% endif %}

  RESPOND PREFIX="treed" MSG="Eddy mesh: method={method} adaptive={adaptive} margin={adaptive_margin} probe_mesh=({mesh_min_x},{mesh_min_y})..({mesh_max_x},{mesh_max_y}) probe_bed=({probe_x_min_bed},{probe_y_min_bed})..({probe_x_max_bed},{probe_y_max_bed}) probe_head=({probe_x_min_head},{probe_y_min_head})..({probe_x_max_head},{probe_y_max_head}) tool_head=({tool_x_min_head},{tool_y_min_head})..({tool_x_max_head},{tool_y_max_head}) offset=({probe_x_offset},{probe_y_offset}) head_width_x={cfg.toolhead_width_x|float}"

  {% if was_print_offset == 1 %}
    _TREED_PRINT_OFFSET_DISABLE
  {% endif %}
  BED_MESH_CLEAR
  # Повторный full G28 после START_PRINT дает лишнюю парковку и может
  # ломать последующий SMART_PARK. Доhomиваем только реально неизвестные оси.
  {% if 'x' not in homed or 'y' not in homed %}
    G28
  {% elif 'z' not in homed %}
    G28 Z
  {% endif %}

  {% if method in ["scan", "rapid_scan", "manual"] %}
    BED_MESH_CALIBRATE_BASE PROFILE={profile} METHOD={method} MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} PROBE_COUNT={probe_count} HORIZONTAL_MOVE_Z={horizontal_move_z} ADAPTIVE={adaptive} ADAPTIVE_MARGIN={adaptive_margin}
  {% else %}
    BED_MESH_CALIBRATE_BASE PROFILE={profile} METHOD={method} MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} PROBE_COUNT={probe_count} HORIZONTAL_MOVE_Z={horizontal_move_z} ADAPTIVE={adaptive} ADAPTIVE_MARGIN={adaptive_margin} SAMPLES={samples} SAMPLES_RESULT={samples_result} SAMPLES_TOLERANCE={samples_tolerance} SAMPLES_TOLERANCE_RETRIES={samples_tolerance_retries} SAMPLE_RETRACT_DIST={sample_retract_dist} LIFT_SPEED={lift_speed}
  {% endif %}
  {% if was_print_offset == 1 %}
    _TREED_PRINT_OFFSET_ENABLE
  {% endif %}

# Блок 13: Ускоренная первичная калибровка Eddy без рабочего Z-home.
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
description: "TreeD: первичная калибровка Eddy с runtime force_move"
gcode:
  {% set th = printer.toolhead %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}
  {% set force_move_enabled = 0 %}
  {% if printer.configfile.settings.force_move is defined %}
    {% set force_move_enabled = printer.configfile.settings.force_move.enable_force_move|default(False)|int %}
  {% endif %}

  {% if force_move_enabled != 1 %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: профиль должен включать [force_move] enable_force_move: True")}
  {% endif %}

  {% set x_min = th.axis_minimum.x|float %}
  {% set y_min = th.axis_minimum.y|float %}
  {% set x_max = th.axis_maximum.x|float %}
  {% set y_max = th.axis_maximum.y|float %}

  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}

  # Центр фактической пластины в координатах Eddy/probe.
  {% set center_probe_x = geo.bed_origin_x|float + (geo.bed_size_x|float * geo.bed_dir_x|float / 2.0) %}
  {% set center_probe_y = geo.bed_origin_y|float + (geo.bed_size_y|float * geo.bed_dir_y|float / 2.0) %}

  {% set center_tool_x = center_probe_x - probe_x_offset %}
  {% set center_tool_y = center_probe_y - probe_y_offset %}

  {% if center_tool_x < x_min or center_tool_x > x_max %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: центр Eddy по X требует выхода сопла за пределы механики")}
  {% endif %}
  {% if center_tool_y < y_min or center_tool_y > y_max %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: центр Eddy по Y требует выхода сопла за пределы механики")}
  {% endif %}

  BED_MESH_CLEAR
  G28 X Y
  G90

  RESPOND PREFIX="treed" MSG="Eddy calibrate: probe_center=({center_probe_x},{center_probe_y}) tool=({center_tool_x},{center_tool_y}) offset=({probe_x_offset},{probe_y_offset})"

  G1 X{center_tool_x} Y{center_tool_y} F6000

  SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z - 1 }

  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}

# Блок 14: Выравнивание 4 винтов через Eddy.
[gcode_macro TREED_SCREWS_TILT_CALIBRATE]
description: "TreeD: выравнивание 4 винтов стола через Eddy"
gcode:
  BED_MESH_CLEAR
  G28
  G4 P1000
  SCREWS_TILT_CALCULATE

# ==========================================
# EDDY AUTO Z-OFFSET AUTOSAVE
# ==========================================
# Назначение:
# - Во время PRINT_END запоминает live Z-offset / babystep.
# - После завершения end-процедуры применяет его к Eddy probe calibration.
# - Делает SAVE_CONFIG, чтобы поправка пережила следующий запуск.
#
# Важно:
# - calibrate/reg_drive_current не должны быть заданы в include-файлах.
# - Они должны жить в printer.cfg внутри #*# SAVE_CONFIG блока.

[gcode_macro _TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE]
variable_enabled: 0
variable_pending_z: 0.0
variable_has_pending: 0
variable_threshold: 0.005
gcode:
  G4 P0


[gcode_macro TREED_EDDY_Z_OFFSET_AUTOSAVE_ENABLE]
description: "SERVICE: enable Eddy Z-offset autosave"
gcode:
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=enabled VALUE=1
  RESPOND PREFIX="treed" MSG="Eddy autosave: enabled"


[gcode_macro TREED_EDDY_Z_OFFSET_AUTOSAVE_DISABLE]
description: "SERVICE: disable Eddy Z-offset autosave"
gcode:
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=enabled VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE=0.0
  RESPOND PREFIX="treed" MSG="Eddy autosave: disabled"


[gcode_macro TREED_EDDY_Z_OFFSET_AUTOSAVE_STATUS]
description: "SERVICE: show Eddy Z-offset autosave state"
gcode:
  {% set st = printer["gcode_macro _TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE"] %}
  {% set enabled = st.enabled|int %}
  {% set has_pending = st.has_pending|int %}
  {% set pending_z_text = "%.3f"|format(st.pending_z|float) %}
  RESPOND PREFIX="treed" MSG="Eddy autosave: enabled={enabled}, pending_z={pending_z_text}, has_pending={has_pending}"


[gcode_macro _TREED_EDDY_CAPTURE_LIVE_Z_OFFSET]
description: "SYSTEM: capture current live Z-offset before PRINT_END resets it"
gcode:
  {% set save = params.SAVE|default(1)|int %}
  {% set z = printer.gcode_move.homing_origin.z|float %}
  {% set st = printer["gcode_macro _TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE"] %}
  {% set threshold = st.threshold|float %}
  {% set z_text = "%.3f"|format(z) %}

  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE={z}

  {% if save == 0 %}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
    RESPOND PREFIX="treed" MSG="Eddy autosave: disabled for this PRINT_END"
  {% elif z > threshold or z < -threshold %}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=1
    RESPOND PREFIX="treed" MSG="Eddy autosave: captured live Z={z_text}"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
    RESPOND PREFIX="treed" MSG="Eddy autosave: live Z is zero, nothing to save"
  {% endif %}


[gcode_macro _TREED_EDDY_APPLY_CAPTURED_Z_OFFSET]
description: "SYSTEM: apply captured live Z-offset to Eddy and SAVE_CONFIG"
gcode:
  {% set st = printer["gcode_macro _TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE"] %}
  {% set enabled = st.enabled|int %}
  {% set has_pending = st.has_pending|int %}
  {% set z = st.pending_z|float %}
  {% set threshold = st.threshold|float %}
  {% set z_text = "%.3f"|format(z) %}

  {% if enabled == 0 %}
    RESPOND PREFIX="treed" MSG="Eddy autosave: globally disabled"
  {% elif has_pending == 0 %}
    RESPOND PREFIX="treed" MSG="Eddy autosave: no pending Z-offset"
  {% elif z > -threshold and z < threshold %}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE=0.0
    RESPOND PREFIX="treed" MSG="Eddy autosave: pending Z is too small, skipped"
  {% else %}
    RESPOND PREFIX="treed" MSG="Eddy autosave: applying Z={z_text} to Eddy probe and saving config"

    SET_GCODE_OFFSET Z={z} MOVE=0
    Z_OFFSET_APPLY_PROBE
    SET_GCODE_OFFSET Z=0 MOVE=0

    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE=0.0

    SAVE_CONFIG
  {% endif %}


[delayed_gcode _TREED_EDDY_APPLY_CAPTURED_Z_OFFSET_DELAYED]
gcode:
  _TREED_EDDY_APPLY_CAPTURED_Z_OFFSET
