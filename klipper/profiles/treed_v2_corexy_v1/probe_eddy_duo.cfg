# ==========================================
# КОНФИГ ПРОБНИКА И Z-HOMING — EDDY DUO
# ==========================================
# Назначение:
# - Подключает BTT Eddy Duo как отдельный CAN MCU `eddy`.
# - Дает отдельный рабочий макрос поиска Z0 через Eddy после калибровки.
# - Обслуживает рабочий `G28 Z`, который маршрутизируется из `macros_homing.cfg`.
# - Определяет базовый контур probe/bed_mesh для обязательного Eddy-профиля.
# Контур:
# - required: Eddy является штатным Z-endstop и обязательной частью этого профиля.
# - runtime: force_move включен для коррекции Eddy Z-home через SET_KINEMATIC_POSITION.

# Блок 1: CAN-MCU датчика Eddy Duo.
[mcu eddy]
canbus_uuid: 95485b93332a
canbus_interface: can0

# Блок 2: Температуру MCU Eddy не публикуем в UI.
# Диагностический `[temperature_sensor]` намеренно не объявлен, чтобы не
# добавлять лишний Eddy-показатель в блок температур Mainsail/KlipperScreen.

# Блок 3: Runtime-доступ к SET_KINEMATIC_POSITION для Eddy.
# Нужен для официальной коррекции Eddy Z-home после G28 Z.
[force_move]
enable_force_move: True

# Блок 4: Persistent state для UI workflow калибровки Eddy.
[save_variables]
filename: ~/printer_data/config/treed_variables.cfg

# Блок 5: Контур зондирования Eddy.
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
# Эти смещения нужно откалибровать под фактический кронштейн датчика.
x_offset: 0.0
y_offset: -30.0

# Блок 6: Температура катушки Eddy для thermal drift compensation.
# Имя секции должно совпадать с `[probe_eddy_current btt_eddy]`.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
min_temp: 10
max_temp: 100
horizontal_move_z: 2
calibration_position: 125, 128.5, 1
calibration_extruder_temp: 160
extruder_heating_z: 50
calibration_bed_temp: 60

# Блок 7: Базовая секция bed_mesh.
# Это fallback/parser default. Штатный workflow берет ту же Eddy scan area из
# `_TREED_EDDY_MESH_CFG` и передает ее в `BED_MESH_CALIBRATE_BASE`.
[bed_mesh]
horizontal_move_z: 2
speed: 120
mesh_min: 25,25
mesh_max: 225,222
probe_count: 7,7
algorithm: bicubic
zero_reference_position: 125,128.5

# Блок 8: Wrapper штатной BED_MESH_CALIBRATE через Eddy-aware source-of-truth.
[gcode_macro BED_MESH_CALIBRATE]
description: "SYSTEM: Eddy-aware wrapper for BED_MESH_CALIBRATE"
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
  TREED_BED_MESH_CALIBRATE_EDDY {rawparams}

# Блок 9: Интерактивное выравнивание стола по 4 винтам через Eddy.
# ВАЖНО:
# - screwN задаётся в координатах сопла/головы.
# - В этих координатах Eddy/probe должен оказаться над точкой винта.
# - Точки являются независимой механической калибровкой винтов.
[screws_tilt_adjust]
screw1: 25.0, 100.0
screw1_name: P1 probe X25 Y70

screw2: 220.0, 100.0
screw2_name: P2 probe X220 Y70

screw3: 220.0, 235.0
screw3_name: P3 probe X220 Y205

screw4: 25.0, 235.0
screw4_name: P4 probe X25 Y205

horizontal_move_z: 2
speed: 120
screw_thread: CW-M4

# Блок 9: Настройки рабочего Eddy Z-home.
[gcode_macro _TREED_EDDY_Z0_CFG]
description: "TreeD: настройки рабочего Eddy Z-home"
variable_z_hop: 10.0
variable_home_samples: 3
variable_home_samples_result: "median"
variable_home_samples_tolerance: 0.050
variable_home_samples_tolerance_retries: 2
variable_home_sample_retract_dist: 0.5
variable_home_probe_speed: 2.0
variable_home_probe_clearance: 2.0
variable_home_lift_speed: 5.0
gcode:

# Блок 10: Рабочий Z-home через обязательный Eddy.
[gcode_macro _TREED_EDDY_HOME_Z]
description: "SYSTEM: штатный Z-home через Eddy с точной PROBE-коррекцией"
gcode:
  {% set vars = printer.save_variables.variables %}
  {% if vars.treed_eddy_offsets_changed|default(0)|int == 1 %}
    {action_raise_error("TREED_EDDY_HOME_Z: после изменения Eddy offset требуется первичная калибровка высоты")}
  {% endif %}
  {% set th = printer.toolhead %}
  {% set bed_mesh_cfg = printer.configfile.settings["bed_mesh"] %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}
  {% set zero_ref = bed_mesh_cfg.zero_reference_position|default(none) %}
  {% set x_min = th.axis_minimum.x|float %}
  {% set y_min = th.axis_minimum.y|float %}
  {% set x_max = th.axis_maximum.x|float %}
  {% set y_max = th.axis_maximum.y|float %}
  {% if zero_ref is none %}
    {% set zero_probe_x = (x_min + x_max) / 2.0 %}
    {% set zero_probe_y = (y_min + y_max) / 2.0 %}
  {% else %}
    {% if zero_ref|length != 2 %}
      {action_raise_error("TREED_EDDY_HOME_Z: bed_mesh.zero_reference_position должен содержать две координаты")}
    {% endif %}
    {% set zero_probe_x = zero_ref[0]|float(none) %}
    {% set zero_probe_y = zero_ref[1]|float(none) %}
    {% if zero_probe_x is none or zero_probe_y is none or zero_probe_x != zero_probe_x or zero_probe_y != zero_probe_y %}
      {action_raise_error("TREED_EDDY_HOME_Z: неверный bed_mesh.zero_reference_position")}
    {% endif %}
    {% set mesh_cfg = printer["gcode_macro _TREED_EDDY_MESH_CFG"] %}
    {% if zero_probe_x < mesh_cfg.scan_min_x|float or zero_probe_x > mesh_cfg.scan_max_x|float or zero_probe_y < mesh_cfg.scan_min_y|float or zero_probe_y > mesh_cfg.scan_max_y|float %}
      {action_raise_error("TREED_EDDY_HOME_Z: zero_reference_position выходит за безопасную Eddy scan area")}
    {% endif %}
  {% endif %}
  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}
  {% set zero_tool_x = zero_probe_x - probe_x_offset %}
  {% set zero_tool_y = zero_probe_y - probe_y_offset %}
  {% if zero_probe_x < x_min or zero_probe_x > x_max or zero_probe_y < y_min or zero_probe_y > y_max %}
    {action_raise_error("TREED_EDDY_HOME_Z: zero_reference_position вне пластины")}
  {% endif %}
  {% if zero_tool_x < x_min or zero_tool_x > x_max or zero_tool_y < y_min or zero_tool_y > y_max %}
    {action_raise_error("TREED_EDDY_HOME_Z: zero_reference_position требует выхода сопла за пределы механики")}
  {% endif %}
  {% set cfg = printer["gcode_macro _TREED_EDDY_Z0_CFG"] %}
  {% set was_print_offset = printer["gcode_macro _TREED_PRINT_AREA_CFG"].print_offset_enabled|int %}
  {% set z_hop = cfg.z_hop|float %}

  # X/Y должны быть известны, потому что Eddy надо поставить в точку общей Z-опоры.
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}

  # Прямой вызов при уже известных XY тоже восстанавливает неизвестную Z.
  {% if "z" not in printer.toolhead.homed_axes %}
    TREED_Z_HOME_BOTTOM
  {% endif %}

  G90

  # Если Z уже известен — поднимаемся перед XY-переездом.
  {% if "z" in printer.toolhead.homed_axes %}
    {% if printer.toolhead.position.z|float < z_hop %}
      G1 Z{z_hop} F1500
    {% endif %}
  {% endif %}

  RESPOND PREFIX="treed" MSG="Eddy Z0: probe=({zero_probe_x},{zero_probe_y}) tool=({zero_tool_x},{zero_tool_y}) offset=({probe_x_offset},{probe_y_offset})"

  {% if was_print_offset == 1 %}
    _TREED_PRINT_OFFSET_DISABLE
  {% endif %}
  SET_GCODE_OFFSET Z=0 MOVE=0
  G1 X{zero_tool_x} Y{zero_tool_y} F12000

  _TREED_EDDY_FAST_APPROACH
  _TREED_Z_TRAVEL_BEGIN
  _TREED_ACCEPTANCE_STAGE STAGE=eddy_coarse STATE=running
  G28.1 Z
  _TREED_ACCEPTANCE_STAGE STAGE=eddy_coarse STATE=passed
  SET_Z_FROM_PROBE
  {% if was_print_offset == 1 %}
    _TREED_PRINT_OFFSET_ENABLE
  {% endif %}

[gcode_macro TREED_Z_PARK_ZERO_EDDY]
description: "TreeD: поиск рабочего Z0 через Eddy"
gcode:
  _TREED_EDDY_HOME_Z

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
description: "SYSTEM: пересчитать кинематическую Z-позицию по последнему Eddy PROBE"
gcode:
  {% set z = printer.toolhead.position.z %}
  SET_KINEMATIC_POSITION Z={z - printer.probe.last_probe_position.z}
  RESPOND PREFIX="treed" MSG="Eddy Z position corrected via PROBE dz={printer.probe.last_probe_position.z}"

[gcode_macro SET_Z_FROM_PROBE]
description: "SYSTEM: уточнить Eddy Z-home через точный PROBE"
gcode:
  {% set cfg = printer["gcode_macro _TREED_EDDY_Z0_CFG"] %}
  {% set clearance_z = cfg.home_probe_clearance|float %}
  {% if printer.toolhead.position.z|float < clearance_z %}
    # После coarse G28.1 Z Eddy может оставаться triggered; перед PROBE нужен отход.
    G90
    G1 Z{clearance_z} F1500
    M400
  {% endif %}
  _TREED_ACCEPTANCE_STAGE STAGE=eddy_probe STATE=running
  PROBE PROBE_SPEED={cfg.home_probe_speed|float} SAMPLES={cfg.home_samples|int} SAMPLES_RESULT={cfg.home_samples_result|string} SAMPLES_TOLERANCE={cfg.home_samples_tolerance|float} SAMPLES_TOLERANCE_RETRIES={cfg.home_samples_tolerance_retries|int} SAMPLE_RETRACT_DIST={cfg.home_sample_retract_dist|float} LIFT_SPEED={cfg.home_lift_speed|float}
  _TREED_ACCEPTANCE_STAGE STAGE=eddy_probe STATE=passed
  _TREED_ACCEPTANCE_STAGE STAGE=final_z0 STATE=running
  _RELOAD_Z_OFFSET_FROM_PROBE
  _TREED_Z_TRAVEL_APPLY
  _TREED_ACCEPTANCE_STAGE STAGE=final_z0 STATE=passed
  G90
  G1 Z{cfg.z_hop|float} F1500

# Блок 11: Штатная сервисная область сканирования Eddy.
[gcode_macro _TREED_EDDY_MESH_CFG]
description: "TreeD: параметры безопасной Eddy scan mesh"
# Отступ 25 мм; сзади 35 мм из-за y_offset=-30 и запаса сопла 5 мм до упора.
variable_scan_min_x: 25.0
variable_scan_min_y: 25.0
variable_scan_max_x: 225.0
variable_scan_max_y: 222.0
variable_probe_count_x: 7
variable_probe_count_y: 7
variable_horizontal_move_z: 2.0

# Качество измерения точки.
# Работает для METHOD=automatic.
variable_samples: 3
variable_samples_result: "median"
variable_samples_tolerance: 0.050
variable_samples_tolerance_retries: 2
variable_sample_retract_dist: 0.5
variable_lift_speed: 10.0
gcode:

# Блок 12: Bed mesh через Eddy.
[gcode_macro TREED_BED_MESH_CALIBRATE_EDDY]
description: "TreeD: сервисный Eddy mesh в безопасной scan area"
gcode:
  {% if printer.treed_z_recovery.mesh_active and params.ACCEPTANCE|default(0)|int != 1 %}
    {action_raise_error("Acceptance: обычный mesh запрещён во время diagnostic scan")}
  {% endif %}
  {% set cfg = printer["gcode_macro _TREED_EDDY_MESH_CFG"] %}
  {% set th = printer.toolhead %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}
  {% set bed_mesh_cfg = printer.configfile.settings["bed_mesh"] %}

  {% set safe_min_x = cfg.scan_min_x|float %}
  {% set safe_min_y = cfg.scan_min_y|float %}
  {% set safe_max_x = cfg.scan_max_x|float %}
  {% set safe_max_y = cfg.scan_max_y|float %}
  {% set default_mesh_min = safe_min_x ~ "," ~ safe_min_y %}
  {% set default_mesh_max = safe_max_x ~ "," ~ safe_max_y %}
  {% set mesh_min_raw = params.MESH_MIN|default(default_mesh_min)|string|replace(" ", "") %}
  {% set mesh_max_raw = params.MESH_MAX|default(default_mesh_max)|string|replace(" ", "") %}
  {% set mesh_min_parts = mesh_min_raw.split(",") %}
  {% set mesh_max_parts = mesh_max_raw.split(",") %}

  {% if mesh_min_parts|length != 2 or mesh_max_parts|length != 2 %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: MESH_MIN и MESH_MAX должны содержать две координаты X,Y")}
  {% endif %}

  {% set scan_min_x = mesh_min_parts[0]|float(none) %}
  {% set scan_min_y = mesh_min_parts[1]|float(none) %}
  {% set scan_max_x = mesh_max_parts[0]|float(none) %}
  {% set scan_max_y = mesh_max_parts[1]|float(none) %}

  {% if scan_min_x is none or scan_min_y is none or scan_max_x is none or scan_max_y is none %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: MESH_MIN и MESH_MAX должны быть числовыми координатами X,Y")}
  {% endif %}
  {% if scan_min_x != scan_min_x or scan_min_y != scan_min_y or scan_max_x != scan_max_x or scan_max_y != scan_max_y %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: MESH_MIN и MESH_MAX не должны содержать NaN")}
  {% endif %}

  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}
  {% set zero_ref = bed_mesh_cfg.zero_reference_position|default(none) %}
  {% set method = params.METHOD|default("automatic")|lower %}
  {% set mesh_pps = bed_mesh_cfg.mesh_pps|default([2, 2]) %}
  {% if zero_ref is not none and mesh_pps|max == 0 and method != "manual" and params.ACCEPTANCE|default(0)|int != 1 %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: zero_reference_position несовместим с mesh_pps=0,0 из-за двойной нормализации direct mesh")}
  {% endif %}

  {% set print_min_x = th.axis_minimum.x|float %}
  {% set print_min_y = th.axis_minimum.y|float %}
  {% set print_max_x = th.axis_maximum.x|float %}
  {% set print_max_y = th.axis_maximum.y|float %}

  # Scan area задана в координатах Eddy/probe, а не как print area или лимит осей.
  {% set tool_scan_min_x = scan_min_x - probe_x_offset %}
  {% set tool_scan_max_x = scan_max_x - probe_x_offset %}
  {% set tool_scan_min_y = scan_min_y - probe_y_offset %}
  {% set tool_scan_max_y = scan_max_y - probe_y_offset %}

  {% if zero_ref is not none %}
    {% if zero_ref|length != 2 %}
      {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: bed_mesh.zero_reference_position должен содержать две координаты")}
    {% endif %}
    {% set zero_ref_x = zero_ref[0]|float(none) %}
    {% set zero_ref_y = zero_ref[1]|float(none) %}
    {% if zero_ref_x is none or zero_ref_y is none or zero_ref_x != zero_ref_x or zero_ref_y != zero_ref_y %}
      {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: неверный bed_mesh.zero_reference_position")}
    {% endif %}
    {% if zero_ref_x < safe_min_x or zero_ref_x > safe_max_x or zero_ref_y < safe_min_y or zero_ref_y > safe_max_y %}
      {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: zero_reference_position выходит за безопасную Eddy scan area")}
    {% endif %}
    {% if zero_ref_x < print_min_x or zero_ref_x > print_max_x or zero_ref_y < print_min_y or zero_ref_y > print_max_y %}
      {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: zero_reference_position вне пластины")}
    {% endif %}
    {% set zero_tool_x = zero_ref_x - probe_x_offset %}
    {% set zero_tool_y = zero_ref_y - probe_y_offset %}
    {% if zero_tool_x < print_min_x or zero_tool_x > print_max_x or zero_tool_y < print_min_y or zero_tool_y > print_max_y %}
      {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: zero_reference_position требует выхода сопла за пределы механики")}
    {% endif %}
  {% endif %}

  {% if scan_min_x >= scan_max_x or scan_min_y >= scan_max_y %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: MESH_MIN должен быть меньше MESH_MAX")}
  {% endif %}
  {% if scan_min_x < safe_min_x or scan_max_x > safe_max_x or scan_min_y < safe_min_y or scan_max_y > safe_max_y %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: запрошенная область выходит за безопасную Eddy scan area")}
  {% endif %}
  {% if tool_scan_min_x < th.axis_minimum.x|float or tool_scan_max_x > th.axis_maximum.x|float %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: запрошенная область по X требует выхода сопла за пределы механики")}
  {% endif %}
  {% if tool_scan_min_y < th.axis_minimum.y|float or tool_scan_max_y > th.axis_maximum.y|float %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: запрошенная область по Y требует выхода сопла за пределы механики")}
  {% endif %}

  {% set profile = params.PROFILE|default("eddy_test") %}
  {% set adaptive = params.ADAPTIVE|default(0)|int %}
  {% set adaptive_margin = params.ADAPTIVE_MARGIN|default(0)|float %}
  {% set probe_count = params.PROBE_COUNT|default(cfg.probe_count_x|int ~ "," ~ cfg.probe_count_y|int) %}
  {% set horizontal_move_z = params.HORIZONTAL_MOVE_Z|default(cfg.horizontal_move_z|float) %}
  {% set homed = printer.toolhead.homed_axes|lower %}

  {% set samples = params.SAMPLES|default(cfg.samples|int) %}
  {% set samples_result = params.SAMPLES_RESULT|default(cfg.samples_result|string) %}
  {% set samples_tolerance = params.SAMPLES_TOLERANCE|default(cfg.samples_tolerance|float) %}
  {% set samples_tolerance_retries = params.SAMPLES_TOLERANCE_RETRIES|default(cfg.samples_tolerance_retries|int) %}
  {% set sample_retract_dist = params.SAMPLE_RETRACT_DIST|default(cfg.sample_retract_dist|float) %}
  {% set lift_speed = params.LIFT_SPEED|default(cfg.lift_speed|float) %}
  {% set xy_speed = bed_mesh_cfg.speed|float %}
  {% set effective_speed = xy_speed %}
  {% set speed_source = "bed_mesh.speed" %}

  {% if adaptive_margin < 0.0 %}{% set adaptive_margin = 0.0 %}{% endif %}
  {% if params.SPEED is defined %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: SPEED не поддерживается; для rapid_scan используйте SCAN_SPEED")}
  {% endif %}
  {% if method == "rapid_scan" %}
    {% set effective_speed = params.SCAN_SPEED|default(xy_speed)|float(none) %}
    {% set speed_source = "SCAN_SPEED" %}
    {% if effective_speed is none or effective_speed != effective_speed or effective_speed <= 0 %}
      {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: SCAN_SPEED должен быть положительным числом")}
    {% endif %}
  {% elif params.SCAN_SPEED is defined %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: SCAN_SPEED поддерживается только для METHOD=rapid_scan")}
  {% endif %}

  RESPOND PREFIX="treed" MSG="Eddy mesh: profile={profile} method={method} probe=({scan_min_x},{scan_min_y})..({scan_max_x},{scan_max_y}) tool=({tool_scan_min_x},{tool_scan_min_y})..({tool_scan_max_x},{tool_scan_max_y}) count={probe_count} xy_speed={effective_speed}({speed_source}) horizontal_move_z={horizontal_move_z} adaptive={adaptive} margin={adaptive_margin}"
  RESPOND PREFIX="treed" MSG="Eddy safe scan area: X{safe_min_x}..{safe_max_x} Y{safe_min_y}..{safe_max_y}"
  RESPOND PREFIX="treed" MSG="Print area: X{print_min_x}..{print_max_x} Y{print_min_y}..{print_max_y}"
  RESPOND PREFIX="treed" MSG="Eddy scan area is smaller than print area because probe cannot physically cover full bed."

  _TREED_PRINT_OFFSET_DISABLE
  _TREED_UI_RESET_Z_OFFSET
  BED_MESH_CLEAR
  # Повторный full G28 после START_PRINT дает лишнюю парковку и может
  # ломать последующий SMART_PARK. Доhomиваем только реально неизвестные оси.
  {% if 'x' not in homed or 'y' not in homed %}
    G28
  {% elif 'z' not in homed %}
    G28 Z
  {% endif %}

  {% if params.ACCEPTANCE|default(0)|int == 1 %}
    {% if method != "scan" or adaptive != 0 %}
      {action_raise_error("Acceptance: требуется одинаковый METHOD=scan ADAPTIVE=0")}
    {% endif %}
    _TREED_ACCEPTANCE_MESH_RUN PROFILE={profile} METHOD=scan MESH_MIN={scan_min_x},{scan_min_y} MESH_MAX={scan_max_x},{scan_max_y} PROBE_COUNT={probe_count} HORIZONTAL_MOVE_Z={horizontal_move_z} ADAPTIVE=0
  {% elif method == "rapid_scan" %}
    BED_MESH_CALIBRATE_BASE PROFILE={profile} METHOD={method} MESH_MIN={scan_min_x},{scan_min_y} MESH_MAX={scan_max_x},{scan_max_y} PROBE_COUNT={probe_count} HORIZONTAL_MOVE_Z={horizontal_move_z} ADAPTIVE={adaptive} ADAPTIVE_MARGIN={adaptive_margin} SCAN_SPEED={effective_speed}
  {% elif method in ["scan", "manual"] %}
    BED_MESH_CALIBRATE_BASE PROFILE={profile} METHOD={method} MESH_MIN={scan_min_x},{scan_min_y} MESH_MAX={scan_max_x},{scan_max_y} PROBE_COUNT={probe_count} HORIZONTAL_MOVE_Z={horizontal_move_z} ADAPTIVE={adaptive} ADAPTIVE_MARGIN={adaptive_margin}
  {% else %}
    BED_MESH_CALIBRATE_BASE PROFILE={profile} METHOD={method} MESH_MIN={scan_min_x},{scan_min_y} MESH_MAX={scan_max_x},{scan_max_y} PROBE_COUNT={probe_count} HORIZONTAL_MOVE_Z={horizontal_move_z} ADAPTIVE={adaptive} ADAPTIVE_MARGIN={adaptive_margin} SAMPLES={samples} SAMPLES_RESULT={samples_result} SAMPLES_TOLERANCE={samples_tolerance} SAMPLES_TOLERANCE_RETRIES={samples_tolerance_retries} SAMPLE_RETRACT_DIST={sample_retract_dist} LIFT_SPEED={lift_speed}
  {% endif %}

# Блок 13: Ускоренная первичная калибровка Eddy без рабочего Z-home.
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
description: "TreeD: первичная калибровка Eddy с runtime force_move"
gcode:
  {% set th = printer.toolhead %}
  {% set mesh_cfg = printer["gcode_macro _TREED_EDDY_MESH_CFG"] %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}
  {% set force_move_enabled = 0 %}
  {% if printer.configfile.settings.force_move is defined %}
    {% set force_move_enabled = printer.configfile.settings.force_move.enable_force_move|default(False)|int %}
  {% endif %}

  {% if force_move_enabled != 1 %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: профиль должен включать [force_move] enable_force_move: True")}
  {% endif %}

  {% set x_min = th.axis_minimum.x|float %}
  {% set y_min = th.axis_minimum.y|float %}
  {% set x_max = th.axis_maximum.x|float %}
  {% set y_max = th.axis_maximum.y|float %}

  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}

  {% set homed = th.homed_axes|lower %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = printer.pause_resume.is_paused|default(0)|int if printer.pause_resume is defined else 0 %}
  {% if "z" not in homed %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: сначала требуется достоверная Z-позиция")}
  {% endif %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: запрещено во время печати или паузы")}
  {% endif %}
  {% if th.axis_maximum.z|float < 20 %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: предел Z ниже безопасной высоты 20 мм")}
  {% endif %}

  # Центр безопасной Eddy scan area в координатах датчика.
  {% set center_probe_x = (mesh_cfg.scan_min_x|float + mesh_cfg.scan_max_x|float) / 2.0 %}
  {% set center_probe_y = (mesh_cfg.scan_min_y|float + mesh_cfg.scan_max_y|float) / 2.0 %}

  {% set center_tool_x = center_probe_x - probe_x_offset %}
  {% set center_tool_y = center_probe_y - probe_y_offset %}

  {% if center_tool_x < x_min or center_tool_x > x_max %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: центр Eddy по X требует выхода сопла за пределы механики")}
  {% endif %}
  {% if center_tool_y < y_min or center_tool_y > y_max %}
    {action_raise_error("PROBE_EDDY_CURRENT_CALIBRATE_AUTO: центр Eddy по Y требует выхода сопла за пределы механики")}
  {% endif %}

  G90
  G1 Z20 F1500
  BED_MESH_CLEAR
  G28 X Y
  G90

  RESPOND PREFIX="treed" MSG="Eddy calibrate: scan_center=({center_probe_x},{center_probe_y}) tool=({center_tool_x},{center_tool_y}) offset=({probe_x_offset},{probe_y_offset})"

  G1 X{center_tool_x} Y{center_tool_y} F6000

  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}

# Блок 14: Выравнивание 4 винтов через Eddy.
[gcode_macro TREED_SCREWS_TILT_CALIBRATE]
description: "TreeD: выравнивание 4 винтов стола через Eddy"
gcode:
  BED_MESH_CLEAR
  G28
  G4 P1000
  SCREWS_TILT_CALCULATE

# Блок 15: State-only surface и public workflow для UI-калибровки Eddy.
[gcode_macro _TREED_EDDY_CALIBRATION_STATE]
description: "TreeD UI: persisted Eddy calibration workflow state"
variable_schema_version: 1
gcode:
  {% set vars = printer.save_variables.variables %}
  {% set active_step = vars.treed_eddy_active_step|default("not_started") %}
  {% set prompt = vars.treed_eddy_operator_prompt|default("none") %}
  {% set primary_done = vars.treed_eddy_primary_done|default(0)|int %}
  {% set temperature_done = vars.treed_eddy_temperature_done|default(0)|int %}
  {% set z0_done = vars.treed_eddy_z0_done|default(0)|int %}
  {% set screws_done = vars.treed_eddy_screws_done|default(0)|int %}
  {% set mesh_done = vars.treed_eddy_mesh_done|default(0)|int %}
  RESPOND PREFIX="treed" MSG="Eddy calibration: active_step={active_step}, prompt={prompt}, primary={primary_done}, temperature={temperature_done}, z0={z0_done}, screws={screws_done}, mesh={mesh_done}"

[gcode_macro TREED_EDDY_CALIBRATE_DRIVE_CURRENT]
description: "TreeD UI: Eddy drive current calibration and save"
gcode:
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_CALIBRATE_DRIVE_CURRENT: запрещено во время печати или паузы")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"primary"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"drive_current"'
  SAVE_VARIABLE VARIABLE=treed_eddy_drive_current_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_offsets_changed VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_height_hash VALUE='""'
  SAVE_VARIABLE VARIABLE=treed_eddy_temperature_hash VALUE='""'
  SAVE_VARIABLE VARIABLE=treed_eddy_primary_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_temperature_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_z0_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_screws_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_mesh_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_required_done VALUE=0
  LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy
  SAVE_VARIABLE VARIABLE=treed_eddy_drive_current_done VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"restart"'
  TREED_SAVE_CONFIG

[gcode_macro TREED_EDDY_PRIMARY_HEIGHT_START]
description: "TreeD UI: start Eddy primary height paper-test calibration"
gcode:
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_PRIMARY_HEIGHT_START: запрещено во время печати или паузы")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=treed_eddy_primary_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_offsets_changed VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_height_hash VALUE='""'
  SAVE_VARIABLE VARIABLE=treed_eddy_temperature_hash VALUE='""'
  SAVE_VARIABLE VARIABLE=treed_eddy_temperature_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_z0_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_screws_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_mesh_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_required_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"primary"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"paper_test"'
  PROBE_EDDY_CURRENT_CALIBRATE_AUTO CHIP=btt_eddy

[gcode_macro TREED_EDDY_PRIMARY_ACCEPT_SAVE]
description: "TreeD UI: accept Eddy primary height calibration and save"
gcode:
  {% if printer["gcode_macro _TREED_EDDY_TEMPERATURE_STATE"].active|int == 1 or printer["temperature_probe btt_eddy"].in_calibration|int == 1 %}
    {action_raise_error("TREED_EDDY_PRIMARY_ACCEPT_SAVE: для температурной точки используйте TREED_EDDY_TEMPERATURE_ACCEPT")}
  {% endif %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = printer.pause_resume.is_paused|default(0)|int if printer.pause_resume is defined else 0 %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_PRIMARY_ACCEPT_SAVE: запрещено во время печати или паузы")}
  {% endif %}
  ACCEPT
  TREED_EDDY_HEIGHT_SAVE_MARK
  SAVE_VARIABLE VARIABLE=treed_eddy_primary_done VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"temperature"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"restart"'
  TREED_SAVE_CONFIG

[gcode_macro TREED_EDDY_TEMPERATURE_START]
description: "TreeD UI: start Eddy temperature calibration"
gcode:
  {% set vars = printer.save_variables.variables %}
  {% set state = printer["gcode_macro _TREED_EDDY_TEMPERATURE_STATE"] %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_START: запрещено во время печати или паузы")}
  {% endif %}
  {% if vars.treed_eddy_primary_done|default(0)|int != 1 or vars.treed_eddy_offsets_changed|default(0)|int == 1 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_START: сначала завершите первичную калибровку высоты")}
  {% endif %}
  {% if state.active|int == 1 or printer["temperature_probe btt_eddy"].in_calibration|int == 1 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_START: температурная серия уже активна")}
  {% endif %}
  {% if printer.configfile.save_config_pending|int == 1 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_START: сначала сохраните или отмените несохранённые настройки")}
  {% endif %}
  {% set probe_temp = printer["temperature_probe btt_eddy"].temperature|float %}
  {% set nozzle_temp = printer.extruder.temperature|float %}
  {% set bed_temp = printer.heater_bed.temperature|float %}
  {% if probe_temp > 30 or nozzle_temp > 30 or bed_temp > 30 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_START: перед серией датчик, сопло и стол должны остыть ниже 30C")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_TEMPERATURE_STATE VARIABLE=original_idle_timeout VALUE={printer.idle_timeout.idle_timeout|float}
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_TEMPERATURE_STATE VARIABLE=points VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_TEMPERATURE_STATE VARIABLE=active VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_temperature_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_temperature_hash VALUE='""'
  SAVE_VARIABLE VARIABLE=treed_eddy_temperature_points VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"temperature"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"temperature_points"'
  G28
  SET_IDLE_TIMEOUT TIMEOUT=36000
  TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy TARGET=56 STEP=4

[gcode_macro _TREED_EDDY_TEMPERATURE_STATE]
description: "TreeD: runtime state for Eddy temperature drift calibration"
variable_active: 0
variable_points: 0
variable_original_idle_timeout: 600
gcode:
  RESPOND PREFIX="treed" MSG="Eddy temperature calibration: active={printer['gcode_macro _TREED_EDDY_TEMPERATURE_STATE'].active}, points={printer['gcode_macro _TREED_EDDY_TEMPERATURE_STATE'].points}"

[gcode_macro TREED_EDDY_TEMPERATURE_ACCEPT]
description: "TreeD UI: accept only the current Eddy temperature paper-test point"
gcode:
  {% set state = printer["gcode_macro _TREED_EDDY_TEMPERATURE_STATE"] %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = printer.pause_resume.is_paused|default(0)|int if printer.pause_resume is defined else 0 %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_ACCEPT: запрещено во время печати или паузы")}
  {% endif %}
  {% if state.active|int != 1 or printer["temperature_probe btt_eddy"].in_calibration|int != 1 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_ACCEPT: нет активной температурной серии")}
  {% endif %}
  ACCEPT

  {% set next_points = state.points|int + 1 %}
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_TEMPERATURE_STATE VARIABLE=points VALUE={next_points}
  SAVE_VARIABLE VARIABLE=treed_eddy_temperature_points VALUE={next_points}

[gcode_macro TREED_EDDY_TEMPERATURE_COMPLETE_SAVE]
description: "TreeD UI: complete the Eddy drift series and save its calibration"
gcode:
  {% set state = printer["gcode_macro _TREED_EDDY_TEMPERATURE_STATE"] %}
  {% set probe = printer["temperature_probe btt_eddy"] %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = printer.pause_resume.is_paused|default(0)|int if printer.pause_resume is defined else 0 %}
  {% if state.active|int != 1 or state.points|int < 3 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_COMPLETE_SAVE: требуется активная серия минимум с тремя измеренными точками")}
  {% endif %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_TEMPERATURE_COMPLETE_SAVE: запрещено во время печати или паузы")}
  {% endif %}
  {% if probe.in_calibration|int == 1 %}
    TEMPERATURE_PROBE_COMPLETE
  {% endif %}
  # Stock сообщает ошибку fit без исключения; extra проверяет свежие pending coefficients.
  TREED_EDDY_TEMPERATURE_SAVE_MARK
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"z0"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"restart"'
  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_TEMPERATURE_STATE VARIABLE=active VALUE=0
  SET_IDLE_TIMEOUT TIMEOUT={state.original_idle_timeout|float}
  TREED_SAVE_CONFIG

[gcode_macro TREED_EDDY_TEMPERATURE_ACCEPT_SAVE]
description: "TreeD compatibility alias: complete and save Eddy temperature drift calibration"
gcode:
  TREED_EDDY_TEMPERATURE_COMPLETE_SAVE

[gcode_macro TREED_EDDY_CALIBRATION_ABORT]
description: "TreeD UI: abort Eddy paper-test or drift calibration and restore its state"
gcode:
  {% set state = printer["gcode_macro _TREED_EDDY_TEMPERATURE_STATE"] %}
  {% set probe = printer["temperature_probe btt_eddy"] %}
  {% if state.active|int == 1 %}
    {% if probe.in_calibration|int == 1 %}
      ABORT
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={state.original_idle_timeout|float}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_TEMPERATURE_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_TEMPERATURE_STATE VARIABLE=points VALUE=0
    SAVE_VARIABLE VARIABLE=treed_eddy_temperature_done VALUE=0
    SAVE_VARIABLE VARIABLE=treed_eddy_temperature_points VALUE=0
    SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"none"'
    SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"not_started"'
  {% elif printer.manual_probe.is_active|int == 1 %}
    ABORT
    SAVE_VARIABLE VARIABLE=treed_eddy_primary_done VALUE=0
    SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"none"'
    SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"not_started"'
  {% else %}
    {action_raise_error("TREED_EDDY_CALIBRATION_ABORT: нет активного измерения Eddy")}
  {% endif %}

[gcode_macro TREED_EDDY_PROBE_ACCURACY]
description: "TreeD UI: run the standard Eddy PROBE_ACCURACY series on an idle printer"
gcode:
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = printer.pause_resume.is_paused|default(0)|int if printer.pause_resume is defined else 0 %}
  {% set homed = printer.toolhead.homed_axes|lower %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_PROBE_ACCURACY: запрещено во время печати или паузы")}
  {% endif %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    {action_raise_error("TREED_EDDY_PROBE_ACCURACY: сначала выполните G28")}
  {% endif %}
  {% if printer["gcode_macro _TREED_EDDY_TEMPERATURE_STATE"].active|int == 1 %}
    {action_raise_error("TREED_EDDY_PROBE_ACCURACY: завершите или отмените температурную серию")}
  {% endif %}
  {% set vars = printer.save_variables.variables %}
  {% set active_step = vars.treed_eddy_active_step|default("not_started")|lower %}
  {% if vars.treed_eddy_primary_done|default(0)|int != 1 or vars.treed_eddy_offsets_changed|default(0)|int == 1 %}
    {action_raise_error("TREED_EDDY_PROBE_ACCURACY: сначала завершите калибровку Eddy")}
  {% endif %}
  {% if active_step in ["primary", "temperature"] %}
    {action_raise_error("TREED_EDDY_PROBE_ACCURACY: завершите активную калибровку Eddy")}
  {% endif %}
  PROBE_ACCURACY

[gcode_macro TREED_EDDY_Z_OFFSET_ADJUST]
description: "TreeD: adjust calibrated Eddy Z offset while idle"
gcode:
  {% set vars = printer.save_variables.variables %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = printer.pause_resume.is_paused|default(0)|int if printer.pause_resume is defined else 0 %}
  {% if print_state in ["printing", "paused"] or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_ADJUST: разрешено только в простое")}
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes|lower %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_ADJUST: Z должен быть homed")}
  {% endif %}
  {% if vars.treed_eddy_primary_done|default(0)|int != 1 or vars.treed_eddy_offsets_changed|default(0)|int == 1 %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_ADJUST: сначала завершите первичную калибровку высоты")}
  {% endif %}
  {% if printer["gcode_macro _TREED_EDDY_TEMPERATURE_STATE"].active|int == 1 %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_ADJUST: температурная серия ещё активна")}
  {% endif %}
  {% if params.DELTA is not defined %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_ADJUST: требуется DELTA")}
  {% endif %}
  {% set delta = params.DELTA|float(none) %}
  {% if delta is none or not (-0.05 <= delta <= 0.05) %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_ADJUST: DELTA вне диапазона -0.050..0.050")}
  {% endif %}
  {% set next_offset = printer.gcode_move.homing_origin.z|float + delta %}
  {% if not (-1.0 <= next_offset <= 1.0) %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_ADJUST: суммарный offset вне диапазона -1.0..1.0")}
  {% endif %}
  SET_GCODE_OFFSET Z_ADJUST={delta} MOVE=1 MOVE_SPEED=5
  RESPOND PREFIX="treed" MSG="eddy_z_offset_delta={delta} live_offset={next_offset}"

[gcode_macro TREED_EDDY_Z_OFFSET_SAVE]
description: "TreeD: apply and save calibrated Eddy Z offset while idle"
gcode:
  {% set vars = printer.save_variables.variables %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = printer.pause_resume.is_paused|default(0)|int if printer.pause_resume is defined else 0 %}
  {% if print_state in ["printing", "paused"] or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_SAVE: разрешено только в простое")}
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes|lower %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_SAVE: Z должен быть homed")}
  {% endif %}
  {% if vars.treed_eddy_primary_done|default(0)|int != 1 or vars.treed_eddy_offsets_changed|default(0)|int == 1 %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_SAVE: сначала завершите первичную калибровку высоты")}
  {% endif %}
  {% if printer["gcode_macro _TREED_EDDY_TEMPERATURE_STATE"].active|int == 1 %}
    {action_raise_error("TREED_EDDY_Z_OFFSET_SAVE: температурная серия ещё активна")}
  {% endif %}
  M400
  Z_OFFSET_APPLY_PROBE
  TREED_EDDY_HEIGHT_SAVE_MARK
  _TREED_UI_RESET_Z_OFFSET
  TREED_SAVE_CONFIG

[gcode_macro TREED_EDDY_CHECK_Z0]
description: "TreeD UI: check Eddy Z0 and park nozzle"
gcode:
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_CHECK_Z0: запрещено во время печати или паузы")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"z0"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"verify_z0"'
  G28
  TREED_Z_PARK_ZERO_EDDY
  SAVE_VARIABLE VARIABLE=treed_eddy_z0_done VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"screws"'

[gcode_macro TREED_EDDY_SCREWS_TILT_START]
description: "TreeD UI: start Eddy screws tilt calibration"
gcode:
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_SCREWS_TILT_START: запрещено во время печати или паузы")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"screws"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"adjust_screws"'
  TREED_SCREWS_TILT_CALIBRATE

[gcode_macro TREED_EDDY_SCREWS_TILT_DONE]
description: "TreeD UI: mark Eddy screws tilt as completed"
gcode:
  SAVE_VARIABLE VARIABLE=treed_eddy_screws_done VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"mesh"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"none"'

[gcode_macro TREED_EDDY_BED_MESH_CALIBRATE]
description: "TreeD UI: build Eddy service mesh; SAVE=0 previews, default SAVE=1 persists"
variable_scan_methods: 1
gcode:
  {% set method = params.METHOD|default("scan")|lower %}
  {% if method not in ["scan", "rapid_scan", "automatic"] %}
    {action_raise_error("TREED_EDDY_BED_MESH_CALIBRATE: METHOD должен быть scan, rapid_scan или automatic")}
  {% endif %}
  {% set save = params.SAVE|default("1")|string %}
  {% if save not in ["0", "1"] %}
    {action_raise_error("TREED_EDDY_BED_MESH_CALIBRATE: SAVE должен быть 0 или 1")}
  {% endif %}
  {% set mesh_bounds = (" MESH_MIN=" ~ params.MESH_MIN if params.MESH_MIN is defined else "") ~ (" MESH_MAX=" ~ params.MESH_MAX if params.MESH_MAX is defined else "") %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}
  {% if print_state == "printing" or is_paused == 1 %}
    {action_raise_error("TREED_EDDY_BED_MESH_CALIBRATE: запрещено во время печати или паузы")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"mesh"'
  SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"mesh_scan"'
  SAVE_VARIABLE VARIABLE=treed_eddy_mesh_done VALUE=0
  SAVE_VARIABLE VARIABLE=treed_eddy_required_done VALUE=0
  TREED_BED_MESH_CALIBRATE_EDDY PROFILE=default METHOD={method}{mesh_bounds}
  SAVE_VARIABLE VARIABLE=treed_eddy_mesh_done VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_required_done VALUE=1
  SAVE_VARIABLE VARIABLE=treed_eddy_active_step VALUE='"complete"'
  {% if save == "1" %}
    SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"restart"'
    TREED_SAVE_CONFIG
  {% else %}
    SAVE_VARIABLE VARIABLE=treed_eddy_operator_prompt VALUE='"none"'
  {% endif %}

# ==========================================
# EDDY AUTO Z-OFFSET AUTOSAVE
# ==========================================
# Назначение:
# - При END_PRINT/CANCEL_PRINT запоминает live Z-offset / babystep.
# - После остановки печати и движений готовит поправку к калибровке Eddy.
# - END_PRINT вызывает SAVE_CONFIG; CANCEL_PRINT применяет поправку в памяти.
# - После отмены запись на диск остаётся отдельным TREED_SAVE_CONFIG в простое.
#
# Важно:
# - calibrate/reg_drive_current не должны быть заданы в include-файлах.
# - Они должны жить в printer.cfg внутри #*# SAVE_CONFIG блока.

[gcode_macro _TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE]
variable_pending_z: 0.0
variable_has_pending: 0
variable_threshold: 0.005
gcode:
  G4 P0


[gcode_macro TREED_EDDY_Z_OFFSET_AUTOSAVE_STATUS]
description: "SERVICE: show Eddy Z-offset autosave state"
gcode:
  {% set st = printer["gcode_macro _TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE"] %}
  {% set has_pending = st.has_pending|int %}
  {% set pending_z_text = "%.3f"|format(st.pending_z|float) %}
  RESPOND PREFIX="treed" MSG="Eddy autosave: active, pending_z={pending_z_text}, has_pending={has_pending}"


[gcode_macro _TREED_EDDY_CAPTURE_LIVE_Z_OFFSET]
description: "SYSTEM: захватить live Z-offset до сброса при завершении или отмене"
gcode:
  {% set z = printer.gcode_move.homing_origin.z|float %}
  {% set st = printer["gcode_macro _TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE"] %}
  {% set threshold = st.threshold|float %}
  {% set z_text = "%.3f"|format(z) %}

  SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE={z}

  {% if z > threshold or z < -threshold %}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=1
    RESPOND PREFIX="treed" MSG="Eddy autosave: captured live Z={z_text}"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
    RESPOND PREFIX="treed" MSG="Eddy autosave: live Z is zero, nothing to save"
  {% endif %}


[gcode_macro _TREED_EDDY_APPLY_CAPTURED_Z_OFFSET]
description: "SYSTEM: подготовить поправку Eddy; SAVE=1 сохраняет с перезапуском"
gcode:
  {% set save = params.SAVE|default("1") %}
  {% if save not in ["0", "1"] %}
    {action_raise_error("Eddy autosave: SAVE должен быть 0 или 1")}
  {% endif %}
  {% set st = printer["gcode_macro _TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE"] %}
  {% set has_pending = st.has_pending|int %}
  {% set z = st.pending_z|float %}
  {% set threshold = st.threshold|float %}
  {% set z_text = "%.3f"|format(z) %}

  {% if has_pending == 0 %}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE=0.0
    RESPOND PREFIX="treed" MSG="Eddy autosave: no pending Z-offset"
  {% elif z >= -threshold and z <= threshold %}
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE=0.0
    RESPOND PREFIX="treed" MSG="Eddy autosave: pending Z is too small, skipped"
  {% else %}
    RESPOND PREFIX="treed" MSG="Eddy autosave: подготовка поправки Z={z_text} для калибровки Eddy"

    {% if save == "1" %}
      SET_GCODE_OFFSET Z={z} MOVE=0
      Z_OFFSET_APPLY_PROBE
    {% else %}
      _TREED_EDDY_APPLY_LIVE_Z_OFFSET Z={z}
    {% endif %}
    _TREED_UI_RESET_Z_OFFSET

    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=has_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_TREED_EDDY_Z_OFFSET_AUTOSAVE_STATE VARIABLE=pending_z VALUE=0.0

    {% if save == "1" %}
      SAVE_CONFIG
    {% else %}
      RESPOND PREFIX="treed" MSG="Поправка Z={z_text} применена для следующей печати; для записи на диск выполните TREED_SAVE_CONFIG в простое"
    {% endif %}
  {% endif %}


[delayed_gcode _TREED_EDDY_APPLY_CAPTURED_Z_OFFSET_DELAYED]
gcode:
  _TREED_EDDY_APPLY_CAPTURED_Z_OFFSET
