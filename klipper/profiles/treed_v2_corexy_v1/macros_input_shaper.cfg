# ==========================================
# INPUT SHAPER CALIBRATION — TreeD
# ==========================================
# Назначение:
# - Дает быстрые full/light команды калибровки резонансов через ADXL.
# - Full-контур сохраняет результат через TREED_SAVE_CONFIG.
# - Light-контур применяет результат на текущую сессию без рестарта.
# Контур:
# - public/service: TREED_SHAPER_CALIBRATE* можно запускать вручную.
# - start-gcode: START_PRINT вызывает light/full только с SAVE=0.

# Блок 1: Настройки по умолчанию для TreeD-калибровки.
[gcode_macro _TREED_SHAPER_CFG]
variable_full_accel: 25000.0
variable_full_freq_start: 5.0
variable_full_freq_end: 133.0
variable_full_hz_per_sec: 6.0
variable_light_window: 24.0
variable_light_freq_min: 5.0
variable_light_freq_max: 133.0
variable_light_hz_per_sec: 10.0
gcode:
  G4 P0

# Блок 2: Публичная команда full/light калибровки.
[gcode_macro TREED_SHAPER_CALIBRATE]
description: "TreeD: full/light input shaper calibration"
gcode:
  {% set cfg = printer["gcode_macro _TREED_SHAPER_CFG"] %}
  {% set MODE = params.MODE|default("light")|lower %}
  {% set SOURCE = params.SOURCE|default("manual")|lower %}
  {% set HOME = params.HOME|default(1 if SOURCE != "start_print" else 0)|int %}
  {% set SAVE_DEFAULT = 1 if MODE == "full" and SOURCE != "start_print" else 0 %}
  {% set SAVE = params.SAVE|default(SAVE_DEFAULT)|int %}
  {% set ACCEL_RAW = params.ACCEL|default("auto")|lower %}

  {% set FULL_FREQ_START = params.FREQ_START|default(cfg.full_freq_start)|float %}
  {% set FULL_FREQ_END = params.FREQ_END|default(cfg.full_freq_end)|float %}
  {% set FULL_HZ_PER_SEC = params.HZ_PER_SEC|default(cfg.full_hz_per_sec)|float %}
  {% set LIGHT_WINDOW = params.WINDOW|default(cfg.light_window)|float %}
  {% set LIGHT_FREQ_MIN = params.FREQ_MIN|default(cfg.light_freq_min)|float %}
  {% set LIGHT_FREQ_MAX = params.FREQ_MAX|default(cfg.light_freq_max)|float %}
  {% set LIGHT_HZ_PER_SEC = params.LIGHT_HZ_PER_SEC|default(params.HZ_PER_SEC|default(cfg.light_hz_per_sec))|float %}
  {% set ACCEL_PER_HZ = params.ACCEL_PER_HZ|default(0)|float %}

  {% if MODE not in ["full", "light"] %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: MODE должен быть full или light")}
  {% endif %}

  {% if ACCEL_RAW == "auto" %}
    {% if MODE == "full" %}
      {% set ACCEL = cfg.full_accel|float %}
    {% else %}
      {% set ACCEL = printer.toolhead.max_accel|float %}
    {% endif %}
  {% else %}
    {% set ACCEL = ACCEL_RAW|float %}
  {% endif %}

  {% if ACCEL <= 0 %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: ACCEL должен быть > 0")}
  {% endif %}
  {% if SAVE not in [0, 1] %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: SAVE должен быть 0 или 1")}
  {% endif %}
  {% if HOME not in [0, 1] %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: HOME должен быть 0 или 1")}
  {% endif %}
  {% if FULL_FREQ_START < 1 or FULL_FREQ_END <= FULL_FREQ_START %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: неверный full диапазон частот")}
  {% endif %}
  {% if FULL_HZ_PER_SEC <= 0 or LIGHT_HZ_PER_SEC <= 0 %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: HZ_PER_SEC должен быть > 0")}
  {% endif %}
  {% if LIGHT_WINDOW <= 0 or LIGHT_FREQ_MIN < 1 or LIGHT_FREQ_MAX <= LIGHT_FREQ_MIN %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: неверные light параметры частот")}
  {% endif %}
  {% if ACCEL_PER_HZ < 0 %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: ACCEL_PER_HZ не может быть < 0")}
  {% endif %}

  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if is_paused == 1 %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: запрещено во время паузы")}
  {% endif %}
  {% if print_state == "printing" and SOURCE != "start_print" %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: вручную запрещено во время печати")}
  {% endif %}
  {% if SAVE == 1 and SOURCE == "start_print" %}
    {action_raise_error("TREED_SHAPER_CALIBRATE: SAVE=1 нельзя использовать из START_PRINT")}
  {% endif %}

  {% if HOME == 1 %}
    G28
  {% endif %}

  _TREED_SHAPER_CALIBRATE_RUN MODE={MODE} SAVE={SAVE} ACCEL={ACCEL} FULL_FREQ_START={FULL_FREQ_START} FULL_FREQ_END={FULL_FREQ_END} FULL_HZ_PER_SEC={FULL_HZ_PER_SEC} LIGHT_WINDOW={LIGHT_WINDOW} LIGHT_FREQ_MIN={LIGHT_FREQ_MIN} LIGHT_FREQ_MAX={LIGHT_FREQ_MAX} LIGHT_HZ_PER_SEC={LIGHT_HZ_PER_SEC} ACCEL_PER_HZ={ACCEL_PER_HZ}

# Блок 3: Исполнитель калибровки после возможного homing.
[gcode_macro _TREED_SHAPER_CALIBRATE_RUN]
description: "SYSTEM: TreeD input shaper calibration runner"
gcode:
  {% set MODE = params.MODE|lower %}
  {% set SAVE = params.SAVE|int %}
  {% set ACCEL = params.ACCEL|float %}
  {% set FULL_FREQ_START = params.FULL_FREQ_START|float %}
  {% set FULL_FREQ_END = params.FULL_FREQ_END|float %}
  {% set FULL_HZ_PER_SEC = params.FULL_HZ_PER_SEC|float %}
  {% set LIGHT_WINDOW = params.LIGHT_WINDOW|float %}
  {% set LIGHT_FREQ_MIN = params.LIGHT_FREQ_MIN|float %}
  {% set LIGHT_FREQ_MAX = params.LIGHT_FREQ_MAX|float %}
  {% set LIGHT_HZ_PER_SEC = params.LIGHT_HZ_PER_SEC|float %}
  {% set ACCEL_PER_HZ = params.ACCEL_PER_HZ|float %}

  {% set homed = printer.toolhead.homed_axes|lower %}
  {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
    {action_raise_error("_TREED_SHAPER_CALIBRATE_RUN: перед калибровкой должны быть homed X/Y/Z")}
  {% endif %}

  {% set old_velocity = printer.toolhead.max_velocity|float %}
  {% set old_accel = printer.toolhead.max_accel|float %}
  {% set old_scv = printer.toolhead.square_corner_velocity|float %}

  SAVE_GCODE_STATE NAME=TREED_SHAPER_CALIBRATE_STATE
  G90
  M400
  SET_VELOCITY_LIMIT ACCEL={ACCEL}

  {% if MODE == "full" %}
    {% set freq_start = FULL_FREQ_START %}
    {% set freq_end = FULL_FREQ_END %}
    {% set hz_per_sec = FULL_HZ_PER_SEC %}
    {% set accel_per_hz = ACCEL_PER_HZ if ACCEL_PER_HZ > 0 else ACCEL / freq_end %}

    RESPOND PREFIX="treed" MSG="SHAPER full: accel={ACCEL|int}, freq={freq_start|round(1)}-{freq_end|round(1)}Hz, hz/s={hz_per_sec|round(1)}"
    SHAPER_CALIBRATE FREQ_START={freq_start} FREQ_END={freq_end} ACCEL_PER_HZ={accel_per_hz} HZ_PER_SEC={hz_per_sec} INPUT_SHAPING=0 NAME=treed_full

  {% elif MODE == "light" %}
    {% set saved_x = printer.configfile.settings.input_shaper.shaper_freq_x|default(0)|float %}
    {% set saved_y = printer.configfile.settings.input_shaper.shaper_freq_y|default(0)|float %}
    {% if saved_x <= 0 or saved_y <= 0 %}
      {action_raise_error("TREED_SHAPER_CALIBRATE light: нет сохраненных shaper_freq_x/y, сначала выполните full")}
    {% endif %}

    {% set half_window = LIGHT_WINDOW / 2.0 %}
    {% set x_start = saved_x - half_window %}
    {% set x_end = saved_x + half_window %}
    {% set y_start = saved_y - half_window %}
    {% set y_end = saved_y + half_window %}

    {% if x_start < LIGHT_FREQ_MIN %}{% set x_start = LIGHT_FREQ_MIN %}{% endif %}
    {% if y_start < LIGHT_FREQ_MIN %}{% set y_start = LIGHT_FREQ_MIN %}{% endif %}
    {% if x_end > LIGHT_FREQ_MAX %}{% set x_end = LIGHT_FREQ_MAX %}{% endif %}
    {% if y_end > LIGHT_FREQ_MAX %}{% set y_end = LIGHT_FREQ_MAX %}{% endif %}
    {% if x_end <= x_start or y_end <= y_start %}
      {action_raise_error("TREED_SHAPER_CALIBRATE light: неверный диапазон вокруг сохраненных частот")}
    {% endif %}

    {% set x_accel_per_hz = ACCEL_PER_HZ if ACCEL_PER_HZ > 0 else ACCEL / x_end %}
    {% set y_accel_per_hz = ACCEL_PER_HZ if ACCEL_PER_HZ > 0 else ACCEL / y_end %}

    RESPOND PREFIX="treed" MSG="SHAPER light X: accel={ACCEL|int}, freq={x_start|round(1)}-{x_end|round(1)}Hz"
    SHAPER_CALIBRATE AXIS=X FREQ_START={x_start} FREQ_END={x_end} ACCEL_PER_HZ={x_accel_per_hz} HZ_PER_SEC={LIGHT_HZ_PER_SEC} INPUT_SHAPING=0 NAME=treed_light_x

    RESPOND PREFIX="treed" MSG="SHAPER light Y: accel={ACCEL|int}, freq={y_start|round(1)}-{y_end|round(1)}Hz"
    SHAPER_CALIBRATE AXIS=Y FREQ_START={y_start} FREQ_END={y_end} ACCEL_PER_HZ={y_accel_per_hz} HZ_PER_SEC={LIGHT_HZ_PER_SEC} INPUT_SHAPING=0 NAME=treed_light_y
  {% endif %}

  M400
  SET_VELOCITY_LIMIT VELOCITY={old_velocity} ACCEL={old_accel} SQUARE_CORNER_VELOCITY={old_scv}
  RESTORE_GCODE_STATE NAME=TREED_SHAPER_CALIBRATE_STATE MOVE=0

  {% if SAVE == 1 %}
    RESPOND PREFIX="treed" MSG="SHAPER {MODE}: saving config and restarting Klipper"
    TREED_SAVE_CONFIG
  {% else %}
    RESPOND PREFIX="treed" MSG="SHAPER {MODE}: applied for current session without SAVE_CONFIG"
  {% endif %}

# Блок 4: Удобные публичные алиасы для UI/консоли.
[gcode_macro TREED_SHAPER_CALIBRATE_FULL]
description: "TreeD: full input shaper calibration, save by default"
gcode:
  TREED_SHAPER_CALIBRATE MODE=full ACCEL={params.ACCEL|default("auto")} SAVE={params.SAVE|default(1)} HOME={params.HOME|default(1)}

[gcode_macro TREED_SHAPER_CALIBRATE_LIGHT]
description: "TreeD: light input shaper calibration, apply without restart"
gcode:
  TREED_SHAPER_CALIBRATE MODE=light ACCEL={params.ACCEL|default("auto")} SAVE={params.SAVE|default(0)} HOME={params.HOME|default(1)}
