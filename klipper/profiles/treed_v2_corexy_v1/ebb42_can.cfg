# ==========================================
# КОНФИГ TOOLHEAD MCU — EBB42 CAN
# ==========================================
# Назначение:
# - Подключает плату EBB42 как CAN-MCU (`EBBCan`) через U2C.
# - Хранит монолитный toolhead-контур: extruder, драйвер, fan, hotend_fan.
# - Оставляет только необязательные секции filament/rgb по месту подключения.
# Контур:
# - required в V2-профиле (EBB обязателен).

# Блок 1: Канал связи host -> EBB42 (CAN).
[mcu EBBCan]
canbus_uuid: REPLACE_EBB_CANBUS_UUID
canbus_interface: can0

# Блок 2: Onboard ADXL345 на EBB42 (как в sample-bigtreetech-ebb-canbus-v1.2.cfg).
[adxl345]
cs_pin: EBBCan:PB12
spi_software_sclk_pin: EBBCan:PB10
spi_software_mosi_pin: EBBCan:PB11
spi_software_miso_pin: EBBCan:PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
probe_points:
  122.5,122.5,20
min_freq: 5
max_freq: 133
accel_per_hz: 75
hz_per_sec: 1

# Блок 3: Экструдер и хотэнд на EBB42.
[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 60:8
rotation_distance: 35.8

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: EBBCan:PB13
sensor_type: NTC100K_B3950
sensor_pin: EBBCan:PA3
pullup_resistor: 4700
smooth_time: 1.0
min_temp: 0
max_temp: 280
max_power: 1.0

min_extrude_temp: 170

control: pid
pid_kp: 11.818
pid_ki: 0.435
pid_kd: 80.218
pwm_cycle_time: 0.100

instantaneous_corner_velocity: 1.0
max_extrude_only_distance: 120
max_extrude_only_velocity: 120
max_extrude_only_accel: 1500
max_extrude_cross_section: 5
pressure_advance: 0.08
pressure_advance_smooth_time: 0.040

# Блок 4: Драйвер экструдера на EBB42 (встроенный TMC2209 UART).
[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.650
stealthchop_threshold: 999999

# Блок 5: Обдув модели и сервисный вентилятор хотэнда.
[fan]
pin: EBBCan:PA0
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.5
off_below: 0.15

[heater_fan hotend_fan]
pin: EBBCan:PA1
heater: extruder
heater_temp: 50.0
max_power: 1.0
kick_start_time: 0.5
shutdown_speed: 1.0

# Блок 6: Определение термистора.
[thermistor NTC100K_B3950]
temperature1: 25
resistance1: 100000
beta: 3950

