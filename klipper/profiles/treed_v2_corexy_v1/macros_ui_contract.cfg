# ==========================================
# DEVICE CONTRACT ДЛЯ TreeD Shell
# ==========================================
# Назначение:
# - Публикует версию профиля, аппаратные лимиты и capability для UI.
# - Фиксирует обязательные public macro, без которых live-управление небезопасно.
# Контур:
# - state-only/required: читается через Moonraker printer objects query.
# - fail-closed: несовместимая версия переводит UI в restricted mode.

# Блок 1: Версионированный state surface активного профиля.
[gcode_macro _TREED_UI_CONTRACT]
description: "TreeD UI: versioned device contract"
variable_contract_version: "1.0"
variable_profile: "treed_v2_corexy_v1"
variable_model: "TreeD V2"
variable_revision: "1"
variable_nozzle_max_c: 280.0
variable_bed_max_c: 120.0
variable_axis_x_min: 0.0
variable_axis_x_max: 245.0
variable_axis_y_min: 0.0
variable_axis_y_max: 245.0
variable_axis_z_min: -5.0
variable_axis_z_max: 255.0
variable_capability_print: 1
variable_capability_motion: 1
variable_capability_thermal: 1
variable_capability_fan: 1
variable_capability_filament: 1
variable_capability_console: 1
variable_capability_eddy: 1
variable_capability_shaper: 1
variable_capability_motion_test: 1
variable_capability_network: 1
variable_capability_camera: 1
variable_capability_system_power: 1
variable_capability_service_commands: 1
variable_required_macros: "_TREED_EDDY_HOME_Z,TREED_UI_MOVE_AXIS,TREED_UI_SET_SPEED_FACTOR,TREED_UI_SET_FLOW_FACTOR,TREED_UI_SET_ACCEL,TREED_UI_SET_PRESSURE_ADVANCE,TREED_UI_SET_RETRACTION,TREED_UI_ADJUST_Z_OFFSET,LOAD_FILAMENT,UNLOAD_FILAMENT,TREED_Z_PARK_ZERO_EDDY,TREED_SHAPER_CALIBRATE_LIGHT,TREED_SHAPER_CALIBRATE_FULL,TREED_XY_MOTION_TEST"
gcode:
