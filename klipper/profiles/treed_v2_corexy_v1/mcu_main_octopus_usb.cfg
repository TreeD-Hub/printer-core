# ==========================================
# КОНФИГ MAIN MCU — OCTOPUS USB
# ==========================================
# Назначение:
# - Подключает основную плату Octopus к host по USB serial.
# - Строка `serial` управляется шагом loader/steps/klipper-profiles.sh.
# Контур:
# - required для V2-контрура (без main MCU Klipper не стартует).

[mcu]
serial: /dev/serial/by-id/REPLACE_MAIN_MCU
restart_method: command
