# ==========================================
# КОНФИГ MAIN MCU — OCTOPUS PRO USB
# ==========================================
# Назначение:
# - Подключает основную плату Octopus Pro к host по USB serial.
# - Строка `serial` управляется шагом loader/steps/klipper-profiles.sh.
# Контур:
# - required для V2-контрура (без main MCU Klipper не стартует).

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_3B0027000D50535556323420-if00
restart_method: command
