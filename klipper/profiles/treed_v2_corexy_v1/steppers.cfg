# ==========================================
# КОНФИГ ОСЕЙ X/Y/Z — V2 COREXY (ШАБЛОН)
# ==========================================
# Назначение:
# - Для каждой оси хранит полный набор параметров:
#   шаг/направление/enable, геометрию шага, концевик и пределы.
# - Разнесение одной оси по разным файлам не используется.
# - Внутри каждой оси параметры сгруппированы по логическим блокам.
# - Для X/Y применяется sensorless homing через TMC5160 (SPI + DIAG).
# - Для Z применяется TMC5160 на слоте MOTOR2_1 (SPI + DIAG).
# Контур:
# - required: определяет все оси и драйверы активного V2-профиля.

# Блок 1: Ось X и sensorless endstop.
[stepper_x]
# Пины мотора: Octopus Pro MOTOR1.
# Для CoreXY это MOTOR1 + инверсия направления, чтобы raw X0 был слева.
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15

# Кинематика шага
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Sensorless homing через TMC5160 DIAG
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 245

# Хоуминг
homing_positive_dir: false
homing_speed: 18
homing_retract_dist: 0
homing_retract_speed: 20
second_homing_speed: 20

# Блок 2: Драйвер TMC5160 оси X.
[tmc5160 stepper_x]
# Octopus Pro MOTOR1 CS
cs_pin: PD11

# Octopus Pro SPI1 lines
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

# Ток стартовый. Потом поднимем после проверки моторов/температур.
run_current: 1.1
sense_resistor: 0.075

# Для XY лучше spreadCycle, без stealthChop.
interpolate: False
stealthchop_threshold: 0

# Sensorless homing
diag1_pin: ^!PG9
#Максимальная чувствительность -64, минимальная 64.
driver_SGT: 4
driver_SFILT: 0


# Блок 3: Ось Y и sensorless endstop.
[stepper_y]
# Пины мотора: Octopus Pro MOTOR0.
# Парная перестановка MOTOR0/MOTOR1 сохраняет направление Y после разворота X.
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14

# Кинематика шага
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Sensorless homing через TMC5160 DIAG
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: 245
position_min: 0
position_max: 245

# Хоуминг
homing_positive_dir: true
homing_speed: 20
homing_retract_dist: 0
homing_retract_speed: 20
second_homing_speed: 20

# Блок 4: Драйвер TMC5160 оси Y.
[tmc5160 stepper_y]
# Octopus Pro MOTOR0 CS
cs_pin: PC4

# Octopus Pro SPI1 lines
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

# Ток стартовый. Потом поднимем после проверки моторов/температур.
run_current: 1.1
sense_resistor: 0.075

# Для XY лучше spreadCycle, без stealthChop.
interpolate: False
stealthchop_threshold: 0

# Sensorless homing
diag1_pin: ^!PG6
#Максимальная чувствительность -64, минимальная 64.
driver_SGT: 3
driver_SFILT: 0


# Блок 5: Ось Z через Eddy virtual endstop.
[stepper_z]
# Пины мотора: Octopus Pro MOTOR2_1
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5

# Кинематика шага
rotation_distance: 2
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Концевик и границы
# Eddy становится штатным Z-endstop.
# Важно: при probe:z_virtual_endstop нельзя задавать position_endstop.
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 255

# Хоуминг к рабочему Z0 через Eddy.
# Для нашей кинематики Z0 находится сверху у стола, поэтому homing идёт в отрицательном направлении.
homing_positive_dir: false
homing_speed: 8
homing_retract_dist: 0
homing_retract_speed: 5
second_homing_speed: 5

# Блок 6: Драйвер TMC5160 оси Z.
[tmc5160 stepper_z]
# Octopus Pro MOTOR2_1 CS
cs_pin: PC6

# Octopus Pro SPI1 lines
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

# Ток стартовый для Z. Потом поднимем после проверки мотора/температур.
run_current: 0.65
sense_resistor: 0.075

# Zmax sensorless оставлен как аппаратный резерв для fallback-профиля.
# В основном Eddy-профиле этот DIAG больше не является штатным Z-endstop.
diag1_pin: ^!PG10
driver_SGT: 3

# Для Z лучше spreadCycle, без stealthChop.
interpolate: False
stealthchop_threshold: 0
