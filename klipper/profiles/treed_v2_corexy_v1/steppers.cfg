# ==========================================
# КОНФИГ ОСЕЙ X/Y/Z — V2 COREXY (ШАБЛОН)
# ==========================================
# Назначение:
# - Для каждой оси хранит полный набор параметров:
#   шаг/направление/enable, геометрию шага, концевик и пределы.
# - Разнесение одной оси по разным файлам не используется.
# - Внутри каждой оси параметры сгруппированы по логическим блокам.
# - Для X/Y применяется sensorless homing через TMC2209 (UART + DIAG).
# - Для Z применяется TMC5160 на слоте MOTOR2_1 (SPI).

[stepper_x]
# Пины мотора: Octopus Pro MOTOR0
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14

# Кинематика шага
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Sensorless homing через TMC2209 DIAG
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 245
position_min: 0
position_max: 245

# Хоуминг
homing_positive_dir: true
homing_speed: 20
homing_retract_dist: 0
homing_retract_speed: 20
second_homing_speed: 20

[tmc2209 stepper_x]
# Octopus Pro MOTOR0 UART
uart_pin: PC4

# Ток стартовый. Потом поднимем после проверки моторов/температур.
run_current: 0.90
sense_resistor: 0.110

# Для XY лучше spreadCycle, без stealthChop.
interpolate: False
stealthchop_threshold: 0

# Sensorless homing
diag_pin: ^!PG6
driver_SGTHRS: 90


[stepper_y]
# Пины мотора: Octopus Pro MOTOR1
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15

# Кинематика шага
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Sensorless homing через TMC2209 DIAG
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 245
position_min: 0
position_max: 245

# Хоуминг
homing_positive_dir: true
homing_speed: 20
homing_retract_dist: 0
homing_retract_speed: 20
second_homing_speed: 20

[tmc2209 stepper_y]
# Octopus Pro MOTOR1 UART
uart_pin: PD11

# Ток стартовый. Потом поднимем после проверки моторов/температур.
run_current: 0.90
sense_resistor: 0.110

# Для XY лучше spreadCycle, без stealthChop.
interpolate: False
stealthchop_threshold: 0

# Sensorless homing
diag_pin: ^!PG9
driver_SGTHRS: 90


[stepper_z]
# Пины мотора: Octopus Pro MOTOR2_1
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5

# Кинематика шага
rotation_distance: 2
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Концевик и границы
endstop_pin: probe:z_virtual_endstop
position_min: -1
position_max: 200

# Хоуминг
homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5
second_homing_speed: 5

[tmc5160 stepper_z]
# Octopus Pro MOTOR2_1 CS
cs_pin: PC6

# Octopus Pro SPI1 lines
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

# Ток стартовый для Z. Потом поднимем после проверки мотора/температур.
run_current: 0.65
sense_resistor: 0.075

# Z не использует sensorless homing; DIAG не нужен.
interpolate: False
stealthchop_threshold: 0
