# ==========================================
# КОНФИГ ОСЕЙ X/Y/Z — V2 COREXY (ШАБЛОН)
# ==========================================
# Назначение:
# - Для каждой оси хранит полный набор параметров:
#   шаг/направление/enable, геометрию шага, концевик и пределы.
# - Разнесение одной оси по разным файлам не используется.
# - Внутри каждой оси параметры сгруппированы по логическим блокам.
# - Для X/Y применяется sensorless homing через TMC2209 (UART + DIAG).

# Ось X: мотор + концевик + границы.
[stepper_x]
# Пины мотора
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14

# Кинематика шага
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Концевик и границы
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 245
position_min: 0
position_max: 245

# Хоуминг
homing_positive_dir: true
homing_speed: 20
homing_retract_dist: 0
homing_retract_speed: 20
second_homing_speed: 20

# Драйвер X: TMC2209 по UART + DIAG для sensorless homing.
[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6
run_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 255

# Ось Y: мотор + концевик + границы.
[stepper_y]
# Пины мотора
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15

# Кинематика шага
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Концевик и границы
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 245
position_min: 0
position_max: 245

# Хоуминг
homing_positive_dir: true
homing_speed: 20
homing_retract_dist: 0
homing_retract_speed: 20
second_homing_speed: 20

# Драйвер Y: TMC2209 по UART + DIAG для sensorless homing.
[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: ^PG9
run_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 255

# Ось Z: мотор + концевик + границы.
[stepper_z]
# Пины мотора
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8

# Кинематика шага
rotation_distance: 2
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 1:1
step_pulse_duration: 0.000002

# Концевик и границы
endstop_pin: PG10
position_endstop: 0.5
position_min: -1
position_max: 200

# Хоуминг
homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5
second_homing_speed: 5
