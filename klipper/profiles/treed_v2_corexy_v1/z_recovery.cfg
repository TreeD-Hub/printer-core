# Нижняя опора для неизвестной Z; required перед XY, рабочий Z0 ищет Eddy.
# Блок 1: Штатные границы и параметры sensorless-поиска нижней опоры.
[treed_z_recovery]
# SGT и ток задаются в [tmc5160 stepper_z] файла steppers.cfg.
speed: 50
accel: 1000
# Z=203 мм — опорная привязка; рабочий максимум после Eddy равен
# min(position_max, измеренная высота DIAG от Z0 - bottom_clearance_mm).
bottom_position: 203
# Предел sensorless-поиска 210 мм; position_max остаётся 203 мм.
max_seek: 210
bottom_clearance_mm: 5
stallguard_pause: 2
