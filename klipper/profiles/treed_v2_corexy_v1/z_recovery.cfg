# Нижняя опора для неизвестной Z; required перед XY, рабочий Z0 ищет Eddy.
# Блок 1: Границы поиска; sensorless recovery ещё требует аппаратной приёмки.
[treed_z_recovery]
sgt: 3
current: 0.9
speed: 5
accel: 100
# Z=203 мм — временная привязка; рабочий максимум после Eddy равен
# min(position_max, измеренная высота DIAG от Z0 - bottom_clearance_mm).
bottom_position: 203
# Предел sensorless-поиска 210 мм; position_max остаётся 203 мм.
max_seek: 210
bottom_clearance_mm: 5
stallguard_pause: 2
