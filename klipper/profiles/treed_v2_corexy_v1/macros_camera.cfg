# ==========================================
# КАМЕРА И СНИМКИ — TreeD CAM
# ==========================================
# Назначение:
# - Управляет runtime-сессией снимков во время печати.
# - Запускает периодический тикер снимков через Moonraker shell-command.
# - Хранит внутреннее состояние для PAUSE/RESUME.
# - Содержит временные алиасы для обратной совместимости.
#
# Важно:
# - Этот файл не зависит от Octopus Pro и не содержит MCU-пинов.
# - Для RESPOND должен быть включен [respond] в одном из cfg.
# - Для shell-команд должен быть развернут TreeD Moonraker component.
# - _TREED_PRINT_DEFAULTS опционален: если его нет, используется fallback-интервал.
# Контур:
# - best-effort: сбой shell-command не должен менять механику печати.
# - internal: публичные алиасы оставлены только для обратной совместимости.

# Блок 1: Runtime-контракт и состояние камеры.
[gcode_macro _TREED_CAMERA]
variable_enabled: 1
variable_resolution: "1920x1080"
variable_target_fps: 30
variable_max_fps: 30
variable_stream_url: "/webcam/?action=stream"
variable_snapshot_url: "/webcam/?action=snapshot"
gcode:

[gcode_macro _TREED_CAM_STATE]
variable_enabled: 0
variable_was_enabled_before_pause: 0
gcode:

# Блок 2: Периодический тикер снимков.
[delayed_gcode _TREED_CAM_TICK]
initial_duration: 0
gcode:
  {% if printer["gcode_macro _TREED_CAM_STATE"].enabled|int == 1 %}
    {% set interval = 30 %}
    {% if 'gcode_macro _TREED_PRINT_DEFAULTS' in printer %}
      {% set interval = printer["gcode_macro _TREED_PRINT_DEFAULTS"].snapshot_interval|default(30)|int %}
    {% endif %}
    {% if interval < 10 %}
      {% set interval = 10 %}
    {% endif %}

    {action_call_remote_method("machine.shell_command", cmd="treed_cam_snapshot")}
    UPDATE_DELAYED_GCODE ID=_TREED_CAM_TICK DURATION={interval}
  {% endif %}

# Блок 3: Старт runtime-сессии камеры.
[gcode_macro _TREED_CAM_START]
description: "TreeD: camera session start"
gcode:
  {% if printer["gcode_macro _TREED_CAM_STATE"].enabled|int == 0 %}
    {% set filename = printer.print_stats.filename|default("") %}
    SET_GCODE_VARIABLE MACRO=_TREED_CAM_STATE VARIABLE=enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=_TREED_CAM_STATE VARIABLE=was_enabled_before_pause VALUE=0
    RESPOND PREFIX="treed" MSG="CAM: start session"
    {action_call_remote_method("machine.shell_command", cmd="treed_cam_session_start", parameters=filename)}
    UPDATE_DELAYED_GCODE ID=_TREED_CAM_TICK DURATION=1
  {% else %}
    RESPOND PREFIX="treed" MSG="CAM: already running"
  {% endif %}

# Блок 4: Остановка runtime-сессии камеры.
[gcode_macro _TREED_CAM_STOP]
description: "TreeD: camera session stop"
gcode:
  {% if printer["gcode_macro _TREED_CAM_STATE"].enabled|int == 1 %}
    RESPOND PREFIX="treed" MSG="CAM: stop session"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_TREED_CAM_STATE VARIABLE=enabled VALUE=0
  SET_GCODE_VARIABLE MACRO=_TREED_CAM_STATE VARIABLE=was_enabled_before_pause VALUE=0
  UPDATE_DELAYED_GCODE ID=_TREED_CAM_TICK DURATION=0
  {action_call_remote_method("machine.shell_command", cmd="treed_cam_session_stop")}

# Блок 5: Deprecated алиасы для старого UI/workflow.
[gcode_macro TREED_CAM_START]
description: "SYSTEM/DEPRECATED: use _TREED_CAM_START"
gcode:
  RESPOND PREFIX="treed" MSG="DEPRECATED: TREED_CAM_START -> _TREED_CAM_START"
  _TREED_CAM_START

[gcode_macro TREED_CAM_STOP]
description: "SYSTEM/DEPRECATED: use _TREED_CAM_STOP"
gcode:
  RESPOND PREFIX="treed" MSG="DEPRECATED: TREED_CAM_STOP -> _TREED_CAM_STOP"
  _TREED_CAM_STOP
