# ==========================================
# БАЗОВЫЕ МАКРОСЫ ПЕЧАТИ — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Хранит общие state/config macro для печати, парковки и idle timeout.
# - Подключает print-offset к единой геометрии `_TREED_GEOMETRY_CFG`.
# Контур:
# - required: используется START_PRINT, PAUSE/RESUME/CANCEL и сервисными макросами.
# - raw/print: offset включается только для печатной зоны, сервисные движения идут в raw coords.

# Блок 1: Общие дефолты печати и камеры.
[gcode_macro _TREED_PRINT_DEFAULTS]
description: "TreeD: дефолты макросов печати и камеры"
variable_snapshot_interval: 120
gcode:

# Блок 2: UI capability-флаги системных действий.
[gcode_macro _TREED_SYSTEM_POWER]
description: "TreeD UI: host power actions capability"
variable_enabled: 1
gcode:

[gcode_macro _TREED_SERVICE_COMMANDS]
description: "TreeD UI: service restart commands capability"
variable_enabled: 1
gcode:

# Блок 3: Общий допуск сервисных операций.
[gcode_macro _TREED_OPERATION_STATE]
description: "SYSTEM: фаза операции; auto_remove зарезервирована для автосъёма"
variable_phase: "idle"
gcode:

[gcode_macro _TREED_OPERATION_REQUIRE]
description: "SYSTEM: проверить допуск операции до нагрева или движения"
gcode:
  {% set op = params.OP|default("")|lower %}
  {% set phase = printer["gcode_macro _TREED_OPERATION_STATE"].phase|string|lower %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set paused = printer.pause_resume.is_paused|default(0)|int %}
  {% if phase not in ["idle", "preparing", "printing", "paused", "calibrating", "auto_remove"] %}
    {action_raise_error("OPERATION: неизвестная фаза " ~ phase)}
  {% endif %}
  {% if phase in ["preparing", "calibrating", "auto_remove"] %}
    {% set state = phase %}
  {% elif paused == 1 or print_state == "paused" or phase == "paused" %}
    {% set state = "paused" %}
  {% elif print_state == "printing" or phase == "printing" %}
    {% set state = "printing" %}
  {% else %}
    {% set state = "idle" %}
  {% endif %}

  {% if op == "start" %}
    {% if phase != "idle" or paused == 1 or print_state == "paused" %}
      {action_raise_error("START_PRINT: операция уже активна (" ~ state ~ ")")}
    {% endif %}
  {% elif op == "ui_move" %}
    {% if state != "idle" %}
      {action_raise_error("TREED_UI_MOVE_AXIS: запрещено во время " ~ state)}
    {% endif %}
  {% elif op == "filament" %}
    {% if state != "idle" and not (state == "paused" and (paused == 1 or print_state == "paused")) %}
      {action_raise_error("FILAMENT_MOVE: сервисная протяжка запрещена во время " ~ state)}
    {% endif %}
  {% elif op == "pause" %}
    {% if state != "printing" or print_state != "printing" %}
      {action_raise_error("PAUSE: требуется активная печать (сейчас " ~ state ~ ")")}
    {% endif %}
    {% set th = printer.toolhead %}
    {% set pos = th.position %}
    {% if "x" not in th.homed_axes or "y" not in th.homed_axes or "z" not in th.homed_axes or
          pos.x|float < th.axis_minimum.x|float or pos.x|float > th.axis_maximum.x|float or
          pos.y|float < th.axis_minimum.y|float or pos.y|float > th.axis_maximum.y|float or
          pos.z|float < th.axis_minimum.z|float or pos.z|float > th.axis_maximum.z|float %}
      {action_raise_error("PAUSE: для парковки нужны достоверные X/Y/Z в пределах осей")}
    {% endif %}
  {% elif op == "resume" %}
    {% if state != "paused" or (paused != 1 and print_state != "paused") %}
      {action_raise_error("RESUME: нет активной паузы")}
    {% endif %}
  {% elif op == "shaper" %}
    {% if state != "idle" or paused == 1 %}
      {action_raise_error("TREED_SHAPER_CALIBRATE: запрещено во время " ~ state)}
    {% endif %}
  {% elif op == "shaper_run" %}
    {% if phase != "calibrating" or paused == 1 %}
      {action_raise_error("SHAPER_RUN: требуется подтверждённая фаза калибровки")}
    {% endif %}
  {% else %}
    {action_raise_error("OPERATION: неизвестная операция " ~ op)}
  {% endif %}

# Блок 4: Runtime-флаг активного print-offset.
[gcode_macro _TREED_PRINT_AREA_CFG]
description: "TreeD: runtime-состояние print-offset"
variable_print_offset_enabled: 0
gcode:

# Блок 5: Включение print-offset с проверкой геометрии.
[gcode_macro _TREED_PRINT_OFFSET_ENABLE]
description: "SYSTEM: включить print-offset для рабочей зоны"
gcode:
  {% set toolhead = printer.toolhead %}
  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set print_min_x = geo.print_min_x|float %}
  {% set print_min_y = geo.print_min_y|float %}
  {% set print_offset_x = geo.print_offset_x|float %}
  {% set print_offset_y = geo.print_offset_y|float %}
  {% set print_size_x = geo.print_size_x|float %}
  {% set print_size_y = geo.print_size_y|float %}
  {% set raw_print_min_x = print_min_x + print_offset_x %}
  {% set raw_print_min_y = print_min_y + print_offset_y %}
  {% set raw_print_max_x = raw_print_min_x + print_size_x %}
  {% set raw_print_max_y = raw_print_min_y + print_size_y %}

  {% if print_size_x <= 0.0 %}
    {action_raise_error("_TREED_GEOMETRY_CFG: print_size_x должен быть > 0")}
  {% endif %}
  {% if print_size_y <= 0.0 %}
    {action_raise_error("_TREED_GEOMETRY_CFG: print_size_y должен быть > 0")}
  {% endif %}

  {% if raw_print_min_x < x_min or raw_print_max_x > x_max + 0.001 %}
    {action_raise_error("_TREED_GEOMETRY_CFG: X print-area выходит за механику")}
  {% endif %}
  {% if raw_print_min_y < y_min or raw_print_max_y > y_max + 0.001 %}
    {action_raise_error("_TREED_GEOMETRY_CFG: Y print-area выходит за механику")}
  {% endif %}

  SET_GCODE_OFFSET X={print_offset_x} Y={print_offset_y} MOVE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PRINT_AREA_CFG VARIABLE=print_offset_enabled VALUE=1

# Блок 6: Выключение print-offset перед сервисными raw-движениями.
[gcode_macro _TREED_PRINT_OFFSET_DISABLE]
description: "SYSTEM: выключить print-offset и перейти в raw coords"
gcode:
  SET_GCODE_OFFSET X=0 Y=0 MOVE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PRINT_AREA_CFG VARIABLE=print_offset_enabled VALUE=0

# Блок 7: Точка парковки PAUSE/M600 в raw coords.
[gcode_macro _TREED_PAUSE_PARK_CFG]
description: "TreeD: raw-парковка PAUSE/M600"
variable_park_x_raw: 122.5
variable_park_y_raw: 0.0
variable_park_y_raw_fallback: 30.0
gcode:

# Блок 8: Последнее runtime-значение idle_timeout.
[gcode_macro _TREED_IDLE_TIMEOUT_STATE]
variable_timeout: 0
gcode:

# Блок 9: Обертка штатного SET_IDLE_TIMEOUT.
[gcode_macro SET_IDLE_TIMEOUT]
description: "SYSTEM: TreeD wrapper for SET_IDLE_TIMEOUT"
rename_existing: SET_IDLE_TIMEOUT_BASE
gcode:
  {% if params.TIMEOUT is not defined %}
    {action_raise_error("SET_IDLE_TIMEOUT: требуется TIMEOUT")}
  {% endif %}
  {% set timeout = params.TIMEOUT|float %}
  SET_GCODE_VARIABLE MACRO=_TREED_IDLE_TIMEOUT_STATE VARIABLE=timeout VALUE={timeout}
  SET_IDLE_TIMEOUT_BASE {rawparams}

# Блок 10: Fail-fast проверка обязательного нагревателя стола.
[gcode_macro _TREED_REQUIRE_HEATER_BED]
description: "SYSTEM: fail-fast проверка heater_bed для V2 профиля"
gcode:
  {% if printer.heater_bed is not defined %}
    {action_raise_error("V2 profile error: heater_bed section is missing")}
  {% endif %}

# Блок 11: Обязательный Z-hop перед XY.
[gcode_macro _TREED_Z_HOP_BEFORE_XY]
description: "SYSTEM: обязательный Z-hop перед XY-движением"
variable_z_hop: 10.0
gcode:
  {% set fallback_z_hop = printer["gcode_macro _TREED_Z_HOP_BEFORE_XY"].z_hop|float %}

  {% if printer["gcode_macro _TREED_EDDY_Z0_CFG"] is defined %}
    {% set z_hop = printer["gcode_macro _TREED_EDDY_Z0_CFG"].z_hop|float %}
  {% else %}
    {% set z_hop = fallback_z_hop %}
  {% endif %}

  {% if z_hop <= 0.0 %}
    {action_raise_error("_TREED_Z_HOP_BEFORE_XY: z_hop должен быть положительным")}
  {% endif %}

  {% if "z" in printer.toolhead.homed_axes %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set target_z = current_z + z_hop %}
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% if target_z > z_max - 1.0 %}{% set target_z = z_max - 1.0 %}{% endif %}
    # У верхней границы уже есть зазор: не опускаем Z ради номинального hop.
    {% if target_z > current_z %}
      G91
      G1 Z{target_z - current_z} F1500
      G90
    {% endif %}
  {% else %}
    TREED_Z_HOME_BOTTOM
  {% endif %}

# Блок 12: Рабочий homing для старта печати.
[gcode_macro _TREED_HOME_ALL]
description: "SYSTEM: homing X/Y sensorless + рабочая Z-привязка"
gcode:
  # Единый full-homing через override G28:
  # снижает риск рассинхрона между отдельными XY/Z вызовами.
  G28
