# ==========================================
# БАЗОВЫЕ МАКРОСЫ ПЕЧАТИ — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Хранит общие state/config macro для печати, парковки, idle timeout и homing-helper.
# - Подключает print-offset к единой геометрии `_TREED_GEOMETRY_CFG`.
# Контур:
# - required: используется START_PRINT, PAUSE/RESUME/CANCEL и сервисными макросами.
# - raw/print: offset включается только для печатной зоны, сервисные движения идут в raw coords.

# Блок 1: Общие дефолты печати и камеры.
[gcode_macro _TREED_PRINT_DEFAULTS]
description: "TreeD: дефолты макросов печати и камеры"
variable_snapshot_interval: 120
gcode:

# Блок 2: Runtime-флаг активного print-offset.
[gcode_macro _TREED_PRINT_AREA_CFG]
description: "TreeD: runtime-состояние print-offset"
variable_print_offset_enabled: 0
gcode:

# Блок 3: Включение print-offset с проверкой геометрии.
[gcode_macro _TREED_PRINT_OFFSET_ENABLE]
description: "SYSTEM: включить print-offset для рабочей зоны"
gcode:
  {% set toolhead = printer.toolhead %}
  {% set x_min = toolhead.axis_minimum.x|float %}
  {% set y_min = toolhead.axis_minimum.y|float %}
  {% set x_max = toolhead.axis_maximum.x|float %}
  {% set y_max = toolhead.axis_maximum.y|float %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set print_min_x = geo.print_min_x|float %}
  {% set print_min_y = geo.print_min_y|float %}
  {% set print_offset_x = geo.print_offset_x|float %}
  {% set print_offset_y = geo.print_offset_y|float %}
  {% set print_size_x = geo.print_size_x|float %}
  {% set print_size_y = geo.print_size_y|float %}
  {% set raw_print_min_x = print_min_x + print_offset_x %}
  {% set raw_print_min_y = print_min_y + print_offset_y %}
  {% set raw_print_max_x = raw_print_min_x + print_size_x %}
  {% set raw_print_max_y = raw_print_min_y + print_size_y %}

  {% if print_size_x <= 0.0 %}
    {action_raise_error("_TREED_GEOMETRY_CFG: print_size_x должен быть > 0")}
  {% endif %}
  {% if print_size_y <= 0.0 %}
    {action_raise_error("_TREED_GEOMETRY_CFG: print_size_y должен быть > 0")}
  {% endif %}

  {% if raw_print_min_x < x_min or raw_print_max_x > x_max + 0.001 %}
    {action_raise_error("_TREED_GEOMETRY_CFG: X print-area выходит за механику")}
  {% endif %}
  {% if raw_print_min_y < y_min or raw_print_max_y > y_max + 0.001 %}
    {action_raise_error("_TREED_GEOMETRY_CFG: Y print-area выходит за механику")}
  {% endif %}

  SET_GCODE_OFFSET X={print_offset_x} Y={print_offset_y} MOVE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PRINT_AREA_CFG VARIABLE=print_offset_enabled VALUE=1

# Блок 4: Выключение print-offset перед сервисными raw-движениями.
[gcode_macro _TREED_PRINT_OFFSET_DISABLE]
description: "SYSTEM: выключить print-offset и перейти в raw coords"
gcode:
  SET_GCODE_OFFSET X=0 Y=0 MOVE=0
  SET_GCODE_VARIABLE MACRO=_TREED_PRINT_AREA_CFG VARIABLE=print_offset_enabled VALUE=0

# Блок 5: Точка парковки PAUSE/M600 в raw coords.
[gcode_macro _TREED_PAUSE_PARK_CFG]
description: "TreeD: raw-парковка PAUSE/M600"
variable_park_x_raw: 122.5
variable_park_y_raw: 0.0
variable_park_y_raw_fallback: 30.0
gcode:

# Блок 6: Последнее runtime-значение idle_timeout.
[gcode_macro _TREED_IDLE_TIMEOUT_STATE]
variable_timeout: 0
gcode:

# Блок 7: Обертка штатного SET_IDLE_TIMEOUT.
[gcode_macro SET_IDLE_TIMEOUT]
description: "SYSTEM: TreeD wrapper for SET_IDLE_TIMEOUT"
rename_existing: SET_IDLE_TIMEOUT_BASE
gcode:
  {% if params.TIMEOUT is not defined %}
    {action_raise_error("SET_IDLE_TIMEOUT: требуется TIMEOUT")}
  {% endif %}
  {% set timeout = params.TIMEOUT|float %}
  SET_GCODE_VARIABLE MACRO=_TREED_IDLE_TIMEOUT_STATE VARIABLE=timeout VALUE={timeout}
  SET_IDLE_TIMEOUT_BASE {rawparams}

# Блок 8: Fail-fast проверка обязательного нагревателя стола.
[gcode_macro _TREED_REQUIRE_HEATER_BED]
description: "SYSTEM: fail-fast проверка heater_bed для V2 профиля"
gcode:
  {% if printer.heater_bed is not defined %}
    {action_raise_error("V2 profile error: heater_bed section is missing")}
  {% endif %}

# Блок 9: Безопасный Z-hop перед XY, только если Z уже известен.
[gcode_macro _TREED_Z_HOP_BEFORE_XY]
description: "SYSTEM: безопасный Z-hop перед XY-движением"
variable_z_hop: 10.0
gcode:
  {% set fallback_z_hop = printer["gcode_macro _TREED_Z_HOP_BEFORE_XY"].z_hop|float %}

  {% if printer["gcode_macro _TREED_EDDY_Z0_CFG"] is defined %}
    {% set z_hop = printer["gcode_macro _TREED_EDDY_Z0_CFG"].z_hop|float %}
  {% else %}
    {% set z_hop = fallback_z_hop %}
  {% endif %}

  G90

  {% if "z" in printer.toolhead.homed_axes %}
    {% if printer.toolhead.position.z|float < z_hop %}
      G1 Z{z_hop} F1500
    {% endif %}
  {% else %}
    RESPOND PREFIX="treed" MSG="Z-hop перед XY пропущен: Z еще не homed"
  {% endif %}

# Блок 10: Штатный X/Y homing через sensorless-контур.
[gcode_macro _TREED_HOME_XY_SENSORLESS]
description: "SYSTEM: штатный homing X/Y с Z-hop перед XY"
gcode:
  _TREED_Z_HOP_BEFORE_XY
  G28 X Y

# Блок 11: Рабочий homing для старта печати.
[gcode_macro _TREED_HOME_ALL]
description: "SYSTEM: homing X/Y sensorless + рабочая Z-привязка"
gcode:
  _TREED_HOME_XY_SENSORLESS
  TREED_Z_PARK_ZERO_EDDY
