# ==========================================
# КОНФИГ ПРОБНИКА И Z-HOMING — EDDY DUO (OPTIONAL)
# ==========================================
# Назначение:
# - Подключает BTT Eddy Duo как отдельный CAN MCU `eddy`.
# - Дает отдельный рабочий макрос поиска Z0 через Eddy после калибровки.
# - Оставляет штатный `G28 Z` в контуре sensorless Zmax-парковки.
# - Определяет базовый контур probe/bed_mesh для V2, когда Eddy включен.
# Контур:
# - optional: включается только при TREED_EDDY_ENABLED=1.
# - На этапе шага 1 пины/offset/mesh значения остаются шаблонными.

# Блок 1: CAN-MCU датчика Eddy Duo.
[mcu eddy]
canbus_uuid: 95485b93332a
canbus_interface: can0

# Блок 2: Диагностическая температура MCU Eddy.
[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

# Блок 3: Контур зондирования Eddy.
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 2.5
i2c_mcu: eddy
i2c_bus: i2c0f
# Эти смещения нужно откалибровать под фактический кронштейн датчика.
x_offset: 0.0
y_offset: 0.0

# Блок 4: Сетка стола под Eddy rapid scan.
[bed_mesh]
horizontal_move_z: 2
speed: 200
# Значения консервативные; после калибровки x/y-offset скорректировать при необходимости.
mesh_min: 20,20
mesh_max: 225,225
probe_count: 9,9
algorithm: bicubic
# scan_overshoot: 8

# Блок 5: Безопасный Z-homing в центре стола.
[safe_z_home]
home_xy_position: 122.5,122.5
z_hop: 10
z_hop_speed: 25
speed: 200

# Блок 6: Разрешаем ручное опускание Z для первичной калибровки Eddy.
[force_move]
enable_force_move: True

# Блок 7: Явные варианты Z-парковки.
[gcode_macro TREED_Z_PARK_MAX_SENSORLESS]
description: "TreeD: парковка стола вниз до Zmax через TMC5160 sensorless"
gcode:
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    _TREED_HOME_XY_SENSORLESS
  {% endif %}
  G28.1 Z

[gcode_macro TREED_Z_PARK_ZERO_EDDY]
description: "TreeD: поиск Z0 через Eddy"
gcode:
  {% set toolhead = printer.toolhead %}
  {% set x_center = (toolhead.axis_minimum.x|float + toolhead.axis_maximum.x|float) / 2.0 %}
  {% set y_center = (toolhead.axis_minimum.y|float + toolhead.axis_maximum.y|float) / 2.0 %}
  {% if "x" not in toolhead.homed_axes or "y" not in toolhead.homed_axes %}
    _TREED_HOME_XY_SENSORLESS
  {% endif %}
  G90
  G1 X{x_center} Y{y_center} F6000
  {% if "z" not in toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ toolhead.axis_maximum.z|float - 1.0 }
  {% endif %}
  PROBE
  SET_Z_FROM_PROBE

# Блок 8: Штатный G28 оставляет Z-home совместимым с UI и KlipperScreen.
[gcode_macro G28]
rename_existing: G28.1
gcode:
  {% set axes = rawparams|upper %}
  {% set home_all = not rawparams %}
  {% set has_axis = "X" in axes or "Y" in axes or "Z" in axes %}
  {% set home_x = home_all or "X" in axes %}
  {% set home_y = home_all or "Y" in axes %}
  {% set home_z = home_all or "Z" in axes %}
  {% if rawparams and not has_axis %}
    G28.1 {rawparams}
  {% else %}
    {% if home_x and home_y %}
      _TREED_HOME_XY_SENSORLESS
    {% else %}
      {% if home_x %}
        G28.1 X
      {% endif %}
      {% if home_y %}
        G28.1 Y
      {% endif %}
    {% endif %}
    {% if home_z %}
      TREED_Z_PARK_MAX_SENSORLESS
    {% endif %}
  {% endif %}

# Блок 9: Привязка высоты сопла к последнему измерению Eddy.
[gcode_macro SET_Z_FROM_PROBE]
gcode:
  {% set cf = printer.configfile.settings %}
  {% set current_z = printer.toolhead.position.z|float %}
  SET_KINEMATIC_POSITION Z={current_z - printer.probe.last_probe_position.z}
  G90
  G1 Z{cf.safe_z_home.z_hop}

# Блок 10: Совместимость с runtime Z-adjust без beta-offset логики.
[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False
variable_runtime_offset: 0
gcode:
  SET_GCODE_OFFSET_ORIG { rawparams }

# Блок 11: Ускоренная первичная калибровка Eddy без рабочего Z-home.
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  BED_MESH_CLEAR
  G28 X Y
  G90
  G1 X{ printer.toolhead.axis_maximum.x / 2 } Y{ printer.toolhead.axis_maximum.y / 2 } F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z - 1 }
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}
