# ==========================================
# КОНФИГ ПРОБНИКА И Z-HOMING — EDDY DUO (OPTIONAL)
# ==========================================
# Назначение:
# - Подключает BTT Eddy Duo как отдельный CAN MCU `eddy`.
# - Дает отдельный рабочий макрос поиска Z0 через Eddy после калибровки.
# - Оставляет штатный `G28 Z` в контуре sensorless Zmax-парковки.
# - Определяет базовый контур probe/bed_mesh для V2, когда Eddy включен.
# Контур:
# - optional: включается только при TREED_EDDY_ENABLED=1.
# - На этапе шага 1 пины/offset/mesh значения остаются шаблонными.

# Блок 1: CAN-MCU датчика Eddy Duo.
[mcu eddy]
canbus_uuid: 95485b93332a
canbus_interface: can0

# Блок 2: Диагностическая температура MCU Eddy.
[temperature_sensor _btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

# Блок 3: Контур зондирования Eddy.
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
# Эти смещения нужно откалибровать под фактический кронштейн датчика.
x_offset: 0.0
y_offset: -30.0
reg_drive_current: 15
# Дефолтная калибровочная кривая Eddy (репозиторная база, не зависит от SAVE_CONFIG).
calibrate =
  0.050000:3220839.082,0.090000:3220636.567,0.130000:3220435.084,
  0.170000:3220228.540,0.210000:3220037.469,0.250000:3219853.355,
  0.290000:3219659.237,0.330000:3219466.203,0.370000:3219272.331,
  0.410000:3219084.183,0.450000:3218925.657,0.490000:3218751.300,
  0.530000:3218583.437,0.570000:3218406.428,0.610000:3218247.561,
  0.650000:3218095.265,0.690000:3217932.019,0.730000:3217737.445,
  0.770000:3217554.739,0.810000:3217392.089,0.850000:3217243.248,
  0.890000:3217088.539,0.930000:3216940.319,0.970000:3216785.091,
  1.010000:3216644.280,1.050000:3216504.056,1.090000:3216367.576,
  1.130000:3216229.337,1.170000:3216088.128,1.210000:3215965.837,
  1.250000:3215832.663,1.290000:3215692.284,1.330000:3215559.852,
  1.370000:3215440.484,1.410000:3215307.661,1.450000:3215166.166,
  1.490000:3215014.652,1.530000:3214883.264,1.570000:3214752.046,
  1.610000:3214631.751,1.650000:3214511.264,1.690000:3214385.033,
  1.730000:3214272.503,1.770000:3214154.139,1.810000:3214070.682,
  1.850000:3213956.165,1.890000:3213844.889,1.930000:3213744.823,
  1.970000:3213634.939,2.010000:3213533.992,2.050000:3213429.406,
  2.090000:3213325.030,2.130000:3213215.873,2.170000:3213111.831,
  2.210000:3213015.101,2.250000:3212913.866,2.290000:3212818.287,
  2.330000:3212723.046,2.370000:3212632.869,2.410000:3212540.147,
  2.450000:3212454.075,2.490000:3212372.794,2.530000:3212292.776,
  2.570000:3212198.699,2.610000:3212125.207,2.650000:3212047.992,
  2.690000:3211977.254,2.730000:3211889.964,2.770000:3211803.791,
  2.810000:3211727.212,2.850000:3211647.175,2.890000:3211573.051,
  2.930000:3211504.209,2.970000:3211426.400,3.010000:3211345.692,
  3.050000:3211266.918,3.090000:3211192.877,3.130000:3211121.421,
  3.170000:3211046.791,3.210000:3210974.908,3.250000:3210911.927,
  3.290000:3210843.240,3.330000:3210770.765,3.370000:3210711.284,
  3.410000:3210651.304,3.450000:3210579.742,3.490000:3210502.519,
  3.530000:3210438.448

# Блок 4: Сетка стола под Eddy rapid scan.
[bed_mesh]
horizontal_move_z: 2
speed: 200
# Значения консервативные; после калибровки x/y-offset скорректировать при необходимости.
mesh_min: 20,20
mesh_max: 225,225
probe_count: 9,9
algorithm: bicubic
# scan_overshoot: 8

# Блок 5: Перехват штатного G28 Z.
# В Eddy-primary режиме G28 Z не идёт в нижний Zmax,
# а делает Eddy-probe и выставляет координатный Z0.
[homing_override]
axes: z
gcode:
  _TREED_EDDY_HOME_Z

# Блок 6: Разрешаем ручное опускание Z для первичной калибровки Eddy.
[force_move]
enable_force_move: True

# Блок 7: Настройки Eddy-Z0.
[gcode_macro _TREED_EDDY_Z0_CFG]
description: "TreeD: настройки координатной привязки Eddy Z0"
# Твоя текущая разница: правильный физический Z0 сейчас отображается как Z=-0.300.
# Чтобы эта же физическая точка стала Z=0, добавляем +0.300 к Eddy-коррекции.
variable_z0_adjust: 0.300
variable_home_x: 122.5
variable_home_y: 122.5
variable_z_hop: 10.0
variable_probe_start_z: 254.0
gcode:

#[gcode_macro _TREED_EDDY_HOME_Z]
description: "SYSTEM: штатный Z-home через Eddy с координатной коррекцией Z0"
gcode:
  {% set cfg = printer["gcode_macro _TREED_EDDY_Z0_CFG"] %}
  {% set z_hop = cfg.z_hop|float %}

  # X/Y должны быть известны, потому что Eddy надо поставить в центр стола.
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    _TREED_HOME_XY_SENSORLES
  {% endif %}

  G90

  # Возвращаем Z-hop перед перемещением по XY.
  # Если Z уже известен — обычный безопасный подъём.
  {% if "z" in printer.toolhead.homed_axes %}
    {% if printer.toolhead.position.z|float < z_hop %}
      G1 Z{z_hop} F1500
    {% endif %}
  {% else %}
    # Если Z не известен, задаём временный ноль и отъезжаем от стола.
    # Это не сохраняется и не является калибровкой Z0.
    SET_KINEMATIC_POSITION Z=0
    G1 Z{z_hop} F1500
  {% endif %}

  G1 X{cfg.home_x|float} Y{cfg.home_y|float} F12000

  # Перед Eddy-probe задаём временную координату, чтобы PROBE мог работать.
  SET_KINEMATIC_POSITION Z={cfg.probe_start_z|float}

  PROBE
  SET_Z_FROM_PROBE

# Блок 9: Совместимость с runtime Z-adjust без beta-offset логики.
[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False
variable_runtime_offset: 0
gcode:
  SET_GCODE_OFFSET_ORIG { rawparams }

# Блок 10: Ускоренная первичная калибровка Eddy без рабочего Z-home.
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  BED_MESH_CLEAR
  _TREED_HOME_XY_SENSORLESS
  G90
  G1 X{ printer.toolhead.axis_maximum.x / 2 } Y{ printer.toolhead.axis_maximum.y / 2 } F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z - 1 }
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}
