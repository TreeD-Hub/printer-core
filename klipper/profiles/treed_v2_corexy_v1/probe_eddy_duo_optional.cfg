# ==========================================
# КОНФИГ ПРОБНИКА И Z-HOMING — EDDY DUO (OPTIONAL)
# ==========================================
# Назначение:
# - Подключает BTT Eddy Duo как отдельный CAN MCU `eddy`.
# - Дает отдельный рабочий макрос поиска Z0 через Eddy после калибровки.
# - Перехватывает штатный `G28 Z` и ведёт Z0 через Eddy.
# - Определяет базовый контур probe/bed_mesh для V2, когда Eddy включен.
# Контур:
# - optional: включается только при TREED_EDDY_ENABLED=1.
# - На этапе шага 1 пины/offset/mesh значения остаются шаблонными.

# Блок 1: CAN-MCU датчика Eddy Duo.
[mcu eddy]
canbus_uuid: 95485b93332a
canbus_interface: can0

# Блок 2: Диагностическая температура MCU Eddy.
[temperature_sensor _btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

# Блок 3: Контур зондирования Eddy.
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
# Эти смещения нужно откалибровать под фактический кронштейн датчика.
x_offset: 0.0
y_offset: -30.0
reg_drive_current: 15
# Дефолтная калибровочная кривая Eddy (репозиторная база, не зависит от SAVE_CONFIG).
calibrate =
  0.050000:3220839.082,0.090000:3220636.567,0.130000:3220435.084,
  0.170000:3220228.540,0.210000:3220037.469,0.250000:3219853.355,
  0.290000:3219659.237,0.330000:3219466.203,0.370000:3219272.331,
  0.410000:3219084.183,0.450000:3218925.657,0.490000:3218751.300,
  0.530000:3218583.437,0.570000:3218406.428,0.610000:3218247.561,
  0.650000:3218095.265,0.690000:3217932.019,0.730000:3217737.445,
  0.770000:3217554.739,0.810000:3217392.089,0.850000:3217243.248,
  0.890000:3217088.539,0.930000:3216940.319,0.970000:3216785.091,
  1.010000:3216644.280,1.050000:3216504.056,1.090000:3216367.576,
  1.130000:3216229.337,1.170000:3216088.128,1.210000:3215965.837,
  1.250000:3215832.663,1.290000:3215692.284,1.330000:3215559.852,
  1.370000:3215440.484,1.410000:3215307.661,1.450000:3215166.166,
  1.490000:3215014.652,1.530000:3214883.264,1.570000:3214752.046,
  1.610000:3214631.751,1.650000:3214511.264,1.690000:3214385.033,
  1.730000:3214272.503,1.770000:3214154.139,1.810000:3214070.682,
  1.850000:3213956.165,1.890000:3213844.889,1.930000:3213744.823,
  1.970000:3213634.939,2.010000:3213533.992,2.050000:3213429.406,
  2.090000:3213325.030,2.130000:3213215.873,2.170000:3213111.831,
  2.210000:3213015.101,2.250000:3212913.866,2.290000:3212818.287,
  2.330000:3212723.046,2.370000:3212632.869,2.410000:3212540.147,
  2.450000:3212454.075,2.490000:3212372.794,2.530000:3212292.776,
  2.570000:3212198.699,2.610000:3212125.207,2.650000:3212047.992,
  2.690000:3211977.254,2.730000:3211889.964,2.770000:3211803.791,
  2.810000:3211727.212,2.850000:3211647.175,2.890000:3211573.051,
  2.930000:3211504.209,2.970000:3211426.400,3.010000:3211345.692,
  3.050000:3211266.918,3.090000:3211192.877,3.130000:3211121.421,
  3.170000:3211046.791,3.210000:3210974.908,3.250000:3210911.927,
  3.290000:3210843.240,3.330000:3210770.765,3.370000:3210711.284,
  3.410000:3210651.304,3.450000:3210579.742,3.490000:3210502.519,
  3.530000:3210438.448

[bed_mesh]
horizontal_move_z: 2
speed: 120
mesh_min: 25,70
mesh_max: 220,205
probe_count: 7,7
algorithm: bicubic
# zero_reference_position не задаём статически.

# Блок 5: Перехват штатного G28 Z.
# В Eddy-primary режиме G28 Z не идёт в нижний Zmax,
# а делает Eddy-probe и выставляет координатный Z0.
[homing_override]
axes: z
gcode:
  _TREED_EDDY_HOME_Z

# Блок 6: Разрешаем ручное опускание Z для первичной калибровки Eddy.
[force_move]
enable_force_move: True

# Блок 7: Настройки Eddy-Z0.
[gcode_macro _TREED_EDDY_Z0_CFG]
description: "TreeD: настройки координатной привязки Eddy Z0"
# Твоя текущая разница: правильный физический Z0 сейчас отображается как Z=-0.300.
# Чтобы эта же физическая точка стала Z=0, добавляем +0.300 к Eddy-коррекции.
variable_z0_adjust: 0.300
variable_z_hop: 10.0
variable_probe_start_z: 254.0
gcode:

# Блок 8: Фактическая область пластины.
[gcode_macro _TREED_EDDY_BED_CFG]
description: "TreeD: фактическая область пластины в координатах Eddy/probe"

# Координата верхнего левого угла синей зоны в системе Klipper/probe.
# По твоему описанию верхний левый угол механики: 245,245.
# Если синяя зона начинается от верхнего края, Y-старт = 245.
variable_bed_origin_x: 245.0
variable_bed_origin_y: 245.0

# Размер синей зоны.
variable_bed_size_x: 245.0
variable_bed_size_y: 180.0

# Направление роста области от origin.
# Для твоей схемы Y идет от верхнего края вниз, то есть в минус от 245 к 65.
variable_bed_dir_x: -1.0
variable_bed_dir_y: -1.0
gcode:

[gcode_macro _TREED_EDDY_HOME_Z]
description: "SYSTEM: штатный Z-home через Eddy с координатной коррекцией Z0"
gcode:
  {% set cfg = printer["gcode_macro _TREED_EDDY_Z0_CFG"] %}
  {% set z_hop = cfg.z_hop|float %}

  # X/Y должны быть известны, потому что Eddy надо поставить в центр стола.
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    _TREED_HOME_XY_SENSORLESS
  {% endif %}

  G90

  # Возвращаем Z-hop перед перемещением по XY.
  # Если Z уже известен — обычный безопасный подъём.
  {% if "z" in printer.toolhead.homed_axes %}
    {% if printer.toolhead.position.z|float < z_hop %}
      G1 Z{z_hop} F1500
    {% endif %}
  {% else %}
    # Если Z не известен, задаём временный ноль и отъезжаем от стола.
    # Это не сохраняется и не является калибровкой Z0.
    SET_KINEMATIC_POSITION Z=0
    G1 Z{z_hop} F1500
  {% endif %}

  {% set th = printer.toolhead %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}

  {% set x_min = th.axis_minimum.x|float %}
  {% set y_min = th.axis_minimum.y|float %}
  {% set x_max = th.axis_maximum.x|float %}
  {% set y_max = th.axis_maximum.y|float %}

  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}

  {% set bed = printer["gcode_macro _TREED_EDDY_BED_CFG"] %}

  # Центр фактической пластины в координатах Eddy/probe.
  # Считаем от логического origin синей зоны, а не от механической области.
  {% set zero_probe_x = bed.bed_origin_x|float + (bed.bed_size_x|float * bed.bed_dir_x|float / 2.0) %}
  {% set zero_probe_y = bed.bed_origin_y|float + (bed.bed_size_y|float * bed.bed_dir_y|float / 2.0) %}
  
  # Но двигать надо сопло/ПГ, поэтому компенсируем offset датчика.
  {% set zero_tool_x = zero_probe_x - probe_x_offset %}
  {% set zero_tool_y = zero_probe_y - probe_y_offset %}

  # Защита: центр Eddy не должен требовать выхода сопла/ПГ за механику.
  {% if zero_tool_x < x_min or zero_tool_x > x_max %}
    {action_raise_error("TREED_EDDY_HOME_Z: центр Eddy по X требует выхода сопла за пределы механики")}
  {% endif %}
  {% if zero_tool_y < y_min or zero_tool_y > y_max %}
    {action_raise_error("TREED_EDDY_HOME_Z: центр Eddy по Y требует выхода сопла за пределы механики")}
  {% endif %}

  RESPOND PREFIX="treed" MSG="Eddy Z0: probe=({zero_probe_x},{zero_probe_y}) tool=({zero_tool_x},{zero_tool_y}) offset=({probe_x_offset},{probe_y_offset})"

  G1 X{zero_tool_x} Y{zero_tool_y} F12000

  # Перед Eddy-probe задаём временную координату, чтобы PROBE мог работать.
  SET_KINEMATIC_POSITION Z={cfg.probe_start_z|float}

  PROBE
  SET_Z_FROM_PROBE

[gcode_macro TREED_Z_PARK_ZERO_EDDY]
description: "TreeD: поиск рабочего Z0 через Eddy"
gcode:
  _TREED_EDDY_HOME_Z

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
description: "SYSTEM: применить координатную коррекцию по последнему Eddy PROBE"
gcode:
  {% set cfg = printer["gcode_macro _TREED_EDDY_Z0_CFG"] %}
  {% set z = printer.toolhead.position.z|float %}
  {% set probe_z = printer.probe.last_probe_position.z|float %}
  {% set z0_adjust = cfg.z0_adjust|float %}
  SET_KINEMATIC_POSITION Z={z - probe_z + z0_adjust}

[gcode_macro SET_Z_FROM_PROBE]
description: "SYSTEM: уточнить Z0 через Eddy после PROBE"
gcode:
  _RELOAD_Z_OFFSET_FROM_PROBE
  G90
  G1 Z{printer["gcode_macro _TREED_EDDY_Z0_CFG"].z_hop|float} F1500

# Блок 9: Динамическая карта стола Eddy.
[gcode_macro _TREED_EDDY_MESH_CFG]
description: "TreeD: параметры динамической карты стола Eddy"
variable_toolhead_width_x: 45.0
variable_toolhead_margin_x: 2.5
variable_toolhead_margin_y_front: 10.0
variable_toolhead_margin_y_back: 10.0
variable_bed_margin: 5.0
variable_probe_count_x: 7
variable_probe_count_y: 7
variable_horizontal_move_z: 2.0
variable_speed: 120

# Качество измерения точки.
# Работает для METHOD=automatic.
variable_samples: 3
variable_samples_result: "median"
variable_samples_tolerance: 0.050
variable_samples_tolerance_retries: 2
variable_sample_retract_dist: 0.5
variable_lift_speed: 10.0
gcode:

[gcode_macro TREED_BED_MESH_CALIBRATE_EDDY]
description: "TreeD: bed mesh через Eddy с учётом offset датчика и ширины ПГ"
gcode:
  {% set cfg = printer["gcode_macro _TREED_EDDY_MESH_CFG"] %}
  {% set th = printer.toolhead %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}

  {% set x_min = th.axis_minimum.x|float %}
  {% set y_min = th.axis_minimum.y|float %}
  {% set x_max = th.axis_maximum.x|float %}
  {% set y_max = th.axis_maximum.y|float %}

  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}

  {% set half_head_x = cfg.toolhead_width_x|float / 2.0 %}
  {% set bed_margin = cfg.bed_margin|float %}

  {% set bed = printer["gcode_macro _TREED_EDDY_BED_CFG"] %}

  # Границы синей зоны в координатах Eddy/probe.
  {% set bed_x_a = bed.bed_origin_x|float %}
  {% set bed_x_b = bed.bed_origin_x|float + bed.bed_size_x|float * bed.bed_dir_x|float %}
  {% set bed_y_a = bed.bed_origin_y|float %}
  {% set bed_y_b = bed.bed_origin_y|float + bed.bed_size_y|float * bed.bed_dir_y|float %}

  {% set bed_x_min = [bed_x_a, bed_x_b]|min %}
  {% set bed_x_max = [bed_x_a, bed_x_b]|max %}
  {% set bed_y_min = [bed_y_a, bed_y_b]|min %}
  {% set bed_y_max = [bed_y_a, bed_y_b]|max %}

  # 1) Фактическая область пластины в координатах Eddy/probe.
  {% set probe_x_min_bed = bed_x_min + bed_margin %}
  {% set probe_x_max_bed = bed_x_max - bed_margin %}
  {% set probe_y_min_bed = bed_y_min + bed_margin %}
  {% set probe_y_max_bed = bed_y_max - bed_margin %}

  # 2) Безопасная область движения сопла/ПГ с учетом габарита головы.
  {% set tool_x_min_head = x_min + half_head_x + cfg.toolhead_margin_x|float %}
  {% set tool_x_max_head = x_max - half_head_x - cfg.toolhead_margin_x|float %}
  {% set tool_y_min_head = y_min + cfg.toolhead_margin_y_front|float %}
  {% set tool_y_max_head = y_max - cfg.toolhead_margin_y_back|float %}

  # 3) Переводим безопасную область сопла/ПГ в координаты Eddy/probe.
  # probe = tool + offset.
  {% set probe_x_min_head = tool_x_min_head + probe_x_offset %}
  {% set probe_x_max_head = tool_x_max_head + probe_x_offset %}
  {% set probe_y_min_head = tool_y_min_head + probe_y_offset %}
  {% set probe_y_max_head = tool_y_max_head + probe_y_offset %}

  # 4) Итоговая mesh-область в координатах Eddy/probe:
  # Eddy остается над пластиной, а сопло/ПГ не выходит за безопасную механику.
  {% set mesh_min_x = [probe_x_min_bed, probe_x_min_head]|max %}
  {% set mesh_max_x = [probe_x_max_bed, probe_x_max_head]|min %}
  {% set mesh_min_y = [probe_y_min_bed, probe_y_min_head]|max %}
  {% set mesh_max_y = [probe_y_max_bed, probe_y_max_head]|min %}

  {% if mesh_min_x >= mesh_max_x %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: некорректная X-область mesh после учета пластины, ПГ и Eddy offset")}
  {% endif %}
  {% if mesh_min_y >= mesh_max_y %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: некорректная Y-область mesh после учета пластины, ПГ и Eddy offset")}
  {% endif %}

  {% set profile = params.PROFILE|default("eddy_test") %}
  {% set method = params.METHOD|default("automatic")|lower %}
  {% set probe_count = params.PROBE_COUNT|default(cfg.probe_count_x|int ~ "," ~ cfg.probe_count_y|int) %}
  {% set horizontal_move_z = params.HORIZONTAL_MOVE_Z|default(cfg.horizontal_move_z|float) %}

  {% set samples = params.SAMPLES|default(cfg.samples|int) %}
  {% set samples_result = params.SAMPLES_RESULT|default(cfg.samples_result|string) %}
  {% set samples_tolerance = params.SAMPLES_TOLERANCE|default(cfg.samples_tolerance|float) %}
  {% set samples_tolerance_retries = params.SAMPLES_TOLERANCE_RETRIES|default(cfg.samples_tolerance_retries|int) %}
  {% set sample_retract_dist = params.SAMPLE_RETRACT_DIST|default(cfg.sample_retract_dist|float) %}
  {% set lift_speed = params.LIFT_SPEED|default(cfg.lift_speed|float) %}

  {% if method in ["scan", "rapid_scan"] and samples|int > 1 %}
    {action_raise_error("TREED_BED_MESH_CALIBRATE_EDDY: SAMPLES не применяется к METHOD=scan/rapid_scan. Для нескольких измерений в точке используй METHOD=automatic.")}
  {% endif %}

  RESPOND PREFIX="treed" MSG="Eddy mesh: method={method} samples={samples} result={samples_result} tolerance={samples_tolerance} retries={samples_tolerance_retries} probe_mesh=({mesh_min_x},{mesh_min_y})..({mesh_max_x},{mesh_max_y}) probe_bed=({probe_x_min_bed},{probe_y_min_bed})..({probe_x_max_bed},{probe_y_max_bed}) probe_head=({probe_x_min_head},{probe_y_min_head})..({probe_x_max_head},{probe_y_max_head}) tool_head=({tool_x_min_head},{tool_y_min_head})..({tool_x_max_head},{tool_y_max_head}) offset=({probe_x_offset},{probe_y_offset}) head_width_x={cfg.toolhead_width_x|float}"

  BED_MESH_CLEAR
  G28
  BED_MESH_CALIBRATE PROFILE={profile} METHOD={method} MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} PROBE_COUNT={probe_count} HORIZONTAL_MOVE_Z={horizontal_move_z} SAMPLES={samples} SAMPLES_RESULT={samples_result} SAMPLES_TOLERANCE={samples_tolerance} SAMPLES_TOLERANCE_RETRIES={samples_tolerance_retries} SAMPLE_RETRACT_DIST={sample_retract_dist} LIFT_SPEED={lift_speed}

# Блок 10: Ускоренная первичная калибровка Eddy без рабочего Z-home.
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  {% set th = printer.toolhead %}
  {% set probe_cfg = printer.configfile.settings["probe_eddy_current btt_eddy"] %}

  {% set x_min = th.axis_minimum.x|float %}
  {% set y_min = th.axis_minimum.y|float %}
  {% set x_max = th.axis_maximum.x|float %}
  {% set y_max = th.axis_maximum.y|float %}

  {% set probe_x_offset = probe_cfg.x_offset|float %}
  {% set probe_y_offset = probe_cfg.y_offset|float %}

  {% set bed = printer["gcode_macro _TREED_EDDY_BED_CFG"] %}

  # Центр фактической пластины в координатах Eddy/probe.
  {% set center_probe_x = bed.bed_origin_x|float + (bed.bed_size_x|float * bed.bed_dir_x|float / 2.0) %}
  {% set center_probe_y = bed.bed_origin_y|float + (bed.bed_size_y|float * bed.bed_dir_y|float / 2.0) %}

  {% set center_tool_x = center_probe_x - probe_x_offset %}
  {% set center_tool_y = center_probe_y - probe_y_offset %}

  BED_MESH_CLEAR
  _TREED_HOME_XY_SENSORLESS
  G90

  RESPOND PREFIX="treed" MSG="Eddy calibrate: probe_center=({center_probe_x},{center_probe_y}) tool=({center_tool_x},{center_tool_y}) offset=({probe_x_offset},{probe_y_offset})"

  G1 X{center_tool_x} Y{center_tool_y} F6000

  SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z - 1 }

  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}