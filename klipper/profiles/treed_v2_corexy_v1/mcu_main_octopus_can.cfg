# ==========================================
# КОНФИГ MAIN MCU — OCTOPUS PRO CAN
# ==========================================
# Назначение:
# - Подключает основную плату Octopus Pro к host по CAN.
# - Строки `canbus_uuid` и `canbus_interface` управляются шагом loader/steps/klipper-profiles.sh.
# Контур:
# - required для V2-контрура (без main MCU Klipper не стартует).

[mcu]
canbus_uuid: d372e54bf965
canbus_interface: can0
restart_method: command
