# ==========================================
# КОНФИГ MAIN MCU — OCTOPUS PRO CAN
# ==========================================
# Назначение:
# - Подключает основную плату Octopus Pro к host по CAN.
# - Строки `canbus_uuid` и `canbus_interface` задаются репозиторием (loader их не переписывает).
# Контур:
# - required для V2-контрура (без main MCU Klipper не стартует).

# Блок 1: Основная плата Octopus Pro как CAN MCU.
[mcu]
canbus_uuid: d372e54bf965
canbus_interface: can0
