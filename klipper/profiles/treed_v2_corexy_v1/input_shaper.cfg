# ==========================================
# INPUT SHAPER — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Резонансная компенсация по X/Y.
#
# Важно:
# - Значения частот должны приходить из ADXL-калибровки.
# - shaper_freq_x/y: 0 отключает компенсацию по соответствующей оси.
# - Этот блок не зависит от Octopus Pro.

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 71.0

shaper_type_y: mzv
shaper_freq_y: 49.6

damping_ratio_x: 0.10
damping_ratio_y: 0.10