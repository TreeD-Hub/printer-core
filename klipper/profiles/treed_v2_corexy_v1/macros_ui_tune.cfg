# ==========================================
# UI RUNTIME TUNE CONTRACT — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Дает TreeD Shell публичные TREED_UI_* команды для live-тюнинга печати.
# - Прячет raw G-code за проверенными параметрами и явными диапазонами.
# - Хранит минимальное UI-состояние, которого нет в штатных Klipper-объектах.
# Контур:
# - public/ui: команды вызывает UI через Moonraker `printer.gcode.script`.
# - runtime-only: команды разрешены только во время printing/paused.

# Блок 1: Состояние UI-контракта, доступное через Moonraker printer objects.
[gcode_macro _TREED_UI_TUNE_STATE]
description: "TreeD UI: runtime tune state surface"
variable_contract_version: "1.0"
variable_applied_babystep: 0.0
variable_babystep_total_min: -1.0
variable_babystep_total_max: 1.0
gcode:
  G4 P0

# Блок 2: Runtime speed factor через штатный M220.
[gcode_macro TREED_UI_SET_SPEED_FACTOR]
description: "TreeD UI: set live speed factor percent"
gcode:
  {% set MIN_PERCENT = 10.0 %}
  {% set MAX_PERCENT = 300.0 %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state not in ["printing", "paused"] and is_paused != 1 %}
    {action_raise_error("TREED_UI_SET_SPEED_FACTOR: разрешено только во время printing/paused")}
  {% endif %}
  {% if params.PERCENT is not defined %}
    {action_raise_error("TREED_UI_SET_SPEED_FACTOR: требуется PERCENT")}
  {% endif %}

  {% set percent = params.PERCENT|float %}
  {% if percent < MIN_PERCENT or percent > MAX_PERCENT %}
    {action_raise_error("TREED_UI_SET_SPEED_FACTOR: PERCENT вне диапазона %.0f..%.0f" % (MIN_PERCENT, MAX_PERCENT))}
  {% endif %}

  M220 S{percent}
  RESPOND PREFIX="treed_ui" MSG="speed_factor_percent={percent}"

# Блок 3: Runtime flow/extrude factor через штатный M221.
