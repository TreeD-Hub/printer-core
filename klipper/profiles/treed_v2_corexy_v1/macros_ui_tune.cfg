  RESPOND PREFIX="treed_ui" MSG="flow_factor_percent={percent}"

# Блок 4: Runtime acceleration limit через SET_VELOCITY_LIMIT.
[gcode_macro TREED_UI_SET_ACCEL]
description: "TreeD UI: set live acceleration limit"
gcode:
  {% set MIN_ACCEL = 500.0 %}
  {% set MAX_ACCEL = printer.configfile.settings.printer.max_accel|float %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state not in ["printing", "paused"] and is_paused != 1 %}
    {action_raise_error("TREED_UI_SET_ACCEL: разрешено только во время printing/paused")}
  {% endif %}
  {% if params.ACCEL is not defined %}
    {action_raise_error("TREED_UI_SET_ACCEL: требуется ACCEL")}
  {% endif %}

  {% set accel = params.ACCEL|float %}
  {% if accel < MIN_ACCEL or accel > MAX_ACCEL %}
    {action_raise_error("TREED_UI_SET_ACCEL: ACCEL вне диапазона %.0f..%.0f" % (MIN_ACCEL, MAX_ACCEL))}
  {% endif %}

  SET_VELOCITY_LIMIT ACCEL={accel}
  RESPOND PREFIX="treed_ui" MSG="max_accel={accel}"

# Блок 5: Runtime pressure advance для активного экструдера.
[gcode_macro TREED_UI_SET_PRESSURE_ADVANCE]
description: "TreeD UI: set live pressure advance"
gcode:
  {% set MIN_ADVANCE = 0.0 %}
  {% set MAX_ADVANCE = 0.20 %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state not in ["printing", "paused"] and is_paused != 1 %}
    {action_raise_error("TREED_UI_SET_PRESSURE_ADVANCE: разрешено только во время printing/paused")}
  {% endif %}
  {% if params.ADVANCE is not defined %}
    {action_raise_error("TREED_UI_SET_PRESSURE_ADVANCE: требуется ADVANCE")}
  {% endif %}

  {% set advance = params.ADVANCE|float %}
  {% if advance < MIN_ADVANCE or advance > MAX_ADVANCE %}
    {action_raise_error("TREED_UI_SET_PRESSURE_ADVANCE: ADVANCE вне диапазона %.3f..%.3f" % (MIN_ADVANCE, MAX_ADVANCE))}
  {% endif %}

  SET_PRESSURE_ADVANCE ADVANCE={advance}
  RESPOND PREFIX="treed_ui" MSG="pressure_advance={advance}"

# Блок 6: Runtime firmware retraction length.
[gcode_macro TREED_UI_SET_RETRACTION]
description: "TreeD UI: set live firmware retraction length"
gcode:
  {% set MIN_RETRACT = 0.0 %}
  {% set MAX_RETRACT = 5.0 %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state not in ["printing", "paused"] and is_paused != 1 %}
    {action_raise_error("TREED_UI_SET_RETRACTION: разрешено только во время printing/paused")}
  {% endif %}
  {% if params.RETRACT_LENGTH is not defined %}
    {action_raise_error("TREED_UI_SET_RETRACTION: требуется RETRACT_LENGTH")}
  {% endif %}
  {% if printer.firmware_retraction is not defined %}
    {action_raise_error("TREED_UI_SET_RETRACTION: [firmware_retraction] не включен")}
  {% endif %}

  {% set retract_length = params.RETRACT_LENGTH|float %}
  {% if retract_length < MIN_RETRACT or retract_length > MAX_RETRACT %}
    {action_raise_error("TREED_UI_SET_RETRACTION: RETRACT_LENGTH вне диапазона %.1f..%.1f" % (MIN_RETRACT, MAX_RETRACT))}
  {% endif %}

  SET_RETRACTION RETRACT_LENGTH={retract_length}
  RESPOND PREFIX="treed_ui" MSG="retract_length={retract_length}"

# Блок 7: Runtime Z babystep с накопленным UI-счетчиком.
[gcode_macro TREED_UI_BABYSTEP]
description: "TreeD UI: apply live Z babystep delta"
gcode:
  {% set MIN_DELTA = -0.05 %}
  {% set MAX_DELTA = 0.05 %}
  {% set print_state = printer.print_stats.state|default("unknown")|lower %}
  {% set is_paused = 0 %}
  {% if printer.pause_resume is defined %}
    {% set is_paused = printer.pause_resume.is_paused|int %}
  {% endif %}

  {% if print_state not in ["printing", "paused"] and is_paused != 1 %}
    {action_raise_error("TREED_UI_BABYSTEP: разрешено только во время printing/paused")}
  {% endif %}
  {% if params.DELTA is not defined %}
    {action_raise_error("TREED_UI_BABYSTEP: требуется DELTA")}
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes %}
    {action_raise_error("TREED_UI_BABYSTEP: Z должен быть homed")}
  {% endif %}

  {% set delta = params.DELTA|float %}
  {% if delta < MIN_DELTA or delta > MAX_DELTA %}
    {action_raise_error("TREED_UI_BABYSTEP: DELTA вне диапазона %.3f..%.3f" % (MIN_DELTA, MAX_DELTA))}
  {% endif %}

  {% set st = printer["gcode_macro _TREED_UI_TUNE_STATE"] %}
  {% set next_applied = st.applied_babystep|float + delta %}
  {% if next_applied < st.babystep_total_min|float or next_applied > st.babystep_total_max|float %}
    {action_raise_error("TREED_UI_BABYSTEP: applied_babystep выйдет за диапазон %.1f..%.1f" % (st.babystep_total_min|float, st.babystep_total_max|float))}
  {% endif %}

  SET_GCODE_OFFSET Z_ADJUST={delta} MOVE=1 MOVE_SPEED=5
  SET_GCODE_VARIABLE MACRO=_TREED_UI_TUNE_STATE VARIABLE=applied_babystep VALUE={next_applied}
  RESPOND PREFIX="treed_ui" MSG="babystep_delta={delta} applied_babystep={next_applied}"

# Блок 8: Алиас для UI, где термин Z-offset понятнее babystep.
[gcode_macro TREED_UI_ADJUST_Z_OFFSET]
description: "TreeD UI: alias for TREED_UI_BABYSTEP"
gcode:
  {% if params.DELTA is not defined %}
    {action_raise_error("TREED_UI_ADJUST_Z_OFFSET: требуется DELTA")}
  {% endif %}
  TREED_UI_BABYSTEP DELTA={params.DELTA}
