# ==========================================
# БАЗОВЫЕ ПАРАМЕТРЫ ПРИНТЕРА — V2 COREXY
# ==========================================
# Назначение:
# - Описывает кинематику и базовые лимиты движения.
# - Используется как общий фундамент для всех модулей профиля.
# - Штатные пределы движения активного V2-профиля.
# Контур:
# - required: секция `[printer]` нужна для старта Klipper.

# Блок 1: Кинематика CoreXY и базовые лимиты движения.
[printer]
kinematics: corexy

# shortcut: временные лимиты для новых двигателей; вернуть после замены или проверки механики.
# max_velocity: 600        # прежний предел по XY, мм/с
# max_accel: 25000         # прежний предел по XY, мм/с^2
max_velocity: 300          # временная максимальная скорость по XY, мм/с
max_accel: 100000          # временное максимальное ускорение по XY, мм/с^2

# Ограничения рабочих перемещений по Z.
max_z_velocity: 60          # мм/с
max_z_accel: 1000           # мм/с^2

# Повороты/углы
square_corner_velocity: 9.0
