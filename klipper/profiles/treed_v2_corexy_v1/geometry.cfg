# ==========================================
# ГЕОМЕТРИЯ ПРИНТЕРА — V2 COREXY V1
# ==========================================
# Назначение:
# - Хранит единый source-of-truth для области печати, сервисной зоны и пластины Eddy.
# - Разделяет print coords слайсера и raw coords механики.
# Контур:
# - required: подключается до Eddy-контура и макросов печати.
# - runtime/local: локальные изменения размеров делаются через `local_overrides.cfg`.

# Блок 1: Единая геометрия рабочей области.
[gcode_macro _TREED_GEOMETRY_CFG]
description: "TreeD: единая геометрия принтера и пластины"

# Print coords: координаты, которые видит слайсер.
variable_print_min_x: 0.0
variable_print_min_y: 0.0
variable_print_size_x: 245.0
variable_print_size_y: 245.0

# Raw coords: смещение print coords внутри полной области перемещения.
variable_print_offset_x: 0.0
variable_print_offset_y: 0.0

# Eddy/probe coords: фактическая пластина в координатах датчика.
variable_bed_origin_x: 0.0
variable_bed_origin_y: 0.0
variable_bed_size_x: 245.0
variable_bed_size_y: 245.0
variable_bed_dir_x: 1.0
variable_bed_dir_y: 1.0

# Сервисная зона raw Y у передней кромки.
variable_service_margin_y: 1.0
gcode:
