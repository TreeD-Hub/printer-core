# ==========================================
# ГЕОМЕТРИЯ ПРИНТЕРА — V2 COREXY V1
# ==========================================
# Назначение:
# - Хранит зеркало полной области перемещения для макросов печати и UI.
# - Координаты печати совпадают с координатами механики без XY-смещения.
# Контур:
# - required: подключается до Eddy-контура и макросов печати.
# - runtime: `_TREED_PRINT_OFFSET_ENABLE` обновляет размеры из пределов X/Y.

# Блок 1: Единая геометрия рабочей области.
[gcode_macro _TREED_GEOMETRY_CFG]
description: "TreeD: единая геометрия принтера и пластины"

# Начальные значения профиля; источник пределов — `[stepper_x]` и `[stepper_y]`.
variable_print_min_x: 0.0
variable_print_min_y: 0.0
variable_print_size_x: 250.0
variable_print_size_y: 257.0

# Совместимость с потребителями геометрии: print-offset всегда равен нулю.
variable_print_offset_x: 0.0
variable_print_offset_y: 0.0

# Пластина совпадает с полной областью печати; scan area задаётся отдельно.
variable_bed_origin_x: 0.0
variable_bed_origin_y: 0.0
variable_bed_size_x: 250.0
variable_bed_size_y: 257.0
variable_bed_dir_x: 1.0
variable_bed_dir_y: 1.0

# Сервисная зона raw Y у передней кромки.
variable_service_margin_y: 1.0
gcode:
