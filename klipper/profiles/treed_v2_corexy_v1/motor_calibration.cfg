# TreeD motor measurement and opt-in XY current-table correction.
# Limits are deliberately below the printer motion limits and may be tuned
# after measuring the actual carriage clearance and ADXL signal.
[treed_motor_calibration]
xy_speeds: 15,25,35
z_speeds: 2,3
xy_accel: 500
z_accel: 30
xy_margin: 25
z_low: 25
z_high: 50
min_cruise_seconds: 0.6
