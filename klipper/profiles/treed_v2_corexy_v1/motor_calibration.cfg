# TreeD motor measurement and opt-in XY current-table correction.
# ADXL345 can verify the tuned H2 correction up to 200 mm/s on these diagonals.
[treed_motor_calibration]
xy_speeds: 100,150,200
z_speeds: 2,3
xy_accel: 15000
z_accel: 30
xy_margin: 25
z_low: 25
z_high: 50
min_cruise_seconds: 0.2
xy_settle_seconds: 0.15
