# ==========================================
# ФИКСИРОВАННЫЕ PARK/PURGE — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Паркует и очищает сопло в передней полосе print-area после adaptive mesh.
# - Не зависит от polygon-метаданных объектов.
# Контур:
# - required: print-offset уже включён, оси X/Y/Z homed.
# - safety: координаты ограничены _TREED_GEOMETRY_CFG и проверенной механикой.

# Блок 1: Настройки механики и расхода для калибровки на устройстве.
[gcode_macro _TREED_START_PURGE_CFG]
variable_park_height: 10.0
variable_heat_wait_height: 0.2
variable_purge_height: 0.2
variable_x_inset: 10.0
variable_y_inset: 5.0
variable_prime_length: 10.0
variable_segment_length: 10.0
variable_prime_width: 1.0
variable_line_width: 0.4
variable_prime_speed: 5.0
variable_fast_speed: 40.0
variable_slow_speed: 10.0
variable_line_spacing: 2.0
variable_break_distance: 10.0
variable_saved_pa: -1.0
gcode:
  G4 P0

# Блок 2: Общие границы двух линий; проверка не выполняет движения.
[gcode_macro _TREED_PURGE_VALIDATE]
description: "SYSTEM: проверка настроек park/purge до движения"
gcode:
  {% set cfg = printer["gcode_macro _TREED_START_PURGE_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set th = printer.toolhead %}
  {% if printer["gcode_macro _TREED_PRINT_AREA_CFG"].print_offset_enabled|int != 1 %}
    {action_raise_error("PURGE: нужен включённый print-offset")}
  {% endif %}
  {% set homed = th.homed_axes|lower %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    {action_raise_error("PURGE: требуются homed X/Y/Z")}
  {% endif %}
  {% for name in ["park_height", "heat_wait_height", "purge_height", "prime_length", "segment_length",
                 "prime_width", "line_width", "prime_speed", "fast_speed", "slow_speed", "line_spacing"] %}
    {% set value = cfg[name]|float(none) %}
    {% if value is none or value - value != 0 or value <= 0 %}
      {action_raise_error("PURGE: " ~ name ~ " должен быть конечным положительным числом")}
    {% endif %}
  {% endfor %}
  {% for name in ["x_inset", "y_inset", "break_distance"] %}
    {% set value = cfg[name]|float(none) %}
    {% if value is none or value - value != 0 or value < 0 %}
      {action_raise_error("PURGE: " ~ name ~ " должен быть конечным неотрицательным числом")}
    {% endif %}
  {% endfor %}
  {% set park_z = cfg.park_height|float %}
  {% set wait_z = cfg.heat_wait_height|float %}
  {% set purge_z = cfg.purge_height|float %}
  {% if park_z <= purge_z or park_z > th.axis_maximum.z|float or
        wait_z <= th.axis_minimum.z|float or wait_z > purge_z %}
    {action_raise_error("PURGE: неверные высоты перемещения, ожидания или линии")}
  {% endif %}
  {% set half_width = [cfg.prime_width|float, cfg.line_width|float]|max / 2.0 %}
  {% set line_len = cfg.prime_length|float + 3.0 * cfg.segment_length|float %}
  {% if cfg.prime_width|float < purge_z or cfg.line_width|float < purge_z or
        cfg.line_spacing|float <= 2.0 * half_width %}
    {action_raise_error("PURGE: ширина должна быть не меньше высоты, соседние линии не должны перекрываться")}
  {% endif %}
  {% set x_min = geo.print_min_x|float %}
  {% set y_min = geo.print_min_y|float %}
  {% set x_max = x_min + geo.print_size_x|float %}
  {% set y_max = y_min + geo.print_size_y|float %}
  {% set start_x = [x_min + cfg.x_inset|float, x_max - line_len - cfg.break_distance|float - half_width]|min %}
  {% set start_y = [y_min + cfg.y_inset|float, y_max - cfg.line_spacing|float - half_width]|min %}
  {% if start_x < x_min + half_width or start_y < y_min + half_width %}
    {action_raise_error("PURGE: две линии с заданной шириной и отходом не помещаются в print-area")}
  {% endif %}

# Блок 3: Парковка перед финальным нагревом в print coords.
[gcode_macro _TREED_SMART_PARK]
description: "SYSTEM: безопасная парковка перед финальным нагревом"
gcode:
  {% set cfg = printer["gcode_macro _TREED_START_PURGE_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set park_z = cfg.park_height|float %}
  {% set wait_z = cfg.heat_wait_height|float %}
  {% set purge_len = cfg.prime_length|float + 3.0 * cfg.segment_length|float %}
  {% set break_len = cfg.break_distance|float %}
  {% set half_width = [cfg.prime_width|float, cfg.line_width|float]|max / 2.0 %}
  {% set x_min = geo.print_min_x|float %}
  {% set y_min = geo.print_min_y|float %}
  {% set x_max = x_min + geo.print_size_x|float %}
  {% set y_max = y_min + geo.print_size_y|float %}
  {% set park_x = [x_min + cfg.x_inset|float, x_max - purge_len - break_len - half_width]|min %}
  {% set park_y = [y_min + cfg.y_inset|float, y_max - cfg.line_spacing|float - half_width]|min %}
  _TREED_PURGE_VALIDATE
  SAVE_GCODE_STATE NAME=TREED_SMART_PARK_STATE
  G90
  {% if pos.z|float < park_z %}
    G0 Z{park_z} F1500
  {% endif %}
  G0 X{park_x} Y{park_y} F6000
  # После безопасного XY-переезда ждём нагрев с зазором, без прижима к столу.
  G0 Z{wait_z} F1500
  RESTORE_GCODE_STATE NAME=TREED_SMART_PARK_STATE MOVE=0

# Блок 4: Две одинаковые линии без PA и с PA в передней полосе print-area.
[gcode_macro _TREED_LINE_PURGE]
description: "SYSTEM: две purge-линии 0,2 мм, без PA и с настроенным PA"
gcode:
  {% set cfg = printer["gcode_macro _TREED_START_PURGE_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set park_z = cfg.park_height|float %}
  {% set purge_z = cfg.purge_height|float %}
  {% set prime_len = cfg.prime_length|float %}
  {% set segment_len = cfg.segment_length|float %}
  {% set purge_len = prime_len + 3.0 * segment_len %}
  {% set break_len = cfg.break_distance|float %}
  {% set half_width = [cfg.prime_width|float, cfg.line_width|float]|max / 2.0 %}
  {% set x_min = geo.print_min_x|float %}
  {% set y_min = geo.print_min_y|float %}
  {% set x_max = x_min + geo.print_size_x|float %}
  {% set y_max = y_min + geo.print_size_y|float %}
  {% set start_x = [x_min + cfg.x_inset|float, x_max - purge_len - break_len - half_width]|min %}
  {% set start_y = [y_min + cfg.y_inset|float, y_max - cfg.line_spacing|float - half_width]|min %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set at_start = (pos.x|float - start_x)|abs < 0.001 and (pos.y|float - start_y)|abs < 0.001 %}
  {% if printer.configfile.settings.extruder.max_extrude_cross_section|default(0)|float < 5.0 %}
    {action_raise_error("LINE_PURGE: extruder.max_extrude_cross_section должен быть >= 5")}
  {% endif %}
  {% if not printer.extruder.can_extrude %}
    {action_raise_error("LINE_PURGE: сопло не готово к экструзии")}
  {% endif %}
  {% if cfg.saved_pa|float >= 0 %}
    {action_raise_error("LINE_PURGE: прошлый purge прерван; сначала выполните CANCEL_PRINT")}
  {% endif %}
  {% set pa_before = printer.extruder.pressure_advance|float %}
  {% set pa_enabled = pa_before if pa_before > 0 else printer.configfile.settings.extruder.pressure_advance|default(0)|float %}
  {% if pa_enabled <= 0 %}
    {action_raise_error("LINE_PURGE: для второй линии требуется настроенный положительный PA")}
  {% endif %}
  {% set diameter = printer.configfile.settings.extruder.filament_diameter|float %}
  {% if diameter <= 0 %}
    {action_raise_error("LINE_PURGE: неверный диаметр филамента")}
  {% endif %}
  # Сечение в форме прямоугольника с полукруглыми краями, E в мм филамента.
  {% set filament_area = 3.141592653589793 * diameter * diameter / 4.0 %}
  {% set prime_area = purge_z * (cfg.prime_width|float - purge_z) + 3.141592653589793 * purge_z * purge_z / 4.0 %}
  {% set line_area = purge_z * (cfg.line_width|float - purge_z) + 3.141592653589793 * purge_z * purge_z / 4.0 %}
  {% set prime_e = prime_len * prime_area / filament_area %}
  {% set segment_e = segment_len * line_area / filament_area %}
  _TREED_PURGE_VALIDATE
  SAVE_GCODE_STATE NAME=TREED_LINE_PURGE_STATE
  SET_GCODE_VARIABLE MACRO=_TREED_START_PURGE_CFG VARIABLE=saved_pa VALUE={pa_before}
  G90
  M83
  M220 S100
  M221 S100
  # После штатного нагрева XY уже готов; отдельный вызов сохраняет безопасный переезд.
  {% if not at_start %}
    {% if pos.z|float < park_z %}
      G0 Z{park_z} F1500
    {% endif %}
    G0 X{start_x} Y{start_y} F6000
  {% endif %}
  G0 Z{purge_z} F1500
  G92 E0
  {% for line in [0, 1] %}
    {% if line == 1 %}
      G0 X{start_x} Y{start_y + cfg.line_spacing|float} F6000
      G0 Z{purge_z} F1500
    {% endif %}
    SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={0.0 if line == 0 else pa_enabled}
    G11
    G1 X{start_x + prime_len} E{prime_e} F{cfg.prime_speed|float * 60.0}
    G1 X{start_x + prime_len + segment_len} E{segment_e} F{cfg.fast_speed|float * 60.0}
    G1 X{start_x + prime_len + 2.0 * segment_len} E{segment_e} F{cfg.slow_speed|float * 60.0}
    G1 X{start_x + purge_len} E{segment_e} F{cfg.fast_speed|float * 60.0}
    G10
    G0 X{start_x + purge_len + break_len} F6000
    G0 Z{park_z} F1500
  {% endfor %}
  G92 E0
  _TREED_PURGE_RESTORE_STATE

# Блок 5: Восстановление PA и G-code состояния после purge или отмены.
[gcode_macro _TREED_PURGE_RESTORE_STATE]
description: "SYSTEM: вернуть состояние до purge без движения"
gcode:
  {% set saved_pa = printer["gcode_macro _TREED_START_PURGE_CFG"].saved_pa|float %}
  {% if saved_pa >= 0 %}
    SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={saved_pa}
    RESTORE_GCODE_STATE NAME=TREED_LINE_PURGE_STATE MOVE=0
    SET_GCODE_VARIABLE MACRO=_TREED_START_PURGE_CFG VARIABLE=saved_pa VALUE=-1.0
  {% endif %}
