# ==========================================
# ЧИСТКА СОПЛА И PARK/PURGE — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Чистит сопло на заднем скребке до mesh, затем выполняет park/purge у Y-min.
# - Не зависит от polygon-метаданных объектов.
# Контур:
# - required: оси X/Y/Z homed; чистка в raw coords до mesh, park/purge после включения print-offset.
# - safety: координаты ограничены _TREED_GEOMETRY_CFG и проверенной механикой.

# Блок 1: Настройки механики и расхода для калибровки на устройстве.
[gcode_macro _TREED_START_PURGE_CFG]
variable_park_height: 10.0
variable_heat_wait_height: 0.4
variable_purge_height: 0.4
variable_x_inset: 10.0
variable_y_inset: 5.0
variable_prime_amount: 30.0
# Скорость линии в мм/мин, как F в G-code.
variable_purge_speed: 400.0
variable_state_saved: 0
variable_saved_accel: 0.0
gcode:
  G4 P0

# Блок 2: Границы одной линии; проверка не выполняет движения.
[gcode_macro _TREED_PURGE_VALIDATE]
description: "SYSTEM: проверка настроек park/purge до движения"
gcode:
  {% set cfg = printer["gcode_macro _TREED_START_PURGE_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set th = printer.toolhead %}
  {% if printer["gcode_macro _TREED_PRINT_AREA_CFG"].print_offset_enabled|int != 1 %}
    {action_raise_error("PURGE: нужен включённый print-offset")}
  {% endif %}
  {% set homed = th.homed_axes|lower %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    {action_raise_error("PURGE: требуются homed X/Y/Z")}
  {% endif %}
  {% for name in ["park_height", "heat_wait_height", "purge_height", "prime_amount", "purge_speed"] %}
    {% set value = cfg[name]|float(none) %}
    {% if value is none or value - value != 0 or value <= 0 %}
      {action_raise_error("PURGE: " ~ name ~ " должен быть конечным положительным числом")}
    {% endif %}
  {% endfor %}
  {% for name in ["x_inset", "y_inset"] %}
    {% set value = cfg[name]|float(none) %}
    {% if value is none or value - value != 0 or value < 0 %}
      {action_raise_error("PURGE: " ~ name ~ " должен быть конечным неотрицательным числом")}
    {% endif %}
  {% endfor %}
  {% set park_z = cfg.park_height|float %}
  {% set wait_z = cfg.heat_wait_height|float %}
  {% set purge_z = cfg.purge_height|float %}
  {% if park_z <= purge_z or park_z > th.axis_maximum.z|float or
        wait_z <= th.axis_minimum.z|float or wait_z > purge_z %}
    {action_raise_error("PURGE: неверные высоты перемещения, ожидания или линии")}
  {% endif %}
  {% set line_len = geo.print_size_x|float / 2.0 %}
  {% if line_len <= 0 %}
    {action_raise_error("PURGE: нужна положительная ширина print-area")}
  {% endif %}
  {% set diameter = printer.configfile.settings.extruder.filament_diameter|float(none) %}
  {% if diameter is none or diameter - diameter != 0 or diameter <= 0 %}
    {action_raise_error("PURGE: неверный диаметр филамента")}
  {% endif %}
  {% set filament_area = 3.141592653589793 * diameter * diameter / 4.0 %}
  {% set line_area = cfg.prime_amount|float * filament_area / line_len %}
  {% if line_area > printer.configfile.settings.extruder.max_extrude_cross_section|float %}
    {action_raise_error("PURGE: расход превышает extruder.max_extrude_cross_section")}
  {% endif %}
  {% set x_min = geo.print_min_x|float %}
  {% set y_min = geo.print_min_y|float %}
  {% set x_max = x_min + geo.print_size_x|float %}
  {% set y_max = y_min + geo.print_size_y|float %}
  {% set half_width = (line_area / purge_z + purge_z * (1.0 - 3.141592653589793 / 4.0)) / 2.0 %}
  {% set start_x = x_min + cfg.x_inset|float %}
  {% set start_y = y_min + cfg.y_inset|float %}
  {% if start_x < x_min + half_width or start_x + line_len > x_max - half_width or
        start_y < y_min + half_width or start_y > y_max - half_width %}
    {action_raise_error("PURGE: линия с заданным расходом не помещается в print-area")}
  {% endif %}

# Блок 3: Парковка перед финальным нагревом в print coords.
[gcode_macro _TREED_SMART_PARK]
description: "SYSTEM: безопасная парковка перед финальным нагревом"
gcode:
  {% set cfg = printer["gcode_macro _TREED_START_PURGE_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set park_z = cfg.park_height|float %}
  {% set wait_z = cfg.heat_wait_height|float %}
  {% set park_x = geo.print_min_x|float + cfg.x_inset|float %}
  {% set park_y = geo.print_min_y|float + cfg.y_inset|float %}
  _TREED_PURGE_VALIDATE
  SAVE_GCODE_STATE NAME=TREED_SMART_PARK_STATE
  G90
  {% if pos.z|float < park_z %}
    G0 Z{park_z} F1500
  {% endif %}
  G0 X{park_x} Y{park_y} F6000
  # После безопасного XY-переезда ждём нагрев с зазором, без прижима к столу.
  G0 Z{wait_z} F1500
  RESTORE_GCODE_STATE NAME=TREED_SMART_PARK_STATE MOVE=0

# Блок 4: Одна прямая вдоль X длиной в половину стола, без переключения PA.
[gcode_macro _TREED_LINE_PURGE]
description: "SYSTEM: одна purge-линия у Y-min"
gcode:
  {% set cfg = printer["gcode_macro _TREED_START_PURGE_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set park_z = cfg.park_height|float %}
  {% set purge_z = cfg.purge_height|float %}
  {% set purge_len = geo.print_size_x|float / 2.0 %}
  {% set start_x = geo.print_min_x|float + cfg.x_inset|float %}
  {% set start_y = geo.print_min_y|float + cfg.y_inset|float %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set at_start = (pos.x|float - start_x)|abs < 0.001 and (pos.y|float - start_y)|abs < 0.001 %}
  {% if not printer.extruder.can_extrude %}
    {action_raise_error("LINE_PURGE: сопло не готово к экструзии")}
  {% endif %}
  {% if cfg.state_saved|int != 0 %}
    {action_raise_error("LINE_PURGE: подготовка сопла прервана; сначала выполните CANCEL_PRINT")}
  {% endif %}
  _TREED_PURGE_VALIDATE
  SAVE_GCODE_STATE NAME=TREED_START_NOZZLE_STATE
  SET_GCODE_VARIABLE MACRO=_TREED_START_PURGE_CFG VARIABLE=state_saved VALUE=1
  G90
  M83
  M220 S100
  M221 S100
  # После штатного нагрева XY уже готов; отдельный вызов сохраняет безопасный переезд.
  {% if not at_start %}
    {% if pos.z|float < park_z %}
      G0 Z{park_z} F1500
    {% endif %}
    G0 X{start_x} Y{start_y} F6000
  {% endif %}
  G0 Z{purge_z} F1500
  G92 E0
  G1 X{start_x + purge_len} E{cfg.prime_amount|float} F{cfg.purge_speed|float}
  G0 Z{park_z} F1500
  G92 E0
  _TREED_PURGE_RESTORE_STATE

# Блок 5: Общее восстановление G-code состояния после чистки, purge или отмены.
[gcode_macro _TREED_PURGE_RESTORE_STATE]
description: "SYSTEM: вернуть состояние до подготовки сопла без движения"
gcode:
  {% if printer["gcode_macro _TREED_START_PURGE_CFG"].state_saved|int != 0 %}
    RESTORE_GCODE_STATE NAME=TREED_START_NOZZLE_STATE MOVE=0
    # SAVE_GCODE_STATE не хранит лимит ускорения.
    {% set saved_accel = printer["gcode_macro _TREED_START_PURGE_CFG"].saved_accel|float %}
    {% if saved_accel > 0 %}
      SET_VELOCITY_LIMIT ACCEL={saved_accel}
      SET_GCODE_VARIABLE MACRO=_TREED_START_PURGE_CFG VARIABLE=saved_accel VALUE=0.0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TREED_START_PURGE_CFG VARIABLE=state_saved VALUE=0
  {% endif %}

# Блок 6: Пять циклов по скребку у Y-max после homing, до построения mesh.
[gcode_macro _TREED_START_NOZZLE_WIPE]
description: "SYSTEM: чистка сопла при 175C на заднем скребке X40..100"
gcode:
  {% set th = printer.toolhead %}
  {% set homed = th.homed_axes|lower %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    {action_raise_error("NOZZLE_WIPE: требуются homed X/Y/Z")}
  {% endif %}
  {% if th.axis_minimum.x|float > 40.0 or th.axis_maximum.x|float < 100.0 or
        th.axis_minimum.z|float > 0.15 or th.axis_maximum.z|float < 1.0 %}
    {action_raise_error("NOZZLE_WIPE: скребок X40..100 Z0.15..0.5 и парковка Z1 вне пределов осей")}
  {% endif %}
  {% for axis in ["x", "y", "z"] %}
    {% if printer.gcode_move.homing_origin[axis]|float|abs > 0.001 %}
      {action_raise_error("NOZZLE_WIPE: перед чисткой нужен homing без G-code offsets")}
    {% endif %}
  {% endfor %}
  {% if printer["gcode_macro _TREED_START_PURGE_CFG"].state_saved|int != 0 %}
    {action_raise_error("NOZZLE_WIPE: подготовка сопла прервана; сначала выполните CANCEL_PRINT")}
  {% endif %}
  {% set wipe_y = th.axis_maximum.y|float %}

  SAVE_GCODE_STATE NAME=TREED_START_NOZZLE_STATE
  SET_GCODE_VARIABLE MACRO=_TREED_START_PURGE_CFG VARIABLE=state_saved VALUE=1
  G90
  M220 S100
  # Скребок задан в координатах сопла; смещение Eddy здесь не применяется.
  G0 Z1 F1500
  G0 X40 Y{wipe_y} F6000
  M400
  _TREED_START_WAIT_PREHEAT_NOZZLE TARGET=175
  _TREED_START_NOZZLE_WIPE_RUN

# Блок 7: Лимиты считываются после ожидания нагрева, перед проходами по скребку.
[gcode_macro _TREED_START_NOZZLE_WIPE_RUN]
description: "SYSTEM: пять циклов чистки с половиной скорости и ускорения"
gcode:
  {% if printer["gcode_macro _TREED_START_PURGE_CFG"].state_saved|int != 1 %}
    {action_raise_error("NOZZLE_WIPE: сначала нужна парковка и подготовка чистки")}
  {% endif %}
  {% set th = printer.toolhead %}
  {% set wipe_speed = th.max_velocity|float * 0.5 * 60.0 %}
  SET_GCODE_VARIABLE MACRO=_TREED_START_PURGE_CFG VARIABLE=saved_accel VALUE={th.max_accel|float}
  SET_VELOCITY_LIMIT ACCEL={th.max_accel|float * 0.5}
  G0 Z0.15 F1500
  {% for cycle in range(5) %}
    G1 X100 Z0.5 F{wipe_speed}
    G1 X40 Z0.15 F{wipe_speed}
  {% endfor %}
  G0 Z1 F1500
  M400
  _TREED_PURGE_RESTORE_STATE
