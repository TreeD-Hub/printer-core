# ==========================================
# ФИКСИРОВАННЫЕ PARK/PURGE — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Паркует и очищает сопло в передней полосе print-area после adaptive mesh.
# - Не зависит от polygon-метаданных объектов.
# Контур:
# - required: print-offset уже включён, оси X/Y/Z homed.
# - safety: координаты ограничены _TREED_GEOMETRY_CFG и проверенной механикой.

# Блок 1: Настройки механики и расхода для калибровки на устройстве.
[gcode_macro _TREED_START_PURGE_CFG]
variable_park_height: 10.0
variable_purge_height: 0.8
variable_x_inset: 10.0
variable_y_inset: 5.0
variable_purge_amount: 30.0
variable_break_distance: 10.0
variable_flow_rate: 12.0
gcode:
  G4 P0

# Блок 2: Парковка перед финальным нагревом в print coords.
[gcode_macro _TREED_SMART_PARK]
description: "SYSTEM: безопасная парковка перед финальным нагревом"
gcode:
  {% if printer["gcode_macro _TREED_PRINT_AREA_CFG"].print_offset_enabled|int != 1 %}
    {action_raise_error("SMART_PARK: нужен включённый print-offset")}
  {% endif %}
  {% set th = printer.toolhead %}
  {% set homed = th.homed_axes|lower %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    {action_raise_error("SMART_PARK: требуются homed X/Y/Z")}
  {% endif %}
  {% set cfg = printer["gcode_macro _TREED_START_PURGE_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set park_z = cfg.park_height|float %}
  {% set purge_z = cfg.purge_height|float %}
  {% set purge_len = cfg.purge_amount|float %}
  {% set break_len = cfg.break_distance|float %}
  {% set x_min = geo.print_min_x|float %}
  {% set y_min = geo.print_min_y|float %}
  {% set x_max = x_min + geo.print_size_x|float %}
  {% set y_max = y_min + geo.print_size_y|float %}
  {% set park_x = [x_min + cfg.x_inset|float, x_max - purge_len - break_len]|min %}
  {% set park_y = [y_min + cfg.y_inset|float, y_max]|min %}
  {% if park_z <= purge_z or park_z > th.axis_maximum.z|float or purge_z <= th.axis_minimum.z|float %}
    {action_raise_error("SMART_PARK: неверная высота park/purge")}
  {% endif %}
  {% if cfg.x_inset|float < 0 or cfg.y_inset|float < 0 or purge_len <= 0 or break_len < 0 or
        park_x < x_min or park_y < y_min or cfg.flow_rate|float <= 0 %}
    {action_raise_error("SMART_PARK: фиксированная линия не помещается в print-area или неверные настройки")}
  {% endif %}
  SAVE_GCODE_STATE NAME=TREED_SMART_PARK_STATE
  G90
  {% if th.position.z|float < park_z %}
    G0 Z{park_z} F1500
  {% endif %}
  G0 X{park_x} Y{park_y} F6000
  {% if th.position.z|float > park_z %}
    G0 Z{park_z} F1500
  {% endif %}
  RESTORE_GCODE_STATE NAME=TREED_SMART_PARK_STATE MOVE=0

# Блок 3: Одна purge-линия в передней полосе print-area.
[gcode_macro _TREED_LINE_PURGE]
description: "SYSTEM: фиксированная purge-линия после финального нагрева"
gcode:
  {% if printer["gcode_macro _TREED_PRINT_AREA_CFG"].print_offset_enabled|int != 1 %}
    {action_raise_error("LINE_PURGE: нужен включённый print-offset")}
  {% endif %}
  {% set th = printer.toolhead %}
  {% set homed = th.homed_axes|lower %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    {action_raise_error("LINE_PURGE: требуются homed X/Y/Z")}
  {% endif %}
  {% set cfg = printer["gcode_macro _TREED_START_PURGE_CFG"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set park_z = cfg.park_height|float %}
  {% set purge_z = cfg.purge_height|float %}
  {% set purge_len = cfg.purge_amount|float %}
  {% set break_len = cfg.break_distance|float %}
  {% set x_min = geo.print_min_x|float %}
  {% set y_min = geo.print_min_y|float %}
  {% set x_max = x_min + geo.print_size_x|float %}
  {% set y_max = y_min + geo.print_size_y|float %}
  {% set start_x = [x_min + cfg.x_inset|float, x_max - purge_len - break_len]|min %}
  {% set start_y = [y_min + cfg.y_inset|float, y_max]|min %}
  {% set flow_rate = cfg.flow_rate|float %}
  {% if park_z <= purge_z or park_z > th.axis_maximum.z|float or purge_z <= th.axis_minimum.z|float %}
    {action_raise_error("LINE_PURGE: неверная высота park/purge")}
  {% endif %}
  {% if cfg.x_inset|float < 0 or cfg.y_inset|float < 0 or purge_len <= 0 or break_len < 0 or
        start_x < x_min or start_y < y_min or flow_rate <= 0 %}
    {action_raise_error("LINE_PURGE: фиксированная линия не помещается в print-area или неверные настройки")}
  {% endif %}
  {% if printer.configfile.settings.extruder.max_extrude_cross_section|default(0)|float < 5.0 %}
    {action_raise_error("LINE_PURGE: extruder.max_extrude_cross_section должен быть >= 5")}
  {% endif %}
  SAVE_GCODE_STATE NAME=TREED_LINE_PURGE_STATE
  G90
  M83
  {% if th.position.z|float < park_z %}
    G0 Z{park_z} F1500
  {% endif %}
  G0 X{start_x} Y{start_y} F6000
  G0 Z{purge_z} F1500
  G92 E0
  G1 X{start_x + purge_len} E{purge_len} F{(flow_rate / 5.0) * 60.0}
  G10
  G0 X{start_x + purge_len + break_len} F6000
  G0 Z{park_z} F1500
  G92 E0
  RESTORE_GCODE_STATE NAME=TREED_LINE_PURGE_STATE MOVE=0
