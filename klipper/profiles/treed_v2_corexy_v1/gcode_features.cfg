# ==========================================
# СОВМЕСТИМОСТЬ G-CODE СО СЛАЙСЕРОМ — TreeD V2 CoreXY V1
# ==========================================
# Назначение:
# - Поддержка дуг G2/G3.
# - Поддержка firmware retraction G10/G11.
# - Поддержка object exclusion и Marlin/RRF-style M486.
# - Безопасный M600: пауза + выгрузка филамента.
#
# Важно:
# - Этот файл не зависит от Octopus Pro и не содержит MCU-пинов.
# - Если [respond] или [pause_resume] уже объявлены в другом cfg,
#   не дублировать их здесь.

[respond]

[pause_resume]

[gcode_arcs]
resolution: 0.1

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

[exclude_object]

# Marlin / RepRapFirmware compatible object exclusion.
# Используется слайсерами, которые генерируют M486.
[gcode_macro M486]
description: "Совместимость со слайсером: Marlin/RRF object exclusion"
gcode:
  {% if 'exclude_object' not in printer %}
    {action_raise_error("[exclude_object] is not enabled")}
  {% endif %}

  # M486 T<count> — reset state and define object indexes.
  {% if 'T' in params %}
    EXCLUDE_OBJECT RESET=1
    {% for i in range(params.T|int) %}
      EXCLUDE_OBJECT_DEFINE NAME={i}
    {% endfor %}
  {% endif %}

  # M486 C — cancel current object.
  {% if 'C' in params %}
    EXCLUDE_OBJECT CURRENT=1
  {% endif %}

  # M486 P<index> — cancel object by index.
  {% if 'P' in params %}
    EXCLUDE_OBJECT NAME={params.P}
  {% endif %}

  # M486 S<index> — set current object.
  # S-1 means "not an object".
  {% if 'S' in params %}
    {% if params.S == '-1' %}
      {% if printer.exclude_object.current_object %}
        EXCLUDE_OBJECT_END NAME={printer.exclude_object.current_object}
      {% endif %}
    {% else %}
      EXCLUDE_OBJECT_START NAME={params.S}
    {% endif %}
  {% endif %}

  # M486 U<index> — un-cancel object by index.
  {% if 'U' in params %}
    EXCLUDE_OBJECT RESET=1 NAME={params.U}
  {% endif %}

[gcode_macro M600]
description: "Совместимость со слайсером: M600 -> PAUSE + UNLOAD"
gcode:
  {% set unload_temp = params.UNLOAD_TEMP|default(180)|float %}
  {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
  {% set unload_len = params.UNLOAD_LENGTH|default(50)|float %}
  {% set max_e = printer.configfile.settings.extruder.max_extrude_only_distance|default(50)|float %}

  {% if unload_temp < min_extrude %}
    {% set unload_temp = min_extrude %}
  {% endif %}

  {% if unload_len > max_e %}
    {% set unload_len = max_e %}
  {% endif %}

  RESPOND PREFIX="treed" MSG="M600: pause + unload"
  PAUSE

  {% if not printer.extruder.can_extrude %}
    RESPOND PREFIX="treed" MSG="M600: heating to {unload_temp|int}C before unload"
    M109 S{unload_temp}
  {% endif %}

  {% if 'gcode_macro UNLOAD_FILAMENT' in printer %}
    UNLOAD_FILAMENT
  {% else %}
    RESPOND PREFIX="treed" MSG="M600: UNLOAD_FILAMENT not found, using fallback unload {unload_len|int}mm"
    SAVE_GCODE_STATE NAME=M600_UNLOAD_STATE
    M83
    G1 E-{unload_len} F600
    RESTORE_GCODE_STATE NAME=M600_UNLOAD_STATE
  {% endif %}

  M104 S140