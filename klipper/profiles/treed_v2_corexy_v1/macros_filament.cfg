# ==========================================
# ФИЛАМЕНТ (LOAD / UNLOAD)
# ==========================================
# Назначение:
# - операторские макросы для KS/веб-интерфейса;
# - длинные экструзии бьются на порции по max_extrude_only_distance.
# Контур:
# - public: LOAD_FILAMENT/UNLOAD_FILAMENT можно вызывать из UI и M600.
# - sensor-safe: датчики филамента временно выключаются на время сервисной протяжки.
# - fail-fast: движение запрещено ниже min_extrude_temp.

# Блок 1: Общий guard датчиков для сервисной протяжки.
[gcode_macro _FILAMENT_SENSOR_GUARD_START]
description: "SYSTEM: disable filament sensors during service move"
gcode:
  {% set restore_delay = params.DURATION|default(30)|float %}
  {% if restore_delay < 5.0 %}{% set restore_delay = 5.0 %}{% endif %}
  {% if 'filament_switch_sensor filament_switch' in printer %}
    SET_FILAMENT_SENSOR SENSOR=filament_switch ENABLE=0
  {% endif %}
  {% if 'filament_motion_sensor filament_motion' in printer %}
    SET_FILAMENT_SENSOR SENSOR=filament_motion ENABLE=0
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_FILAMENT_SENSOR_GUARD_RESTORE DURATION={restore_delay}

[gcode_macro _FILAMENT_SENSOR_GUARD_FINISH]
description: "SYSTEM: restore selected filament sensor mode"
gcode:
  UPDATE_DELAYED_GCODE ID=_FILAMENT_SENSOR_GUARD_RESTORE DURATION=0
  {% set mode = printer["gcode_macro FILAMENT_SENSOR_STATUS"].mode|default("presence")|string|lower %}
  _FILAMENT_SENSOR_APPLY_MODE MODE={mode}

[delayed_gcode _FILAMENT_SENSOR_GUARD_RESTORE]
gcode:
  _FILAMENT_SENSOR_GUARD_FINISH

# Блок 2: Общий helper загрузки/выгрузки филамента.
[gcode_macro _TREED_FILAMENT_MOVE]
description: "SYSTEM: сервисный helper перемещения филамента"
gcode:
  {% set length = params.LENGTH|default(100)|float %}
  {% set speed = params.SPEED|default(8)|float %}
  {% set action_name = params.ACTION|default("FILAMENT_MOVE")|string %}
  {% if speed < 0.1 %}{% set speed = 0.1 %}{% endif %}
  {% set min_extrude = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
  {% set max_chunk = printer.configfile.settings.extruder.max_extrude_only_distance|default(50)|float %}
  {% if max_chunk < 1.0 %}
    {% set max_chunk = 50.0 %}
  {% endif %}
  {% set abs_length = length %}
  {% if abs_length < 0 %}
    {% set abs_length = 0.0 - abs_length %}
  {% endif %}
  {% set parts = (abs_length / max_chunk)|round(0, "ceil")|int %}
  {% if parts < 1 %}{% set parts = 1 %}{% endif %}
  {% set chunk = (abs_length / parts)|float %}
  {% set restore_delay = (abs_length / speed) + 5.0 %}
  {% if not printer.extruder.can_extrude %}
    {action_raise_error(action_name ~ ": нагрейте сопло выше " ~ min_extrude ~ "C")}
  {% endif %}
  _FILAMENT_SENSOR_GUARD_START DURATION={restore_delay}
  SAVE_GCODE_STATE NAME=TREED_FILAMENT_MOVE_STATE
  M83
  G92 E0
  {% if length >= 0 %}
    {% for _ in range(parts) %}
      G1 E{chunk} F{speed * 60.0}
    {% endfor %}
  {% else %}
    {% for _ in range(parts) %}
      G1 E-{chunk} F{speed * 60.0}
    {% endfor %}
  {% endif %}
  RESTORE_GCODE_STATE NAME=TREED_FILAMENT_MOVE_STATE
  M400
  _FILAMENT_SENSOR_GUARD_FINISH

# Блок 3: Загрузка филамента для UI и сервисных сценариев.
[gcode_macro LOAD_FILAMENT]
description: "TreeD: загрузка филамента"
gcode:
  {% set length = params.LENGTH|default(100)|float %}
  {% set speed = params.SPEED|default(8)|float %}
  {% if length < 0.0 %}{% set length = 0.0 - length %}{% endif %}
  _TREED_FILAMENT_MOVE LENGTH={length} SPEED={speed} ACTION=LOAD_FILAMENT

# Блок 4: Выгрузка филамента для UI, M600 и сервисных сценариев.
[gcode_macro UNLOAD_FILAMENT]
description: "TreeD: выгрузка филамента"
gcode:
  {% set length = params.LENGTH|default(100)|float %}
  {% set speed = params.SPEED|default(8)|float %}
  {% if length < 0.0 %}{% set length = 0.0 - length %}{% endif %}
  _TREED_FILAMENT_MOVE LENGTH=-{length} SPEED={speed} ACTION=UNLOAD_FILAMENT
