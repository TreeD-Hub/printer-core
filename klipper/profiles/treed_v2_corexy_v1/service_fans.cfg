# ==========================================
# SERVICE FANS — V2 COREXY
# ==========================================
# Назначение:
# - управляемый обдув электроники / драйверов на Octopus Pro;
# - не трогает обдув модели и hotend fan на EBB42.
# Контур:
# - optional/runtime: вентилятор обслуживает драйверы и не участвует в логике печати.

# Блок 1: Обдув на полной мощности; критерий нагрузки задаёт treed_driver_fan_mode.
[controller_fan driver_fan]
# Octopus Pro FAN2
# Перемычка питания FAN2: V_VDC для 24V-вентилятора.
pin: PD12

max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
kick_start_time: 0.5
off_below: 0.15

# Нагрев не запускает обдув; XYZ отслеживаются для операций и защитного таймера.
heater:
fan_speed: 1.0
idle_timeout: 120
idle_speed: 1.0
stepper: stepper_x, stepper_y, stepper_z

# Блок 2: Печать/сервис включают обдув сразу; ручное удержание — по таймеру.
[treed_driver_fan_mode]
# Защитный предел для непрерывно включённых XYZ вне печати/сервиса (1..60 с).
load_delay: 30
# Эти вентиляторы запускаются только при 100%; тихий пресет и POWER недоступны.

[gcode_macro TREED_UI_SET_DRIVER_FAN_MODE]
description: "Обдув по нагрузке: MODE=normal, полная мощность"
gcode:
    TREED_DRIVER_FAN_MODE_SET {rawparams}

# ==========================================
# ROCK PI COOLING FAN
# ==========================================
# Octopus Pro FAN3
# Перемычка питания FAN3: 5VDC для 5V-вентилятора.

[temperature_fan _rock_pi_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 1.0
cycle_time: 0.010
kick_start_time: 0.8
off_below: 0.20

sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp

control: pid
target_temp: 70.0
min_temp: 0
max_temp: 110

min_speed: 0.0
max_speed: 1.0

pid_Kp: 2.0
pid_Ki: 0.5
pid_Kd: 0.5

gcode_id: RockPi

# ==========================================
# CHAMBER LIGHT
# ==========================================
# Octopus Pro FAN5 / J55 — правый управляемый FAN-разъём.
# Перемычка питания FAN5: V_VDC для 24V-подсветки.

[output_pin chamber_light]
pin: PD15
pwm: False
value: 0
shutdown_value: 0

[gcode_macro LIGHT_ON]
description: "Включить подсветку"
gcode:
    SET_PIN PIN=chamber_light VALUE=1

[gcode_macro LIGHT_OFF]
description: "Выключить подсветку"
gcode:
    SET_PIN PIN=chamber_light VALUE=0

# Настройки принадлежат принтеру и сохраняются в штатном save_variables.
[gcode_macro TREED_LIGHT_SETTINGS]
description: "Подсветка: сохранить STARTUP=0|1 или PRINT_START=0|1"
gcode:
    {% for key in params %}
      {% if key not in ["STARTUP", "PRINT_START"] or params[key] not in ["0", "1"] %}
        {action_raise_error("TREED_LIGHT_SETTINGS: нужны STARTUP=0|1 или PRINT_START=0|1")}
      {% endif %}
    {% endfor %}
    {% if params.STARTUP is defined %}
      SAVE_VARIABLE VARIABLE=light_on_startup VALUE={params.STARTUP}
    {% endif %}
    {% if params.PRINT_START is defined %}
      SAVE_VARIABLE VARIABLE=light_on_print_start VALUE={params.PRINT_START}
    {% endif %}

[delayed_gcode _TREED_LIGHT_STARTUP]
initial_duration: 1.0
gcode:
    {% if printer.save_variables.variables.light_on_startup|default(0)|int == 1 %}
      LIGHT_ON
    {% endif %}

[gcode_macro _TREED_LIGHT_PRINT_START]
gcode:
    {% if printer.save_variables.variables.light_on_print_start|default(1)|int == 1 %}
      LIGHT_ON
    {% endif %}
