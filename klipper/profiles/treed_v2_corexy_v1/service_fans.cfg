# ==========================================
# SERVICE FANS — V2 COREXY
# ==========================================
# Назначение:
# - управляемый обдув электроники / драйверов на Octopus Pro;
# - не трогает обдув модели и hotend fan на EBB42.

[controller_fan driver_fan]
# Octopus Pro FAN2
# Перемычка питания FAN2: V_VDC для 24V-вентилятора.
pin: PD12

max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
kick_start_time: 0.5
off_below: 0.15

# Включается при активности XY-драйверов.
fan_speed: 1.0
idle_timeout: 120
idle_speed: 0.5
stepper: stepper_x, stepper_y, stepper_z

# ==========================================
# ROCK PI COOLING FAN
# ==========================================
# Octopus Pro FAN3
# Перемычка питания FAN3: 5VDC для 5V-вентилятора.

[temperature_fan rock_pi_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 1.0
cycle_time: 0.010
kick_start_time: 0.8
off_below: 0.20

sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp

control: pid
target_temp: 50.0
min_temp: 0
max_temp: 150

min_speed: 0.30
max_speed: 1.0

pid_Kp: 2.0
pid_Ki: 0.5
pid_Kd: 0.5

gcode_id: RockPi
