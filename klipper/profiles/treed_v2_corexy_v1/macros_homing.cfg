# ==========================================
# HOMING-МАКРОСЫ — V2 COREXY
# ==========================================
# Назначение:
# - Переопределяет штатный G28 для sensorless X/Y homing.
# - После срабатывания X/Y делает отход от упора и паузу для сброса stall-флага TMC5160.
# - Перед Z переводит голову в безопасную точку стола, если X/Y готовы сейчас или будут захоумлены в этом же вызове.
# - Z оставляет на штатный endstop активного профиля.

[gcode_macro G28]
description: "TreeD: override G28 с backoff для sensorless X/Y"
rename_existing: G28_BASE
gcode:
  {% set home_all = params.X is not defined and params.Y is not defined and params.Z is not defined %}
  {% set home_x = home_all or params.X is defined %}
  {% set home_y = home_all or params.Y is defined %}
  {% set home_z = home_all or params.Z is defined %}
  {% set homed_axes = printer.toolhead.homed_axes|lower %}
  {% set x_ready_for_z = home_x or ("x" in homed_axes) %}
  {% set y_ready_for_z = home_y or ("y" in homed_axes) %}

  SAVE_GCODE_STATE NAME=TREED_G28_STATE

  # X: sensorless homing + отход от X-max.
  {% if home_x %}
    G28_BASE X
    G91
    G1 X-10 F3000
    G90
    M400
    G4 P1000
  {% endif %}

  # Y: sensorless homing + отход от Y-max.
  {% if home_y %}
    G28_BASE Y
    G91
    G1 Y-10 F3000
    G90
    M400
    G4 P1000
  {% endif %}

  # Z: штатный endstop активного профиля.
  # Для полного G28 / G28 X Y Z / G28 Z после уже homed XY сначала уходим в безопасную точку стола.
  {% if home_z %}
    {% if x_ready_for_z and y_ready_for_z %}
      G90
      G1 X122.5 Y122.5 F6000
      M400
      G28_BASE Z
    {% else %}
      { action_raise_error("TreeD G28: Z homing requires homed X/Y. Run G28 first.") }
    {% endif %}
  {% endif %}

  RESTORE_GCODE_STATE NAME=TREED_G28_STATE
