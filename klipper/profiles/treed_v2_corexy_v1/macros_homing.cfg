# ==========================================
# HOMING-МАКРОСЫ — V2 COREXY
# ==========================================
# Назначение:
# - Переопределяет штатный G28 для sensorless X/Y homing.
# - X/Y homing выполняется штатным G28.1 с homing_speed из [stepper_x]/[stepper_y].
# - После срабатывания X/Y делает отход от упора со скоростью homing_retract_speed из соответствующей оси.
# - Z всегда маршрутизируется в обязательный Eddy-контур `_TREED_EDDY_HOME_Z`.
# Контур:
# - required: используется как единая публичная точка homing для UI и макросов.
# - fail-fast: отдельный `G28 Z` требует уже homed X/Y.

# Блок 1: Override штатного G28 с sensorless-backoff.
[gcode_macro G28]
description: "TreeD: override G28 с backoff для sensorless X/Y"
rename_existing: G28.1

# Ускорение только на время sensorless homing X/Y.
# В Klipper нет штатного homing_accel в [stepper_*], поэтому держим это здесь.
variable_xy_home_accel: 700

# Отход от X-min/Y-max после sensorless срабатывания.
variable_xy_backoff_mm: 10

# Выдержка без движения перед каждым sensorless homing X/Y.
variable_stallguard_pause_ms: 2000

gcode:
  {% set home_all = params.X is not defined and params.Y is not defined and params.Z is not defined %}
  {% set home_x = home_all or params.X is defined %}
  {% set home_y = home_all or params.Y is defined %}
  {% set home_z = home_all or params.Z is defined %}

  {% set homed_axes = printer.toolhead.homed_axes|lower %}
  {% set x_ready_for_z = home_x or ("x" in homed_axes) %}
  {% set y_ready_for_z = home_y or ("y" in homed_axes) %}

  {% set xy_home_accel = printer["gcode_macro G28"].xy_home_accel|float %}
  {% set was_absolute_coordinates = printer.gcode_move.absolute_coordinates %}

  # Homing работает без mesh и G-code offsets от предыдущей печати.
  BED_MESH_CLEAR
  _TREED_PRINT_OFFSET_DISABLE
  _TREED_UI_RESET_Z_OFFSET

  # Перед X/Y создаём зазор; временная Z нужна только для полного homing.
  {% if home_x or home_y %}
    _TREED_Z_HOP_BEFORE_XY MARK_Z={1 if home_z else 0}
  {% endif %}

  # Отдельный G28 Z при неизвестной Z тоже требует зазора и временной координаты.
  {% if home_z and not home_x and not home_y and "z" not in homed_axes %}
    _TREED_Z_HOP_BEFORE_XY MARK_Z=1
  {% endif %}

  # Контроллер возвращает ускорение даже при ошибке sensorless homing.
  {% if home_x or home_y %}
    TREED_MOTION_GUARD ACTION=HOME_XY X={1 if home_x else 0} Y={1 if home_y else 0} ACCEL={xy_home_accel}
  {% endif %}

  # Z: обязательный Eddy-контур сам валидирует точку и делает Z-home.
  {% if home_z %}
    {% if x_ready_for_z and y_ready_for_z %}
      _TREED_EDDY_HOME_Z
    {% else %}
      { action_raise_error("TreeD G28: для Z homing нужны привязанные X/Y; при неизвестной Z автоматический XY homing запрещён") }
    {% endif %}
  {% endif %}

  # После homing нельзя восстанавливать полный G-code state:
  # он содержит старую XYZ-позицию парсера и ломает следующие движения.
  {% if was_absolute_coordinates %}
    G90
  {% else %}
    G91
  {% endif %}

# Блок 2: Исполнитель X/Y внутри защитной границы лимитов.
[gcode_macro _TREED_HOME_XY_RUN]
description: "SYSTEM: TreeD sensorless X/Y homing"
gcode:
  {% set home_x = params.X|int == 1 %}
  {% set home_y = params.Y|int == 1 %}
  {% set sx = printer.configfile.settings.stepper_x %}
  {% set sy = printer.configfile.settings.stepper_y %}
  {% set x_retract_speed = sx.homing_retract_speed|default(sx.homing_speed)|float %}
  {% set y_retract_speed = sy.homing_retract_speed|default(sy.homing_speed)|float %}
  {% set xy_backoff_mm = printer["gcode_macro G28"].xy_backoff_mm|float %}

  # X: sensorless homing + отход от X-min.
  {% if home_x %}
    _TREED_SENSORLESS_PREPARE
    G28.1 X
    G91
    G1 X{xy_backoff_mm} F{x_retract_speed * 60}
    G90
  {% endif %}

  # Y: sensorless homing + отход от Y-max.
  {% if home_y %}
    _TREED_SENSORLESS_PREPARE
    G28.1 Y
    G91
    G1 Y-{xy_backoff_mm} F{y_retract_speed * 60}
    G90
  {% endif %}

# Блок 3: Единая подготовка TMC5160 к поиску каждой оси.
[gcode_macro _TREED_SENSORLESS_PREPARE]
description: "TreeD: дождаться покоя драйверов перед sensorless homing"
gcode:
  {% set pause_ms = printer["gcode_macro G28"].stallguard_pause_ms|int %}
  {% if pause_ms < 2000 %}
    {% set pause_ms = 2000 %}
  {% endif %}
  # Используем текущие настройки драйверов; ток и SGT здесь не меняем.
  M400
  G4 P{pause_ms}
