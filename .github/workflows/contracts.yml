name: contracts

on:
  push:
    paths:
      - ".github/workflows/**"
      - "bootstrap-pi.sh"
      - "install.sh"
      - "loader/**"
      - "klipper/**"
      - "contracts/**"
      - "moonraker/**"
      - "runtime-scripts/**"
      - "tools/tests/**"
      - "tools/integration/**"
      - "tools/release_version.py"
      - "tools/treed_sgt_calibration.py"
      - "VERSION"
      - "runtime-versions.env"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "bootstrap-pi.sh"
      - "install.sh"
      - "loader/**"
      - "klipper/**"
      - "contracts/**"
      - "moonraker/**"
      - "runtime-scripts/**"
      - "tools/tests/**"
      - "tools/integration/**"
      - "tools/release_version.py"
      - "tools/treed_sgt_calibration.py"
      - "VERSION"
      - "runtime-versions.env"

jobs:
  static-contracts:
    name: Static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate bootstrap version
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          current = pathlib.Path('VERSION').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', current):
              raise SystemExit('VERSION must be x.y.z')
          PY

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -path './.git' -prune -o -type f -name '*.sh' -print0)

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile moonraker/components/*.py

      - name: Use release-style version for tests
        shell: bash
        run: printf '0.%s.%s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" > VERSION

      - name: Build runtime package
        run: |
          python3 runtime-scripts/treed-update/treed-core-update build . dist/treed-core-runtime.zip
