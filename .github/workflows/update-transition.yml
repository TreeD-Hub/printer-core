name: Real update transition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition:
    name: Old Core, interrupted dpkg, recovery, next update
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build two release packages from this checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/transition-packages"
          for patch in 0 1; do
            printf '1.%s.%s\n' "$GITHUB_RUN_NUMBER" "$patch" > VERSION
            python3 -B runtime-scripts/treed-update/treed-core-update build . "${RUNNER_TEMP}/transition-packages/runtime-${patch}.zip"
            python3 -B runtime-scripts/treed-update/treed-core-update build-source . "${RUNNER_TEMP}/transition-packages/source-${patch}.zip"
          done
      - name: Run real systemd transition in isolated QEMU
        run: |
          python3 -B tools/integration/update-transition/launch.py \
            --work-dir "${RUNNER_TEMP}/update-transition" \
            --first-runtime "${RUNNER_TEMP}/transition-packages/runtime-0.zip" \
            --first-source "${RUNNER_TEMP}/transition-packages/source-0.zip" \
            --next-runtime "${RUNNER_TEMP}/transition-packages/runtime-1.zip" \
            --next-source "${RUNNER_TEMP}/transition-packages/source-1.zip"
      - name: Retain transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-transition-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/update-transition/*.log
            ${{ runner.temp }}/update-transition/evidence.tar
