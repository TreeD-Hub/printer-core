name: Release

on:
  push:
    branches:
      - treed-v2
    paths:
      - VERSION
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-core
  cancel-in-progress: false

jobs:
  release:
    name: Release printer-core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHELL_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${MAIN_SHELL_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semver x.y.z, got '${MAIN_SHELL_VERSION}'" >&2
            exit 1
          fi
          EXPECTED_TAG="v${MAIN_SHELL_VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${EXPECTED_TAG}" >&2
            exit 1
          fi
          echo "MAIN_SHELL_VERSION=${MAIN_SHELL_VERSION}" >> "${GITHUB_ENV}"
          echo "EXPECTED_TAG=${EXPECTED_TAG}" >> "${GITHUB_ENV}"

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -path './.git' -prune -o -type f -name '*.sh' -print0)

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile moonraker/components/*.py

      - name: Runtime updater checks
        run: |
          python3 -B tools/tests/test_treed_core_update.py
          python3 -B tools/tests/test_treed_update_service.py
          python3 -B tools/tests/test_treed_update_component.py

      - name: Run contract checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -LiteralPath "tools/tests" -Filter "test_*.ps1" |
            Sort-Object Name |
            ForEach-Object {
              & $_.FullName
            }

      - name: Pack release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 runtime-scripts/treed-update/treed-core-update build . dist/treed-core-runtime.zip
          git archive --format=zip --output="dist/treed-mainshellos-source.zip" HEAD
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          manifest = {
              "name": "printer-core",
              "version": os.environ["MAIN_SHELL_VERSION"],
              "tag": os.environ["EXPECTED_TAG"],
              "ref": os.environ["GITHUB_REF_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "runNumber": os.environ["GITHUB_RUN_NUMBER"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "builtAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open("dist/treed-mainshellos-release.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "printer-core ${MAIN_SHELL_VERSION}."
            echo ""
            echo "Tag: ${EXPECTED_TAG}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Assets:"
            echo "- treed-core-runtime.zip (TreeD configs, host modules and scripts; preserves local data)"
            echo "- treed-mainshellos-source.zip"
            echo "- treed-mainshellos-release.json"
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify "${EXPECTED_TAG}^{commit}" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "${EXPECTED_TAG}^{commit}")" != "${GITHUB_SHA}" ]]; then
              echo "Version ${EXPECTED_TAG} already belongs to another commit; bump VERSION in the PR" >&2
              exit 1
            fi
          fi
          if gh release view "${EXPECTED_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${EXPECTED_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              gh release view "${EXPECTED_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > published-assets.txt
              for asset in treed-core-runtime.zip treed-mainshellos-source.zip treed-mainshellos-release.json; do
                grep -Fxq "${asset}" published-assets.txt || {
                  echo "Published release ${EXPECTED_TAG} is incomplete; refusing to overwrite immutable assets" >&2
                  exit 1
                }
              done
              echo "Release ${EXPECTED_TAG} already exists; immutable assets are preserved"
              exit 0
            fi
            gh release upload "${EXPECTED_TAG}" dist/treed-core-runtime.zip \
              dist/treed-mainshellos-source.zip dist/treed-mainshellos-release.json \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${EXPECTED_TAG}" \
              dist/treed-core-runtime.zip \
              dist/treed-mainshellos-source.zip \
              dist/treed-mainshellos-release.json \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title "printer-core ${MAIN_SHELL_VERSION}" \
              --notes-file release-notes.md
          fi
          gh release edit "${EXPECTED_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
