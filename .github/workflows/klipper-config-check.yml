name: klipper-config-check

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "klipper/**"
      - "tools/validate_klipper_configs.py"
      - ".github/workflows/klipper-config-check.yml"
  pull_request:
    paths:
      - "klipper/**"
      - "tools/validate_klipper_configs.py"
      - ".github/workflows/klipper-config-check.yml"

jobs:
  validate-klipper-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate include chain and sections
        run: python tools/validate_klipper_configs.py
