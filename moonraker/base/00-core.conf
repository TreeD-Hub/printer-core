# ==========================================
# MOONRAKER BASE: 00-CORE
# ==========================================
# Назначение:
# - Базовый серверный контур Moonraker для TreeD.
# - Объявляет shell_command-команды runtime-камеры.
# Контур:
# - файл репозиторный, деплоится в `moonraker/base/00-core.conf`.

# Блок 1: Серверный endpoint Moonraker и связь с Klippy.
[server]
host: 127.0.0.1
port: 7125
max_upload_size: 1024
klippy_uds_address: {{PI_HOME}}/printer_data/comms/klippy.sock

# Блок 2: File manager (object processing обязателен для KAMP).
[file_manager]
enable_object_processing: True

# Блок 3: Авторизация и сеть доверенных клиентов.
[authorization]
cors_domains:
    *://my.mainsail.xyz
    *://*.local
    *://*.lan
trusted_clients:
    127.0.0.0/8
    ::1/128

# Блок 4: Совместимость и исторические данные API.
[octoprint_compat]

[history]

# Блок 5: Подписка на объявления (Mainsail).
[announcements]
subscriptions:
    mainsail

# Блок 6: Update-manager для core/runtime-компонентов.
[update_manager]
refresh_interval: 168
enable_auto_refresh: True
enable_system_updates: True
channel: dev

[update_manager klipper]
channel: dev
refresh_interval: 168

[update_manager moonraker]
channel: dev
refresh_interval: 168

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /var/www/mainsail

[update_manager crowsnest]
type: git_repo
channel: dev
path: {{PI_HOME}}/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
primary_branch: v5
managed_services: crowsnest
system_dependencies: system-dependencies.json
virtualenv: {{PI_HOME}}/crowsnest-env
requirements: requirements.txt

# Блок 7: Регистрация кастомных компонентов TreeD.
[treed_shell_command]

[treed_host_network]

[treed_filament_sensor]
config_path: {{PI_HOME}}/printer_data/config/filament_motion_runtime.cfg

[treed_update]
repo_path: {{PI_HOME}}/treed/treed-mainshellOS
version_file: {{PI_HOME}}/treed/treed-mainshellOS/VERSION
shell_manifest_path: {{PI_HOME}}/treed/treed-shell-runtime/ui/treed-shell-ui-manifest.json
apply_command: /usr/bin/sudo -n /usr/local/sbin/treed-update-apply

# Блок 8: Runtime-команды камеры TreeD (исполняемые скрипты).
# Открывает новую сессию снимков и пишет стартовый кадр.
[shell_command treed_cam_session_start]
command: bash {{PI_HOME}}/treed/cam/bin/session_start.sh

# Делает очередной снимок в активную сессию.
[shell_command treed_cam_snapshot]
command: bash {{PI_HOME}}/treed/cam/bin/snapshot.sh

# Завершает сессию и очищает marker активной сессии.
[shell_command treed_cam_session_stop]
command: bash {{PI_HOME}}/treed/cam/bin/session_stop.sh
