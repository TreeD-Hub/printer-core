# ==========================================
# MOONRAKER ENTRYPOINT: TREED
# ==========================================
# Назначение:
# - Точка входа Moonraker-конфига в runtime.
# - Разводит статический repo-слой и runtime-generated слой.
# Контур:
# - `moonraker/base/*.conf`    -> репозиторный источник истины;
# - `moonraker/generated/*.conf` -> фрагменты, генерируемые loader шагами.

# Блок 1: Подключение статических базовых фрагментов.
[include moonraker/base/*.conf]

# Блок 2: Подключение runtime-generated фрагментов.
[include moonraker/generated/*.conf]
