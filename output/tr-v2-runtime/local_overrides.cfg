# ==========================================
# ВРЕМЕННЫЙ Z TOUCH — TMC5160 STALLGUARD
# ==========================================
# Назначение:
# - Паркует сопло в центре стола через Z StallGuard без Eddy.
# - Используется только для ручной диагностики временного runtime-контура.
# Контур:
# - runtime-only: после теста вернуть backup `steppers.cfg` и очистить этот блок.
# - risky: запускать с готовой аварийной остановкой питания.

[gcode_macro TREED_Z_PARK_ZERO_TMC]
description: "TEMP: Z0 touch через TMC5160 StallGuard"
variable_sgt: -20
variable_current: 0.35
variable_restore_current: 0.65
variable_lift_z: 5.0
variable_xy_speed: 6000
gcode:
  {% set cfg = printer["gcode_macro TREED_Z_PARK_ZERO_TMC"] %}
  {% set geo = printer["gcode_macro _TREED_GEOMETRY_CFG"] %}
  {% set sgt = params.SGT|default(cfg.sgt)|int %}
  {% set current = params.CURRENT|default(cfg.current)|float %}
  {% set restore_current = params.RESTORE_CURRENT|default(cfg.restore_current)|float %}
  {% set lift_z = params.LIFT_Z|default(cfg.lift_z)|float %}
  {% set xy_speed = params.XY_SPEED|default(cfg.xy_speed)|float %}
  {% set th = printer.toolhead %}

  {% set touch_x = geo.bed_origin_x|float + (geo.bed_size_x|float * geo.bed_dir_x|float / 2.0) %}
  {% set touch_y = geo.bed_origin_y|float + (geo.bed_size_y|float * geo.bed_dir_y|float / 2.0) %}

  {% if touch_x < th.axis_minimum.x|float or touch_x > th.axis_maximum.x|float %}
    {action_raise_error("TREED_Z_PARK_ZERO_TMC: центр стола по X вне механики")}
  {% endif %}
  {% if touch_y < th.axis_minimum.y|float or touch_y > th.axis_maximum.y|float %}
    {action_raise_error("TREED_Z_PARK_ZERO_TMC: центр стола по Y вне механики")}
  {% endif %}

  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}

  G90
  G1 X{touch_x} Y{touch_y} F{xy_speed}
  M400

  RESPOND PREFIX="treed" MSG="TMC Z touch: center=({touch_x},{touch_y}) sgt={sgt} current={current}"
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={current}
  SET_TMC_FIELD STEPPER=stepper_z FIELD=SGT VALUE={sgt}
  G4 P1000

  G28.1 Z
  G90
  G1 Z{lift_z} F300

  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={restore_current}
  RESPOND PREFIX="treed" MSG="TMC Z touch: done, lifted to Z={lift_z}, current restored to {restore_current}"
